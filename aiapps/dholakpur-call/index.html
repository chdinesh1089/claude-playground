<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dholakpur Call</title>
<meta name="description" content="Video calls where you become a 3D Chhota Bheem, Chutki, Raju, Kalia, Jaggu or Indumati, an open-source VRM avatar, or your own .vrm, in real time. Your expressions, head and hands carry over, so you can wave. Peer-to-peer WebRTC, and your real face never leaves the browser.">
<meta name="theme-color" content="#1c130c">
<style>
:root {
  --bg: #1c130c;
  --panel: #2a1d12;
  --panel-2: #36261a;
  --line: #4a3524;
  --text: #fbefe1;
  --muted: #c9b29a;
  --saffron: #ff9a2e;
  --saffron-2: #ffb85c;
  --green: #3fae5a;
  --red: #e5484d;
  --radius: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

/* ---------- Lobby ---------- */
#lobby {
  min-height: 100%;
  display: grid;
  place-items: center;
  padding: 48px 16px 40px;
}
.lobby-card {
  width: min(1040px, 100%);
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
  gap: 28px;
  align-items: start;
}
@media (max-width: 820px) { .lobby-card { grid-template-columns: 1fr; gap: 20px; } }
.brand h1 {
  margin: 0 0 4px;
  font-size: clamp(26px, 4vw, 36px);
  letter-spacing: -0.01em;
}
.brand h1 span { color: var(--saffron); }
.brand p { margin: 0 0 18px; color: var(--muted); }
.preview {
  position: relative;
  aspect-ratio: 4 / 3;
  border-radius: var(--radius);
  overflow: hidden;
  background: #0f0a06;
  border: 1px solid var(--line);
}
.preview canvas, .preview video {
  width: 100%; height: 100%; object-fit: cover; display: block;
  transform: scaleX(-1);
}
.preview .start-cam {
  position: absolute; inset: 0; margin: auto;
  width: max-content; height: max-content;
  padding: 12px 20px; border-radius: 999px; border: 0;
  background: var(--saffron); color: #2a1300; font-weight: 700;
  box-shadow: 0 6px 24px rgba(0,0,0,.35);
}
.chip {
  position: absolute; left: 12px; bottom: 12px;
  padding: 5px 10px; border-radius: 999px;
  background: rgba(20, 12, 6, .72); color: var(--text);
  font-size: 13px; display: flex; gap: 6px; align-items: center;
  backdrop-filter: blur(6px);
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--green); }
.dot.warn { background: var(--saffron); }
.dot.bad { background: var(--red); }
.privacy { margin: 10px 2px 0; color: var(--muted); font-size: 13px; }

.form { display: grid; gap: 16px; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.field input[type=text] {
  width: 100%; padding: 11px 14px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--line); outline: none;
}
.field input[type=text]:focus { border-color: var(--saffron); }
.chars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.char-btn {
  padding: 0; border-radius: 12px; overflow: hidden;
  background: var(--panel); border: 2px solid var(--line);
  text-align: center;
}
.char-btn canvas { display: block; width: 100%; aspect-ratio: 4 / 3; }
.char-btn span { display: block; padding: 4px 0 6px; font-size: 13px; font-weight: 600; }
.char-btn[aria-pressed=true] { border-color: var(--saffron); background: var(--panel-2); }
.char-btn.upload .plus { aspect-ratio: 4 / 3; display: grid; place-items: center; font-size: 34px; color: var(--muted); }
.chars-sub { grid-column: 1 / -1; margin: 8px 2px 0; font-size: 13px; color: var(--muted); }
.chars-sub span { font-size: 12px; }
.chars-sub a { color: var(--saffron-2); }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; color: var(--muted); }
.seg button[aria-pressed=true] { background: var(--panel-2); color: var(--text); }
.primary {
  width: 100%; padding: 14px; border: 0; border-radius: 14px;
  background: var(--saffron); color: #2a1300; font-weight: 800; font-size: 16px;
}
.primary:disabled { opacity: .55; cursor: default; }
.room-note { color: var(--muted); font-size: 13px; margin: -6px 2px 0; }
.room-note code { color: var(--saffron-2); }
.err { color: #ffb4b4; font-size: 13px; margin: 0; }

/* ---------- Call ---------- */
#call { position: fixed; inset: 0; display: flex; flex-direction: column; }
#grid {
  flex: 1; min-height: 0;
  display: grid; gap: 10px; padding: 12px 12px 0;
  grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr));
  grid-auto-rows: minmax(0, 1fr);
  align-content: center;
}
.tile {
  position: relative; border-radius: var(--radius); overflow: hidden;
  background: #0f0a06; border: 2px solid transparent;
  min-height: 0; transition: border-color .15s;
}
.tile.speaking { border-color: var(--saffron); }
.tile video, .tile canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: contain; background: #0f0a06;
}
.tile.self video, .tile.self canvas { transform: scaleX(-1); }
.tile .label {
  position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 20px);
  padding: 4px 10px; border-radius: 999px; font-size: 13px;
  background: rgba(20, 12, 6, .72); backdrop-filter: blur(6px);
  display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tile .label .as { color: var(--muted); }
.tile .label svg { width: 14px; height: 14px; flex: none; color: var(--red); }
.tile .waiting {
  position: absolute; inset: 0; display: grid; place-items: center;
  color: var(--muted); font-size: 14px; text-align: center; padding: 16px;
}
.tile .real-warn {
  position: absolute; top: 10px; left: 10px;
  padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
  background: var(--red); color: #fff;
}
.empty-room {
  border: 2px dashed var(--line); border-radius: var(--radius);
  display: grid; place-items: center; text-align: center; padding: 20px; color: var(--muted);
}
.empty-room b { color: var(--text); display: block; font-size: 17px; margin-bottom: 6px; }
.empty-room button { margin-top: 12px; }

#bar {
  display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
}
.ctl {
  display: inline-flex; align-items: center; gap: 8px;
  height: 46px; min-width: 46px; padding: 0 14px; justify-content: center;
  border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
}
.ctl svg { width: 20px; height: 20px; flex: none; }
.ctl.off { background: var(--red); border-color: var(--red); color: #fff; }
.ctl.warn { background: #5a2020; border-color: var(--red); }
.ctl.leave { background: var(--red); border-color: var(--red); color: #fff; }
.ctl .txt { font-size: 14px; }
.ctl .badge {
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--saffron); color: #2a1300; font-size: 11px; font-weight: 800;
  display: inline-grid; place-items: center;
}
@media (max-width: 640px) { .ctl .txt { display: none; } .ctl { padding: 0 11px; min-width: 44px; height: 44px; } #bar { gap: 6px; } }

.popover {
  position: fixed; bottom: calc(80px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
  width: min(420px, calc(100% - 32px));
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px; box-shadow: 0 16px 48px rgba(0,0,0,.5); z-index: 20;
  max-height: calc(100vh - 120px); overflow-y: auto;
}
.popover .chars { grid-template-columns: repeat(3, 1fr); }

#chat {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 100%);
  background: var(--panel); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; z-index: 30;
}
@media (min-width: 760px) { body.chat-open #call { right: 360px; } }
#chat header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); }
#chat header b { font-size: 16px; }
#chat header button { border: 0; background: none; padding: 6px; border-radius: 8px; }
#chat header button svg { width: 20px; height: 20px; display: block; }
#msgs { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.msg .who { font-size: 12px; color: var(--muted); }
.msg .body { overflow-wrap: anywhere; }
.msg.me .who { color: var(--saffron-2); }
.msg.sys { color: var(--muted); font-size: 13px; font-style: italic; }
#chatForm { display: flex; gap: 8px; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
#chatForm input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); outline: none; }
#chatForm button { border: 0; border-radius: 12px; padding: 0 14px; background: var(--saffron); color: #2a1300; font-weight: 700; }

#toast {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  max-width: calc(100% - 32px);
  padding: 10px 16px; border-radius: 999px; z-index: 40;
  background: var(--panel-2); border: 1px solid var(--line);
  box-shadow: 0 8px 30px rgba(0,0,0,.4); font-size: 14px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.back { position: fixed; top: 10px; left: 12px; color: var(--muted); font-size: 13px; text-decoration: none; }
.back:hover { color: var(--text); }
</style>
</head>

<a class="back" href="../../">← All apps</a>

<!-- ============ Lobby ============ -->
<main id="lobby">
  <div class="lobby-card">
    <section>
      <div class="brand">
        <h1>Dholakpur <span>Call</span></h1>

      </div>

        <div class="chip" id="trackChip"><span class="dot"></span><span>Camera off</span></div>
      </div>

    </section>
    <section class="form">
      <div class="field">
        <label for="name">Your name</label>
        <input type="text" id="name" maxlength="32" placeholder="e.g. Dinesh" autocomplete="nickname">
      </div>
      <div class="field">
        <label>Character</label>
        <div class="chars" id="lobbyChars"></div>
      </div>
      <div class="field">
        <label>Background</label>
        <div class="seg" id="bgSeg">

          <button type="button" data-bg="plain" aria-pressed="false">Plain</button>

      </div>
      <button class="primary" id="joinBtn" type="button">Start a meeting</button>
      <p class="room-note" id="roomNote"></p>
      <p class="err" id="lobbyErr" hidden></p>
    </section>
  </div>
</main>

<!-- ============ Call ============ -->
<div id="call" hidden>
  <div id="grid"></div>
  <div id="bar">
    <button class="ctl" id="micBtn" type="button" title="Mute (M)"></button>

      <span class="txt">Character</span>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      <span class="txt">Set neutral</span>
    </button>
    <button class="ctl" id="realBtn" type="button" title="Send your real camera instead of the cartoon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      <span class="txt">Real me</span>

    <button class="ctl" id="inviteBtn" type="button" title="Copy invite link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
      <span class="txt">Invite</span>
    </button>
    <button class="ctl" id="chatBtn" type="button" title="Chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="txt">Chat</span><span class="badge" id="chatBadge" hidden>0</span>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
      <span class="txt">Leave</span>
    </button>
  </div>
  <div class="popover" id="charPop" hidden>
    <div class="chars" id="callChars"></div>
  </div>
</div>

<aside id="chat" hidden>
  <header><b>Chat</b><button type="button" id="chatClose" aria-label="Close chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></header>
  <div id="msgs"></div>
  <form id="chatForm" autocomplete="off"><input id="chatInput" maxlength="500" placeholder="Message everyone"><button type="submit">Send</button></form>
</aside>
<div id="toast" hidden></div>
<input type="file" id="vrmFile" accept=".vrm" hidden>

const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

function hash(x, y, z) {

  h = Math.imul(h ^ (h >>> 13), 1274126177);

    lerp(lerp(hash(xi, yi, zi + 1), hash(xi + 1, yi, zi + 1), u), lerp(hash(xi, yi + 1, zi + 1), hash(xi + 1, yi + 1, zi + 1), u), v), w);
}

  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {

  ['gnome', 'Gnome', '047_David'], ['kate', 'Kate', '038_Kate'], ['grandpa', 'Super Grandpa', '004_OldMoustache'],
]) CHARS[id] = { name, vrm: `avatars/100Avatars_${file}.vrm`, thumb: `avatars/${id}.png` };
const CHAR_IDS = Object.keys(CHARS);

/* ---------- head shape and morphs ---------- */
function makeShape(hp) {
  return (d, o) => {
    let x = d.x, y = d.y, z = d.z;
    const lower = smoothstep(-.15, -1, y), front = smoothstep(-.3, .6, z);
    x *= 1 - .12 * lower;                                  // jaw narrows toward the chin
    y -= (hp.chin || 0) * lower * front;
    z += .06 * lower * front;
    x *= 1 + (hp.cheek || 0) * gauss(y + .35, .08) * front;  // cheeks
    if (hp.muzzle) z += hp.muzzle * Math.exp(-(x * x) / .12 - ((y + .38) ** 2) / .07) * front;
    if (hp.jowl) { const j = hp.jowl * Math.exp(-(x * x) / .3 - ((y + .82) ** 2) / .04) * front; y -= j * .6; z += j; }
    return o.set(x * hp.w, y * hp.h, z * hp.d);
  };
}
const jawW = d => smoothstep(-.47, -.72, d.y) * smoothstep(-.4, .3, d.z);
const puffW = d => Math.exp(-((Math.abs(d.x) - .5) ** 2) / .03 - ((d.y + .3) ** 2) / .05) * smoothstep(0, .4, d.z);
const smileW = (d, s) => Math.exp(-(((d.x - s * .42) ** 2) + ((d.y + .28) ** 2)) / .025) * smoothstep(0, .4, d.z);
const MORPHS = [
  (d, o) => o.set(0, -.2, -.04).multiplyScalar(jawW(d)),
  (d, o) => o.copy(d).multiplyScalar(.12 * puffW(d)),
  (d, o) => o.set(-.012, .045, .02).multiplyScalar(smileW(d, -1)),
  (d, o) => o.set(.012, .045, .02).multiplyScalar(smileW(d, 1)),
];

function buildHeadGeometry(shape) {
  const g = new THREE.SphereGeometry(1, 96, 72, PHI0);
  const pos = g.attributes.position, n = pos.count;
  const d = V3(), p = V3(), dirs = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    d.fromBufferAttribute(pos, i).normalize(); d.toArray(dirs, i * 3);
    shape(d, p); pos.setXYZ(i, p.x, p.y, p.z);
  }
  g.computeVertexNormals();
  const baseN = g.attributes.normal.array.slice();
  const tmp = new THREE.BufferGeometry(); tmp.setIndex(g.index);
  g.morphAttributes.position = []; g.morphAttributes.normal = [];
  for (const fn of MORPHS) {
    const dp = new Float32Array(n * 3), full = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      d.fromArray(dirs, i * 3); fn(d, p);
      dp[i * 3] = p.x; dp[i * 3 + 1] = p.y; dp[i * 3 + 2] = p.z;
      full[i * 3] = pos.getX(i) + p.x; full[i * 3 + 1] = pos.getY(i) + p.y; full[i * 3 + 2] = pos.getZ(i) + p.z;
    }
    tmp.setAttribute('position', new THREE.BufferAttribute(full, 3)); tmp.computeVertexNormals();
    const dn = new Float32Array(n * 3), tn = tmp.attributes.normal.array;
    for (let j = 0; j < n * 3; j++) dn[j] = tn[j] - baseN[j];
    g.morphAttributes.position.push(new THREE.BufferAttribute(dp, 3));
    g.morphAttributes.normal.push(new THREE.BufferAttribute(dn, 3));
  }
  g.morphTargetsRelative = true;
  return g;
}

// Points on the front of the face, addressed by unit-sphere x/y. `lift` also
// applies the current morph weights so decals and lips stay on the skin.
function makeFace(shape) {
  const d = V3(), a = V3(), b = V3(), t = V3(), m = V3();
  const dir = (x, y) => d.set(x, y, Math.sqrt(Math.max(.0025, 1 - x * x - y * y))).normalize();
  const face = {
    point(x, y, o = V3()) { return shape(dir(x, y), o); },
    normal(x, y, o = V3()) {
      const e = .01;
      face.point(x + e, y, a); face.point(x - e, y, t); a.sub(t);
      face.point(x, y + e, b); face.point(x, y - e, t); b.sub(t);
      return o.crossVectors(a, b).normalize();
    },
    lift(x, y, w, o = V3()) {
      shape(dir(x, y), o);
      for (let i = 0; i < 4; i++) if (w[i] > .001) { MORPHS[i](d, m); o.addScaledVector(m, w[i]); }
      return o;
    },
  };
  return face;
}

/* ---------- painted textures ---------- */
function headPainter(ch) {
  const sk = rgb(ch.skin), bl = rgb('#e8736a'), fur = rgb(ch.skin), mask = ch.face ? rgb(ch.face) : null;
  return (d, o) => {
    const n = fbm(d.x * 9 + 3, d.y * 9, d.z * 9);
    let c;
    if (ch.monkey) {
      // peach mask: two eye patches and the muzzle, fur everywhere else
      const eyes = Math.hypot(Math.abs(d.x) - .29, (d.y - .06) * .9) < .3;
      const muzzle = ((d.x / .52) ** 2 + ((d.y + .4) / .4) ** 2) < 1 ? 1 : 0;
      const m = (eyes || muzzle) && d.z > .2 ? 1 : 0;
      const streak = noise(d.x * 40, d.y * 12, d.z * 40);
      c = m ? shade(mask, .95 + n * .08) : shade(fur, .8 + streak * .35);
    } else {
      c = shade(sk, .94 + n * .1);
      const blush = (ch.blush ?? .22) * Math.exp(-(((Math.abs(d.x) - .5) ** 2) + ((d.y + .26) ** 2)) / .02) * smoothstep(0, .4, d.z);
      c = mixc(c, bl, blush);
    }
    const ex = ch.eye.x, ey = ch.eye.y, er = ch.eye.r;
    const sock = Math.max(gauss(Math.hypot(d.x - ex, (d.y - ey) * 1.2) - er * 1.05, .004), gauss(Math.hypot(d.x + ex, (d.y - ey) * 1.2) - er * 1.05, .004));
    c = shade(c, 1 - .08 * sock * smoothstep(0, .5, d.z));
    c = shade(c, 1 - .07 * gauss(Math.hypot(d.x * 1.6, d.y + .27), .004) * smoothstep(.3, .8, d.z));
    c = shade(c, 1 - .14 * smoothstep(-.55, -1, d.y) * smoothstep(.6, -.2, d.z));
    put(o, c);
  };
}

function hairPainter(ch) {
  const H = ch.hairDef, base = rgb(ch.hair), hi = mixc(base, [150, 120, 100], .6);
  return (d, o) => {
    const az = Math.atan2(d.x, d.z) / Math.PI, a = Math.abs(az);
    let line = a < .5 ? lerp(H.front, H.side, smoothstep(0, .5, a)) : lerp(H.side, H.back, smoothstep(.5, 1, a));
    line += (H.wave || 0) * Math.sin(az * 46);
    if (H.spikes && a < .34) { const t = az * 8; const tri = 1 - Math.abs((t - Math.floor(t)) - .5) * 2; line -= H.spikes * tri * smoothstep(.34, .2, a); }
    let alpha = smoothstep(line - .012, line + .012, d.y);
    if (H.part && d.z > .1 && Math.abs(d.x) < .014 && d.y > line) alpha = 0;
    const strand = noise(az * 70, d.y * 5, 1) * .6 + noise(az * 160, d.y * 9, 2) * .4;
    const band = Math.exp(-((d.y - .72) ** 2) / .006) * .55 + Math.exp(-((d.y - .2) ** 2) / .01) * .25 * smoothstep(.4, .9, a);
    let c = shade(base, .75 + strand * .5);
    c = mixc(c, hi, band * (.5 + strand * .5));
    put(o, c, alpha * 255);
  };
}

function eyePainter(ch) {
  const iris = rgb(ch.iris), irisHi = mixc(iris, [210, 160, 90], .35), sclera = rgb('#f6f1ea');
  return (d, o) => {
    const ang = Math.acos(clamp(d.z, -1, 1));
    const pupilA = .24, irisA = .5;
    if (ang < pupilA) return put(o, [10, 7, 6]);
    if (ang < irisA) {
      const t = (ang - pupilA) / (irisA - pupilA);
      const fib = noise(Math.atan2(d.y, d.x) * 9, t * 3, 0);
      let c = mixc(irisHi, iris, t * .8);
      c = shade(c, .75 + fib * .45);
      if (t > .8) c = mixc(c, [15, 10, 8], (t - .8) * 4);   // limbal ring
      return put(o, c);
    }
    const edge = smoothstep(.3, -.4, d.z);
    put(o, mixc(sclera, [215, 185, 175], edge * .7));
  };
}

function bodyPainter(id, ch) {
  const sk = rgb(ch.skin);
  const F = {
    bheem: (p) => {
      const n = [.6, .8], c0 = [-.1, -1.5];
      const dd = (p.x - c0[0]) * n[0] + (p.y - c0[1]) * n[1];
      if (p.y < -2.75) return shade(rgb('#e0690f'), .9 + .1 * Math.sin(p.x * 14));
      if (Math.abs(dd) < .24) return shade(rgb('#f07a17'), .95 + .05 * Math.sin((p.x * .8 - p.y * .6) * 9 + dd * 6));
      let c = shade(sk, .96 + fbm(p.x * 4, p.y * 4, p.z * 4) * .08);
      const pec = gauss(p.y + 1.15 + .12 * p.x * p.x, .004) * smoothstep(.95, .2, Math.abs(p.x)) * (p.z > 0 ? 1 : 0);
      return shade(c, 1 - pec * .12);
    },
    chutki: (p) => neckline(p, rgb('#e8578c'), rgb('#f5c13b')),
    raju: (p) => {
      if (p.y > -.3) return rgb('#d23a2a');
      if (p.z > 0 && Math.abs(p.x) < .045 && p.y > -1.4) return rgb('#d23a2a');
      return shade(rgb('#ffc42e'), .93 + fbm(p.x * 6, p.y * 6, p.z * 6) * .1);
    },
    kalia: (p) => {
      const vest = (Math.abs(p.x) > .36 || p.z < 0) && p.y < -.18;
      if (vest) return shade(rgb('#2e8b4f'), Math.abs(Math.abs(p.x) - .36) < .04 && p.z > 0 ? .75 : .95 + fbm(p.x * 5, p.y * 5, p.z * 5) * .1);
      return p.y > -.2 && Math.abs(p.x) < .3 && p.z > 0 ? sk : shade(rgb('#f1e4c6'), .95 + fbm(p.x * 6, p.y * 6, p.z * 6) * .08);
    },
    jaggu: (p) => {
      const belly = p.z > 0 && (p.x / .75) ** 2 + ((p.y + 2) / 1.3) ** 2 < 1;
      return belly ? shade(rgb('#e2b88a'), .95 + fbm(p.x * 6, p.y * 6, 1) * .1)
        : shade(sk, .8 + noise(p.x * 30, p.y * 8, p.z * 30) * .35);
    },
    indumati: (p) => {
      if (p.y < -2.9) return rgb('#e8b53a');
      return neckline(p, rgb('#7b3aa6'), rgb('#e8b53a'));
    },
  };
  function neckline(p, cloth, trim) {
    const e = (p.x / .55) ** 2 + ((p.y + .1) / .5) ** 2;
    if (p.z > 0 && e < 1) return sk;
    if (p.z > 0 && e < 1.35) return trim;
    return shade(cloth, .93 + fbm(p.x * 6, p.y * 6, p.z * 6) * .1);
  }
  return F[id];
}

/* ---------- geometry helpers ---------- */
// A tube whose points and radii change every frame. Rings are oriented with a
// reference normal per point so lips and brows don't twist.
class DynTube {
  constructor(n, radial, material) {
    this.n = n; this.radial = radial;
    const verts = n * (radial + 1);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts * 3), 3));
    g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(verts * 3), 3));
    const idx = [];
    for (let i = 0; i < n - 1; i++) for (let j = 0; j < radial; j++) {
      const a = i * (radial + 1) + j, b = a + radial + 1;
      idx.push(a, a + 1, b, b, a + 1, b + 1);
    }
    g.setIndex(idx);
    this.mesh = new THREE.Mesh(g, material);
    this.mesh.frustumCulled = false;
    this.T = V3(); this.N = V3(); this.B = V3(); this.v = V3();
  }
  update(pts, norms, radius) {
    const pos = this.mesh.geometry.attributes.position, nor = this.mesh.geometry.attributes.normal;
    const { n, radial, T, N, B, v } = this;
    for (let i = 0; i < n; i++) {
      const p = pts[i];
      T.subVectors(pts[Math.min(n - 1, i + 1)], pts[Math.max(0, i - 1)]).normalize();
      N.copy(norms[i]).addScaledVector(T, -norms[i].dot(T)).normalize();
      B.crossVectors(T, N);
      const r = radius(i / (n - 1));
      for (let j = 0; j <= radial; j++) {
        const a = j / radial * TAU;
        v.copy(N).multiplyScalar(Math.cos(a)).addScaledVector(B, Math.sin(a));
        const k = i * (radial + 1) + j;
        nor.setXYZ(k, v.x, v.y, v.z);
        pos.setXYZ(k, p.x + v.x * r, p.y + v.y * r, p.z + v.z * r);
      }
    }
    pos.needsUpdate = nor.needsUpdate = true;
  }
}

function skinMaterial(color, extra = {}) {
  return new THREE.MeshPhysicalMaterial({
    color, roughness: .55, sheen: .55, sheenColor: new THREE.Color('#ff8a66'), sheenRoughness: .5, clearcoat: .04, ...extra,
  });
}
function shadowed(o) { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; }

// Torso: a lathe-like surface with a flattened chest, painted per texel.
const TORSO_PROFILE = new THREE.SplineCurve([
  new THREE.Vector2(.34, .25), new THREE.Vector2(.44, 0), new THREE.Vector2(.9, -.17), new THREE.Vector2(1.3, -.4),
  new THREE.Vector2(1.5, -.85), new THREE.Vector2(1.55, -1.6), new THREE.Vector2(1.52, -3.6),
]);
function torsoPoint(u, v, w, o) {
  const q = TORSO_PROFILE.getPoint(v), a = (u - .5) * TAU;
  return o.set(q.x * Math.sin(a) * w, q.y, q.x * Math.cos(a) * .62);
}
function buildTorso(id, ch) {
  const NU = 64, NV = 48, w = ch.body.w;
  const pos = [], uv = [], idx = [], p = V3();
  for (let j = 0; j <= NV; j++) for (let i = 0; i <= NU; i++) {
    torsoPoint(i / NU, j / NV, w, p); pos.push(p.x, p.y, p.z); uv.push(i / NU, 1 - j / NV);
  }
  for (let j = 0; j < NV; j++) for (let i = 0; i < NU; i++) {
    const a = j * (NU + 1) + i, b = a + NU + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  const paint = bodyPainter(id, ch);
  const map = paintCanvas(512, 512, (u, v, o) => put(o, paint(torsoPoint(u, v, w, p))));
  return new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({
    map: texture(map), roughness: .85, sheen: id === 'bheem' || id === 'jaggu' ? .4 : 0, sheenColor: new THREE.Color('#ff8a66'), sheenRoughness: .7,
  }));
}

/* ---------- hands: canonical pose, used for rest and for tests ---------- */
// An open right hand seen from the front, fingers up, wrist at the origin.
const HAND_CANON = [
  [0, 0, 0], [-.33, .22, .06], [-.58, .44, .09], [-.76, .62, .1], [-.9, .8, .1],
  [-.26, .95, 0], [-.31, 1.35, 0], [-.34, 1.6, 0], [-.36, 1.82, 0],
  [0, 1, 0], [0, 1.45, 0], [0, 1.73, 0], [0, 1.96, 0],
  [.22, .95, 0], [.25, 1.35, 0], [.27, 1.58, 0], [.29, 1.79, 0],
  [.42, .85, 0], [.5, 1.12, 0], [.55, 1.3, 0], [.58, 1.46, 0],
];
const FINGER_BONES = [[0, 1], [1, 2], [2, 3], [3, 4], [5, 6], [6, 7], [7, 8], [9, 10], [10, 11], [11, 12], [13, 14], [14, 15], [15, 16], [17, 18], [18, 19], [19, 20]];
const FINGER_R = [.1, .1, .09, .08, .078, .072, .066, .082, .076, .07, .076, .07, .064, .066, .06, .055];
const JOINT_R = [0, .1, .095, .085, .08, .08, .074, .068, .066, .084, .078, .072, .07, .078, .072, .066, .064, .068, .062, .058, .055];
// Normalised image landmarks for a hand at (x, y), `size` = wrist-to-knuckle
// height as a fraction of the frame, rotated by `angle` radians, fingers curled by `curl`.
function handLandmarks(x, y, size, angle = 0, curl = 0, mirror = false) {
  const c = Math.cos(angle), s = Math.sin(angle);
  return HAND_CANON.map(([hx, hy, hz], i) => {
    const f = i > 4 ? (i - 1) % 4 : 0;   // joint index along the finger
    if (i > 4 && f > 0) hy -= curl * f * .25;
    if (mirror) hx = -hx;
    const px = hx * c - hy * s, py = hx * s + hy * c;
    return { x: x + px * size * .75, y: y - py * size, z: -hz * size };
  });
}

/* ---------- one character ---------- */
const sharedGeo = {
  sphere: new THREE.SphereGeometry(1, 24, 16),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 18, 1, true),
};

function buildCharacter(id) {
  const ch = CHARS[id];
  const shape = makeShape(ch.head), face = makeFace(shape);
  const skin = skinMaterial(ch.skin);
  const lidMat = skinMaterial(new THREE.Color(ch.monkey ? ch.face : ch.skin));
  const root = new THREE.Group();
  const scale = ch.scale || 1;

  // --- head ---
  const headRoot = new THREE.Group();  // pivot at the top of the neck
  const head = new THREE.Group();
  head.position.set(0, .72, .1);
  head.scale.setScalar(scale);
  headRoot.add(head); root.add(headRoot);
  const headTex = texture(paintCanvas(512, 256, (u, v, o) => headPainter(ch)(dirFromUV(u, v, V3()), o)));
  const headMesh = new THREE.Mesh(buildHeadGeometry(shape), skinMaterial('#ffffff', { map: headTex }));
  head.add(headMesh);

  // hair shell
  if (ch.hairDef) {
    const g = new THREE.SphereGeometry(1, 96, 72, PHI0);
    const pos = g.attributes.position, d = V3(), p = V3();
    for (let i = 0; i < pos.count; i++) {
      d.fromBufferAttribute(pos, i).normalize(); shape(d, p);
      p.multiplyScalar(1.03 + (ch.hairDef.volume || .05) * smoothstep(.1, 1, d.y) + .02 * smoothstep(0, -1, d.z));
      pos.setXYZ(i, p.x, p.y, p.z);
    }
    g.computeVertexNormals();
    const paint = hairPainter(ch);
    const map = paintCanvas(512, 256, (u, v, o) => paint(dirFromUV(u, v, d), o));
    const mat = new THREE.MeshStandardMaterial({
      map: texture(map), bumpMap: texture(map, false), bumpScale: 3, roughness: .45,
      alphaTest: .5, alphaToCoverage: true, side: THREE.DoubleSide,
    });
    head.add(new THREE.Mesh(g, mat));
  }

  // ears
  for (const s of [-1, 1]) {
    const big = ch.monkey;
    const ear = new THREE.Group();
    const p = shape(V3(s, ch.eye.y - .05, -.06).normalize(), V3());
    ear.position.copy(p).multiplyScalar(.97);
    ear.rotation.y = s * .45;
    const outer = new THREE.Mesh(sharedGeo.sphere, ch.monkey ? skinMaterial(ch.skin) : skin);
    outer.scale.set(big ? .1 : .09, big ? .3 : .22, big ? .3 : .15);
    const inner = new THREE.Mesh(sharedGeo.sphere, skinMaterial(big ? '#e39a8a' : new THREE.Color(ch.skin).multiplyScalar(.82)));
    inner.scale.set(.05, big ? .2 : .14, big ? .2 : .09);
    inner.position.x = s * .045;
    ear.add(outer, inner);
    if (big) ear.scale.setScalar(1.15);
    head.add(ear);
  }

  // eyes: eyeball (rotates for gaze), lids (rotate to blink), lash line and a catchlight
  const eyeTex = texture(paintCanvas(256, 128, (u, v, o) => eyePainter(ch)(dirFromUV(u, v, V3()), o)));
  const eyeMat = new THREE.MeshPhysicalMaterial({ map: eyeTex, roughness: .3, clearcoat: 1, clearcoatRoughness: .04 });
  const lashMat = new THREE.MeshStandardMaterial({ color: '#120b08', roughness: .7 });
  const sparkMat = new THREE.MeshBasicMaterial({ color: '#ffffff', toneMapped: false });
  const eyes = [-1, 1].map(s => {
    const r = ch.eye.r;
    const socket = new THREE.Group();
    const n = face.normal(s * ch.eye.x, ch.eye.y);
    socket.position.copy(face.point(s * ch.eye.x, ch.eye.y)).addScaledVector(n, -r * .5);
    socket.rotation.y = s * .1;
    const ball = new THREE.Mesh(new THREE.SphereGeometry(r, 40, 28, PHI0), eyeMat);
    const upper = new THREE.Mesh(new THREE.SphereGeometry(r * 1.05, 40, 14, 0, TAU, 0, Math.PI / 2), lidMat);
    const lower = new THREE.Mesh(new THREE.SphereGeometry(r * 1.02, 40, 12, 0, TAU, Math.PI / 2, Math.PI / 2), lidMat);
    const lash = new THREE.Mesh(new THREE.TorusGeometry(r * 1.05, r * (ch.lashes ? .09 : .065), 8, 40, Math.PI), lashMat);
    lash.rotation.x = Math.PI / 2;
    upper.add(lash);
    if (ch.lashes) for (let k = 0; k < 3; k++) {
      const a = (.12 + k * .11) * Math.PI;           // around the outer corner
      const l = new THREE.Mesh(new THREE.ConeGeometry(r * .06, r * .42, 6), lashMat);
      l.position.set(s * Math.cos(a) * r * 1.12, r * .05, Math.sin(a) * r * 1.12);
      l.rotation.set(-.5, 0, -s * (1.15 - k * .25));
      upper.add(l);
    }
    const spark = new THREE.Mesh(sharedGeo.sphere, sparkMat);
    spark.scale.setScalar(r * .085);
    spark.position.set(-r * .2, r * .24, r * .99);
    socket.add(ball, upper, lower, spark);
    head.add(socket);
    return { ball, upper, lower, spark };
  });

  // brows
  const browMat = new THREE.MeshStandardMaterial({ color: ch.brow, roughness: .85 });
  const brows = [-1, 1].map(s => {
    const t = new DynTube(12, 8, browMat);
    head.add(t.mesh);
    return { s, tube: t, pts: Array.from({ length: 12 }, () => V3()), nor: Array.from({ length: 12 }, () => V3()) };
  });

  // nose
  if (ch.nose) {
    const nose = new THREE.Mesh(sharedGeo.sphere, skinMaterial(new THREE.Color(ch.skin).lerp(new THREE.Color('#d0604a'), .12)));
    const n = face.normal(0, -.16);
    nose.position.copy(face.point(0, -.16)).addScaledVector(n, ch.nose * .35);
    nose.scale.set(ch.nose * 1.2, ch.nose * .95, ch.nose * .9);
    head.add(nose);
  } else if (ch.monkey) {
    for (const s of [-1, 1]) {
      const nn = new THREE.Mesh(sharedGeo.sphere, new THREE.MeshStandardMaterial({ color: '#3a2112', roughness: .6 }));
      nn.position.copy(face.point(s * .07, -.24)).addScaledVector(face.normal(s * .07, -.24), .01);
      nn.scale.set(.03, .04, .02);
      head.add(nn);
    }
  }

  // mouth: interior decal + lips
  const mouth = buildMouth(ch, face);
  head.add(mouth.decal, mouth.upper.mesh, mouth.lower.mesh);

  // accessories that ride on the head
  const springs = [];
  if (ch.tuft) {
    const pivot = new THREE.Group();
    pivot.position.copy(face.point(.06, .93)).multiplyScalar(1.02);
    const pts = ch.tuft === 'curl'
      ? [V3(0, 0, 0), V3(.04, .22, .08), V3(.16, .42, .12), V3(.34, .44, .1), V3(.4, .3, .08), V3(.3, .2, .06)]
      : [V3(0, 0, 0), V3(.02, .22, .1), V3(.05, .42, .2), V3(.1, .55, .32)];
    const curve = new THREE.CatmullRomCurve3(pts);
    const tube = new DynTube(28, 10, new THREE.MeshStandardMaterial({ color: ch.hair, roughness: .45 }));
    const sp = curve.getPoints(27), nr = sp.map(() => V3(0, 0, 1));
    tube.update(sp, nr, t => .1 * (1 - t * .85));
    pivot.add(tube.mesh);
    head.add(pivot);
    springs.push({ obj: pivot, kind: 'tuft', x: 0, v: 0, z: 0, vz: 0 });
  }
  if (ch.furTufts) {
    const furMat = skinMaterial(ch.skin);
    for (const a of [-.35, 0, .35]) {
      const c = new THREE.Mesh(new THREE.ConeGeometry(.09, .3, 10), furMat);
      c.position.copy(shape(V3(a * .5, 1, .15).normalize(), V3())).multiplyScalar(.98);
      c.rotation.z = -a; c.rotation.x = .25;
      head.add(c);
    }
  }
  if (ch.bindi || ch.tilak) {
    const b = new THREE.Mesh(sharedGeo.sphere, new THREE.MeshPhysicalMaterial({ color: ch.bindi || ch.tilak, roughness: .3, clearcoat: .6 }));
    const y = ch.bindi ? .32 : .36;
    b.position.copy(face.point(0, y)).addScaledVector(face.normal(0, y), .005);
    b.scale.set(ch.bindi ? .035 : .025, ch.bindi ? .035 : .07, .012);
    b.lookAt(b.position.clone().add(face.normal(0, y)));
    head.add(b);
  }
  const gold = new THREE.MeshStandardMaterial({ color: '#f2c14e', metalness: 1, roughness: .28 });
  const ruby = new THREE.MeshPhysicalMaterial({ color: '#c3122f', roughness: .15, clearcoat: 1 });
  if (ch.studs || ch.jhumka) {
    for (const s of [-1, 1]) {
      const anchor = new THREE.Group();
      anchor.position.copy(shape(V3(s, ch.eye.y - .28, .02).normalize(), V3())).multiplyScalar(1.02);
      const stud = new THREE.Mesh(sharedGeo.sphere, gold); stud.scale.setScalar(.04);
      anchor.add(stud);
      if (ch.jhumka) {
        const swing = new THREE.Group();
        const bell = new THREE.Mesh(new THREE.ConeGeometry(.08, .12, 16, 1, true), gold);
        bell.position.y = -.12;
        const drop = new THREE.Mesh(sharedGeo.sphere, ruby); drop.scale.setScalar(.03); drop.position.y = -.2;
        swing.add(bell, drop);
        anchor.add(swing);
        springs.push({ obj: swing, kind: 'swing', x: 0, v: 0, z: 0, vz: 0 });
      }
      head.add(anchor);
    }
  }
  if (ch.crown) {
    const crown = new THREE.Group();
    const band = new THREE.Mesh(new THREE.CylinderGeometry(.5, .55, .14, 48, 1, true), gold);
    crown.add(band);
    for (let k = -2; k <= 2; k++) {
      const a = k * .38;
      const spike = new THREE.Mesh(new THREE.ConeGeometry(.07, .24 - Math.abs(k) * .03, 12), gold);
      spike.position.set(Math.sin(a) * .53, .17, Math.cos(a) * .53);
      const jewel = new THREE.Mesh(sharedGeo.sphere, ruby);
      jewel.scale.setScalar(k === 0 ? .055 : .03);
      jewel.position.set(Math.sin(a) * .56, .0, Math.cos(a) * .56);
      crown.add(spike, jewel);
    }
    crown.position.set(0, .93, -.02); crown.rotation.x = -.18;
    head.add(crown);
  }
  if (ch.tikka) {
    const chain = new THREE.Mesh(sharedGeo.cyl, gold);
    const top = face.point(0, .62), bot = face.point(0, .42);
    chain.position.copy(top).add(bot).multiplyScalar(.5).addScaledVector(face.normal(0, .5), .03);
    chain.scale.set(.008, top.distanceTo(bot), .008);
    chain.quaternion.setFromUnitVectors(Y_AXIS, top.clone().sub(bot).normalize());
    const drop = new THREE.Mesh(sharedGeo.sphere, ruby);
    drop.position.copy(bot).addScaledVector(face.normal(0, .42), .03); drop.scale.set(.04, .055, .025);
    head.add(chain, drop);
  }

  // --- body ---
  const body = new THREE.Group();
  root.add(body);
  const torso = buildTorso(id, ch);
  body.add(torso);
  if (ch.crown) {
    const neck = new THREE.Mesh(new THREE.TorusGeometry(.48, .035, 8, 40, Math.PI * .8), gold);
    neck.rotation.set(Math.PI / 2 + .5, 0, Math.PI * .1);
    neck.position.set(0, -.25, .12);
    const pend = new THREE.Mesh(sharedGeo.sphere, ruby); pend.scale.set(.07, .09, .04); pend.position.set(0, -.58, .44);
    body.add(neck, pend);
  }
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(.33, .38, 1, 24, 1, true).translate(0, .5, 0), skin);
  root.add(neck);

  // long hair behind the shoulders
  let hairBack = null;
  if (ch.longHair) {
    const g = new THREE.CylinderGeometry(1, 1.25, 2.6, 32, 8, true, Math.PI * .55, Math.PI * .9);
    g.translate(0, -1.3, 0);
    hairBack = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: ch.hair, roughness: .5, side: THREE.DoubleSide }));
    hairBack.scale.set(1, 1, .7);
    root.add(hairBack);
  }

  // braids: verlet chains anchored behind the ears
  const braids = [];
  if (ch.braids) {
    const braidMat = new THREE.MeshStandardMaterial({ color: ch.hair, roughness: .5 });
    const ribbon = new THREE.MeshStandardMaterial({ color: '#ff4f8b', roughness: .5 });
    for (const s of [-1, 1]) {
      const N = 11, segs = [];
      for (let k = 0; k < N; k++) {
        const m = new THREE.Mesh(sharedGeo.sphere, braidMat);
        m.scale.set(.13 - k * .005, .15, .11 - k * .004);
        root.add(m); segs.push(m);
      }
      const bow = new THREE.Group();
      for (const side of [-1, 1]) {
        const c = new THREE.Mesh(new THREE.ConeGeometry(.08, .2, 10), ribbon);
        c.rotation.z = side * Math.PI / 2; c.position.x = side * .1;
        bow.add(c);
      }
      root.add(bow);
      braids.push({ s, segs, bow, pts: [], prev: [], anchor: V3(s * .88, -.12, -.12) });
    }
  }

  // --- arms and hands (instanced cylinders and spheres) ---
  const limbMat = skinMaterial('#ffffff');
  const cyl = new THREE.InstancedMesh(sharedGeo.cyl, limbMat, 2 * (4 + FINGER_BONES.length));
  const sph = new THREE.InstancedMesh(sharedGeo.sphere, limbMat, 2 * (4 + 21));
  const palms = [0, 1].map(() => new THREE.Mesh(sharedGeo.sphere, ch.monkey ? skinMaterial(ch.face) : skin));
  cyl.frustumCulled = sph.frustumCulled = false;
  palms.forEach(p => { p.matrixAutoUpdate = false; root.add(p); });
  root.add(cyl, sph);
  const skinCol = new THREE.Color(ch.skin), sleeveCol = new THREE.Color(ch.arms.sleeve || ch.skin);
  const palmSkin = new THREE.Color(ch.monkey ? ch.face : ch.skin);
  const arms = [-1, 1].map(s => ({
    s, pts: HAND_CANON.map(() => V3()), init: false, w: 0,
  }));

  shadowed(root);
  for (const e of eyes) { e.spark.castShadow = false; e.spark.receiveShadow = false; }
  mouth.decal.castShadow = false;

  // --- per-frame state ---
  const tmp = { a: V3(), b: V3(), c: V3(), d: V3(), q: new THREE.Quaternion(), m: new THREE.Matrix4(), s: V3() };
  const bodySpring = { x: 0, v: 0 };
  const lastHead = V3();
  let headVel = V3();
  const SHOULDER = V3(1.12, -.55, 0);

  function placeCyl(i, a, b, r, color) {
    tmp.a.subVectors(b, a); const len = tmp.a.length();
    tmp.q.setFromUnitVectors(Y_AXIS, tmp.a.divideScalar(len || 1));
    tmp.c.addVectors(a, b).multiplyScalar(.5);
    tmp.m.compose(tmp.c, tmp.q, tmp.s.set(r, len, r));
    cyl.setMatrixAt(i, tmp.m); cyl.setColorAt(i, color);
  }
  function placeSph(i, p, r, color) {
    tmp.m.compose(p, tmp.q.identity(), tmp.s.set(r, r, r));
    sph.setMatrixAt(i, tmp.m); sph.setColorAt(i, color);
  }

  function solveElbow(S, W, a, b, pole, out) {
    tmp.d.subVectors(W, S);
    let L = tmp.d.length();
    const k = L > (a + b) * .98 ? L / ((a + b) * .98) : 1;   // stretch a little rather than detach
    a *= k; b *= k;
    L = clamp(L, Math.abs(a - b) + 1e-3, a + b - 1e-3);
    const x = (a * a - b * b + L * L) / (2 * L), h = Math.sqrt(Math.max(0, a * a - x * x));
    tmp.d.normalize();
    tmp.c.copy(pole).addScaledVector(tmp.d, -pole.dot(tmp.d)).normalize();
    return out.copy(S).addScaledVector(tmp.d, x).addScaledVector(tmp.c, h);
  }

  const restPts = HAND_CANON.map(() => V3());
  function restHand(s, S, o) {
    // relaxed hand hanging by the side, fingers down, thumb forward
    const wrist = tmp.b.copy(S).add(tmp.a.set(s * .2, -2.75, .35));
    HAND_CANON.forEach(([x, y, z], i) => {
      const curl = i > 4 ? ((i - 1) % 4) * .06 : 0;
      o[i].set(wrist.x + s * z * .5 - s * .02, wrist.y - y * .5, wrist.z + x * -.5 * 1 + curl);
    });
    return o;
  }

  // keep a point outside the head sphere and the shoulder/chest ellipsoid
  const inv = new THREE.Matrix4(), cq = V3(), cd = V3();
  function collide(p, prev, hc, hr) {
    cd.subVectors(p, hc); const dh = cd.length();
    if (dh < hr) { cd.multiplyScalar((hr - dh) / dh); p.add(cd); prev.add(cd); }
    inv.copy(body.matrixWorld).invert();
    cq.copy(p).applyMatrix4(inv);
    const ax = 1.5 * ch.body.w, by = 1.3, cz = 1.0, cy = -1.25;
    const ex = cq.x / ax, ey = (cq.y - cy) / by, ez = cq.z / cz, l = Math.hypot(ex, ey, ez);
    if (l < 1) {
      cq.set(ex / l * ax, ey / l * by + cy, ez / l * cz).applyMatrix4(body.matrixWorld);
      cd.subVectors(cq, p); p.add(cd); prev.add(cd);
    }
  }

  function update(st, dt, t) {
    const f = st.face;
    // head
    const hx = f.x, hy = f.y, hz = f.z;
    headRoot.position.set(hx, hy - .72, hz - .1);
    headRoot.rotation.set(-f.pitch, f.yaw, -f.roll, 'YXZ');
    headVel.set(hx, hy, hz).sub(lastHead).divideScalar(Math.max(dt, 1e-3));
    lastHead.set(hx, hy, hz);
    // body follows the head with a little lag
    for (let k = 0, steps = Math.ceil(dt / .008); k < steps; k++) {
      const h = dt / steps, acc = 90 * (hx * .85 - bodySpring.x) - 16 * bodySpring.v;
      bodySpring.v += acc * h; bodySpring.x += bodySpring.v * h;
    }
    const breathe = reduceMotion ? 0 : Math.sin(t * 1.7) * .012;
    body.position.set(bodySpring.x, hy * .85 - 1.35 * scale, hz * .8 - .1);
    body.rotation.set(0, f.yaw * .22, -f.roll * .12);
    torso.scale.set(1, 1 + breathe, 1 + breathe * 1.5);
    root.updateMatrixWorld(true);
    // neck spans from the body to the base of the skull
    const nb = body.localToWorld(tmp.a.set(0, .05, -.04));
    const nt = head.localToWorld(tmp.b.set(0, -.62, -.18));
    neck.position.copy(nb);
    tmp.c.subVectors(nt, nb);
    neck.scale.set(scale, tmp.c.length(), scale * .9);
    neck.quaternion.setFromUnitVectors(Y_AXIS, tmp.c.normalize());
    if (hairBack) { hairBack.position.copy(head.localToWorld(tmp.a.set(0, .2, -.25))); hairBack.rotation.y = f.yaw * .5; }

    // morphs
    const open = clamp(f.jaw - f.close * .5);
    const w = [open, f.puff, f.smileL, f.smileR];
    headMesh.morphTargetInfluences.splice(0, 4, ...w);

    // eyes
    for (const [i, e] of eyes.entries()) {
      const sd = i ? 'R' : 'L';
      const close = clamp(f['blink' + sd] + f['squint' + sd] * .3 - f['wide' + sd] * .2);
      e.upper.rotation.x = lerp(-.78 - f['wide' + sd] * .3, 1.38, close);
      e.lower.rotation.x = lerp(.95, .15, clamp(f['squint' + sd] + (f.smileL + f.smileR) * .15));
      e.ball.rotation.set(f.gy * .38, f.gx * .5, 0);
      e.spark.visible = close < .3;
    }

    // brows follow the skin surface
    for (const b of brows) {
      const s = b.s, sd = s < 0 ? 'L' : 'R';
      const inner = f.browInner, outer = f['browUp' + sd], down = f['browDown' + sd];
      const yb = ch.eye.y + .33 * (ch.eye.r / .2);
      const dIn = .12 * inner + .03 * outer - .09 * down, dOut = .04 * inner + .11 * outer - .02 * down;
      for (let k = 0; k < 12; k++) {
        const u = k / 11;
        const x = s * lerp(.1, .5, u);
        const y = yb + lerp(dIn, dOut, u) + Math.sin(u * Math.PI) * .07 - u * .02;
        face.point(x, y, b.pts[k]); face.normal(x, y, b.nor[k]);
        b.pts[k].addScaledVector(b.nor[k], .02);
      }
      const bw = ch.browW;
      b.tube.update(b.pts, b.nor, u => bw * (.55 + .45 * Math.sin(Math.PI * (.25 + .6 * (1 - u)))) * (u > .92 ? (1 - u) * 12.5 : 1));
    }

    mouth.update(f, w, open, t);

    // springs: tuft and earrings react to head motion
    for (const sp of springs) {
      const tx = sp.kind === 'tuft' ? f.pitch * .4 + headVel.y * .05 : -headVel.z * .03;
      const tz = sp.kind === 'tuft' ? f.roll * .6 - headVel.x * .06 : f.roll + headVel.x * .05;
      for (let k = 0, steps = Math.ceil(dt / .008); k < steps; k++) {
        const h = dt / steps;
        sp.v += (120 * (tx - sp.x) - 7 * sp.v) * h; sp.x += sp.v * h;
        sp.vz += (120 * (tz - sp.z) - 7 * sp.vz) * h; sp.z += sp.vz * h;
      }
      sp.obj.rotation.set(clamp(sp.x, -.6, .6), 0, clamp(sp.z, -.7, .7));
    }

    // braids: verlet chains pulled gently toward a draped shape. Collisions move
    // the previous position too, so pushing a point out never adds speed.
    for (const br of braids) {
      const anchor = head.localToWorld(tmp.a.copy(br.anchor));
      const L = .19, N = br.segs.length + 1;
      const rest = k => tmp.d.set(anchor.x + br.s * .03 * k, anchor.y - L * .92 * k, anchor.z + .11 * Math.min(k, 5));
      if (!br.pts.length) for (let k = 0; k < N; k++) { br.pts.push(rest(k).clone()); br.prev.push(br.pts[k].clone()); }
      const hc = head.localToWorld(V3()), hr = 1.04 * scale;
      const steps = Math.ceil(dt / .008);
      for (let k = 0; k < steps; k++) {
        const h = Math.min(dt / steps, .016);
        for (let i = 1; i < N; i++) {
          const p = br.pts[i], q = br.prev[i];
          const vx = (p.x - q.x) * .96, vy = (p.y - q.y) * .96, vz = (p.z - q.z) * .96;
          q.copy(p);
          p.x += vx; p.y += vy - 12 * h * h; p.z += vz;
          p.lerp(rest(i), .015);
        }
        br.pts[0].copy(anchor);
        for (let it = 0; it < 4; it++) for (let i = 1; i < N; i++) {
          const a = br.pts[i - 1], p = br.pts[i];
          tmp.b.subVectors(p, a); const dl = tmp.b.length() || 1;
          const corr = (dl - L) / dl;
          if (i > 1) { a.addScaledVector(tmp.b, corr * .5); p.addScaledVector(tmp.b, -corr * .5); }
          else p.addScaledVector(tmp.b, -corr);
          collide(p, br.prev[i], hc, hr);
        }
      }
      for (let i = 0; i < br.segs.length; i++) {
        const a = br.pts[i], b = br.pts[i + 1], m = br.segs[i];
        m.position.addVectors(a, b).multiplyScalar(.5);
        m.quaternion.setFromUnitVectors(Y_AXIS, tmp.b.subVectors(b, a).normalize());
        m.rotateY((i % 2) * .6);
      }
      br.bow.position.copy(br.pts[N - 1]);
      br.bow.quaternion.copy(br.segs[br.segs.length - 1].quaternion);
    }

    // arms and hands
    let ci = 0, si = 0;
    for (const arm of arms) {
      const s = arm.s, side = s < 0 ? 'L' : 'R';
      const S = body.localToWorld(tmp.a.set(s * SHOULDER.x * ch.body.w, SHOULDER.y, SHOULDER.z)).clone();
      const tracked = st.hands?.[side];
      const target = tracked ? tracked : restHand(s, S, restPts);
      if (!arm.init) { arm.pts.forEach((p, i) => p.copy(target[i])); arm.init = true; }
      const k = 1 - Math.exp(-dt / (tracked ? .04 : .22));
      arm.pts.forEach((p, i) => p.lerp(target[i], k));
      const P = arm.pts;
      // keep the wrist within reach of the shoulder
      const reach = 3.1 * ch.arms.r ** .2;
      tmp.b.subVectors(P[0], S);
      const over = tmp.b.length() - reach * 1.15;
      if (over > 0) { tmp.b.normalize().multiplyScalar(-over); P.forEach(p => p.add(tmp.b)); }
      const E = solveElbow(S, P[0], 1.62, 1.5, tmp.c.set(s * .9, -1, -.5).normalize(), V3());
      const ar = .26 * ch.arms.r;
      const sleeveTo = ch.arms.sleeve ? V3().lerpVectors(S, E, ch.arms.sleeveLen ?? 1) : S;
      // shoulder to sleeve end, then skin to the elbow, forearm to the wrist
      placeCyl(ci++, S, sleeveTo, ar * 1.08, sleeveCol);
      placeCyl(ci++, sleeveTo, E, ar, skinCol);
      placeCyl(ci++, E, P[0], ar * .82, ch.monkey ? skinCol : skinCol);
      placeSph(si++, S, ar * 1.1, sleeveCol);
      placeSph(si++, E, ar * 1.0, ch.arms.sleeve && (ch.arms.sleeveLen ?? 1) >= 1 ? sleeveCol : skinCol);
      placeSph(si++, P[0], ar * .82, skinCol);
      // a band on Bheem's upper arm
      if (ch.arms.band) placeCyl(ci++, tmp.d.lerpVectors(S, E, .55).clone(), V3().lerpVectors(S, E, .68), ar * 1.06, new THREE.Color(ch.arms.band));
      else placeCyl(ci++, S, S, 0, skinCol);
      placeSph(si++, S, 0, skinCol);
      // fingers
      const hs = P[0].distanceTo(P[9]) / .5;
      for (let b = 0; b < FINGER_BONES.length; b++) {
        const [i0, i1] = FINGER_BONES[b];
        placeCyl(ci++, P[i0], P[i1], FINGER_R[b] * hs * .9, b < 1 ? palmSkin : skinCol);
      }
      for (let j = 1; j < 21; j++) placeSph(si++, P[j], JOINT_R[j] * hs * .9, skinCol);
      placeSph(si++, P[0], 0, skinCol);
      // palm: an ellipsoid spanning wrist and knuckles
      const up = tmp.a.subVectors(P[9], P[0]); const lu = up.length(); up.divideScalar(lu || 1);
      const across = tmp.b.subVectors(P[5], P[17]); const la = across.length();
      across.addScaledVector(up, -across.dot(up)).normalize();
      const nrm = tmp.c.crossVectors(across, up).normalize();
      const ctr = tmp.d.copy(P[0]).add(P[5]).add(P[9]).add(P[13]).add(P[17]).divideScalar(5);
      ctr.addScaledVector(up, -lu * .08);
      const palm = palms[(s + 1) / 2];

function buildMouth(ch, face) {
  const NX = 28, NY = 20, X0 = -.5, X1 = .5, Y0 = -.98, Y1 = -.28;
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 180;
  const g = cv.getContext('2d');
  const tex = texture(cv);
  const geo = new THREE.BufferGeometry();
  const verts = (NX + 1) * (NY + 1);
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts * 3), 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(verts * 3), 3));
  const uv = [], idx = [];
  for (let j = 0; j <= NY; j++) for (let i = 0; i <= NX; i++) uv.push(i / NX, j / NY);
  for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) { const a = j * (NX + 1) + i, b = a + NX + 1; idx.push(a, a + 1, b, b, a + 1, b + 1); }
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); geo.setIndex(idx);
  const decal = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    map: tex, transparent: true, alphaTest: .02, roughness: .65, depthWrite: false,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4,
  }));
  decal.frustumCulled = false;
  const lipMat = new THREE.MeshPhysicalMaterial({ color: ch.lip, roughness: ch.gloss ? .3 : .5, clearcoat: ch.gloss ? .6 : .1, sheen: .3, sheenColor: new THREE.Color('#ff9a8a') });
  const upper = new DynTube(26, 10, lipMat), lower = new DynTube(26, 10, lipMat);
  const N = 26;
  const up = Array.from({ length: N }, () => V3()), lo = Array.from({ length: N }, () => V3());
  const upN = up.map(() => V3()), loN = lo.map(() => V3());
  const p = V3(), nrm = V3(), center = V3();
  const toCx = x => (x - X0) / (X1 - X0) * cv.width, toCy = y => (1 - (y - Y0) / (Y1 - Y0)) * cv.height;
  let lastKey = '';

  function curve(x0, y0, x1, y1, cx, cy, t) {
    const a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, c = t * t;
    return [a * x0 + b * cx + c * x1, a * y0 + b * cy + c * y1];
  }

  function update(f, w, open, t) {
    const smile = (f.smileL + f.smileR) / 2, pk = Math.max(f.pucker, f.funnel * .8);
    const mx = clamp(f.shift, -1, 1) * .06, my = ch.mouthY;
    const hw = ch.mouthW / 2 * (1 + .32 * smile + .25 * f.stretch - .5 * pk);
    const yL = my + .07 * f.smileL - .05 * f.frownL, yR = my + .07 * f.smileR - .05 * f.frownR;
    const gap = .2 * open + .05 * f.funnel * open;
    const upMid = my + .012 + gap * .2, loMid = my - gap * .8 - .006;
    const ends = (yL + yR) / 2;
    const cU = 2 * upMid - ends, cL = 2 * loMid - ends;
    face.lift(mx, my - gap * .3, w, center);
    const lipOff = ch.lipR * (.55 + 1.2 * pk);
    for (let i = 0; i < N; i++) {
      const t = i / (N - 1);
      let [x, y] = curve(mx - hw, yL, mx + hw, yR, mx, cU, t);
      face.lift(x, y, w, up[i]); face.normal(x, y, upN[i]); up[i].addScaledVector(upN[i], lipOff);
      [x, y] = curve(mx - hw, yL, mx + hw, yR, mx, cL, t);
      face.lift(x, y, w, lo[i]); face.normal(x, y, loN[i]); lo[i].addScaledVector(loN[i], lipOff);
    }
    const r = ch.lipR * (1 + .6 * pk);
    upper.update(up, upN, t => r * .8 * (.3 + .7 * Math.sin(Math.PI * t)));
    lower.update(lo, loN, t => r * (.3 + .7 * Math.sin(Math.PI * t)));

    // decal follows the morphed skin
    const pos = geo.attributes.position, nor = geo.attributes.normal;
    for (let j = 0; j <= NY; j++) for (let i = 0; i <= NX; i++) {
      const x = lerp(X0, X1, i / NX), y = lerp(Y0, Y1, j / NY), k = j * (NX + 1) + i;
      face.lift(x, y, w, p); face.normal(x, y, nrm);
      p.addScaledVector(nrm, .004);
      pos.setXYZ(k, p.x, p.y, p.z); nor.setXYZ(k, nrm.x, nrm.y, nrm.z);
    }
    pos.needsUpdate = nor.needsUpdate = true;
    decal.visible = gap > .008;
    if (!decal.visible) return;
    const key = [mx, hw, yL, yR, cU, cL].map(v => v.toFixed(3)).join();
    if (key === lastKey) return;
    lastKey = key;
    // interior: dark mouth, upper teeth, lower teeth, tongue
    g.clearRect(0, 0, cv.width, cv.height);
    g.save();
    g.beginPath();
    g.moveTo(toCx(mx - hw), toCy(yL));
    g.quadraticCurveTo(toCx(mx), toCy(cU), toCx(mx + hw), toCy(yR));
    g.quadraticCurveTo(toCx(mx), toCy(cL), toCx(mx - hw), toCy(yL));
    g.closePath();
    const grd = g.createLinearGradient(0, toCy(upMid), 0, toCy(loMid));
    grd.addColorStop(0, '#250707'); grd.addColorStop(1, '#5a1616');
    g.fillStyle = grd; g.fill();
    g.clip();
    const pxU = (cv.height / (Y1 - Y0));
    const teeth = g.createLinearGradient(0, toCy(upMid), 0, toCy(upMid) + .06 * pxU);
    teeth.addColorStop(0, '#d9d2c6'); teeth.addColorStop(.35, '#fffdf8'); teeth.addColorStop(1, '#e8e1d4');
    g.fillStyle = teeth;
    g.beginPath();
    for (let i = 0; i <= 20; i++) {
      const [x, y] = curve(mx - hw, yL, mx + hw, yR, mx, cU, i / 20);
      i ? g.lineTo(toCx(x), toCy(y - .055)) : g.moveTo(toCx(x), toCy(y - .055));
    }
    for (let i = 20; i >= 0; i--) { const [x, y] = curve(mx - hw, yL, mx + hw, yR, mx, cU, i / 20); g.lineTo(toCx(x), toCy(y + .04)); }
    g.fill();
    g.strokeStyle = 'rgba(150,130,120,.15)'; g.lineWidth = 1;
    for (let k = -2; k <= 2; k++) { const x = toCx(mx + k * hw * .22); g.beginPath(); g.moveTo(x, toCy(upMid) - 2); g.lineTo(x, toCy(upMid - .05)); g.stroke(); }
    if (gap > .12) {
      g.fillStyle = '#e9e2d6';
      g.beginPath(); g.ellipse(toCx(mx), toCy(loMid + .01), hw * .55 * pxU, .022 * pxU, 0, Math.PI, TAU); g.fill();
    }
    const tg = g.createRadialGradient(toCx(mx - hw * .15), toCy(loMid + .04), 2, toCx(mx), toCy(loMid + .03), hw * .7 * pxU);
    tg.addColorStop(0, '#f0808a'); tg.addColorStop(1, '#b8404c');
    g.fillStyle = tg;
    g.beginPath(); g.ellipse(toCx(mx), toCy(loMid + .02), hw * .62 * pxU, Math.min(gap * .45, .085) * pxU, 0, 0, TAU); g.fill();
    // soft shadow under the upper lip
    const sh = g.createLinearGradient(0, toCy(upMid + .02), 0, toCy(upMid - .07));
    sh.addColorStop(0, 'rgba(20,0,0,.55)'); sh.addColorStop(1, 'rgba(20,0,0,0)');
    g.fillStyle = sh; g.fillRect(0, 0, cv.width, cv.height);
    g.restore();
    tex.needsUpdate = true;
  }
  return { decal, upper, lower, update, center };
}

/* =====================================================================
   Open-source VRM avatars. The same tracking drives the humanoid rig:
   the head turn is spread over spine, neck and head, arms reach the
   tracked wrist with two-bone IK, and every finger bone points along the
   matching hand landmarks. Expressions map onto whatever presets the
   model has, and models with the 52 ARKit shapes ("perfect sync") get the
   raw MediaPipe blendshapes directly.

const vrmLoader = new GLTFLoader();
vrmLoader.register(p => new VRMLoaderPlugin(p));
const loading = {};
function loadAvatar(id) {
  if (built[id]) return Promise.resolve(built[id]);

  return (loading[id] = vrmLoader.loadAsync(url)
    .then(g => {

      const c = buildVrmCharacter(id, g.userData.vrm);

      return c;

}

  ['Middle', ['Proximal', 'Intermediate', 'Distal'], [9, 10, 11, 12]],
  ['Ring', ['Proximal', 'Intermediate', 'Distal'], [13, 14, 15, 16]],

    // relaxed hand hanging by the side, fingers down, thumb forward
    const L = arm.a + arm.b, k = L * .2;
    const w = b.copy(S).add(a.set(arm.side * L * .12, -L * .97, L * .12));
    HAND_CANON.forEach(([x, y, z], i) => o[i].set(w.x + arm.side * z * k, w.y - y * k, w.z - x * k));
    return o;
  }

  function update(st, dt) {
    const f = st.face;
    root.position.set(f.x, f.y, f.z);
    root.updateMatrixWorld(true);
    // spine, neck and head share the head rotation
    Q.copy(R0);
    for (const [n, k] of chain) {
      const w = k / total;
      e.set(-f.pitch * w, f.yaw * w, -f.roll * w, 'YXZ'); Qd.setFromEuler(e);

    e.set(-f.pitch, f.yaw, -f.roll, 'YXZ'); Qhead.setFromEuler(e);

    for (const arm of arms) {
      arm.up.getWorldPosition(S);

      const target = tracked || restHandPts(arm, S, rest);
      if (!arm.init) { arm.pts.forEach((p, i) => p.copy(target[i])); arm.init = true; }
      const k = 1 - Math.exp(-dt / (tracked ? .04 : .22));
      arm.pts.forEach((p, i) => p.lerp(target[i], k));
      const P = arm.pts;

      if (over > 0) { b.normalize().multiplyScalar(-over); P.forEach(p => p.add(b)); }

      b.subVectors(P[0], S).normalize();

      aim(arm.up, Qpar, arm.upDir, b.subVectors(E, S), Qu);
      aim(arm.lo, Qu, arm.loDir, b.subVectors(P[0], E), Ql);
      // wrist: line up the knuckle direction and the index-to-pinky axis
      frame3(arm.handF, arm.handS, Mr);
      frame3(b.subVectors(P[9], P[0]), V3().subVectors(P[5], P[17]), Mw);
      Qh.setFromRotationMatrix(Mw.multiply(Mr.transpose()));

      let Qp = Qh;
      for (const fb of arm.fingers) {

      }
    }

    // expressions
    const open = clamp(f.jaw - f.close * .5), pk = Math.max(f.pucker, f.funnel), sm = (f.smileL + f.smileR) / 2;
    if (perfectSync && lastRaw && performance.now() - lastSeen < 600) {
      for (const [k2, v] of Object.entries(lastRaw.b)) if (byLower[k2.toLowerCase()]) set(byLower[k2.toLowerCase()], v);
    } else {
      set('aa', open * (1 - pk * .7));
      set('oh', f.funnel * .8);
      set('ou', f.pucker * (1 - open * .4));
      set('ee', clamp(sm * .8 + f.stretch * .5) * (1 - pk));
      set('ih', sm * .35 * (1 - pk));
      // the avatar faces us, so its left eye is on the image right
      if (ownBlinks) { set('blinkLeft', f.blinkR); set('blinkRight', f.blinkL); }
      else set('blink', clamp(((f.blinkL + f.blinkR) / 2 - .25) / .6));
      set('happy', sm);
      set('angry', (f.browDownL + f.browDownR) / 2);
      set('sad', (f.frownL + f.frownR) / 2 * .8);
      set('surprised', clamp((f.browInner + (f.wideL + f.wideR) / 2) / 1.6));
    }
    if (vrm.lookAt) { vrm.lookAt.autoUpdate = false; vrm.lookAt.yaw = f.gx * 20; vrm.lookAt.pitch = -f.gy * 15; }
    vrm.update(dt);
  }

  return {
    id, root, update, vrm,
    title: vrm.meta?.name || vrm.meta?.title || '',
    mouthWorld: o => B('head').getWorldPosition(o).add(a.set(0, .45, .9).applyQuaternion(Qhead)),
    reset() { arms.forEach(x => { x.init = false; }); vrm.springBoneManager?.reset(); },
  };
}

/* =====================================================================
   Tracking: face blendshapes and pose, plus both hands, all filtered
   with One Euro filters (smooth when still, quick when moving).
   ===================================================================== */
class OneEuro {
  constructor(minCutoff = 1, beta = .5, dCutoff = 1) { Object.assign(this, { minCutoff, beta, dCutoff }); this.reset(); }
  reset() { this.x = null; this.dx = 0; this.t = 0; }
  a(cutoff, dt) { const tau = 1 / (TAU * cutoff); return 1 / (1 + tau / dt); }
  filter(v, t) {
    if (this.x === null) { this.x = v; this.t = t; return v; }
    const dt = Math.max(1e-3, t - this.t); this.t = t;
    this.dx = lerp(this.dx, (v - this.x) / dt, this.a(this.dCutoff, dt));
    this.x = lerp(this.x, v, this.a(this.minCutoff + this.beta * Math.abs(this.dx), dt));
    return this.x;
  }
}

const NEUTRAL_FACE = {
  x: 0, y: 0, z: 0, yaw: 0, pitch: 0, roll: 0,
  blinkL: 0, blinkR: 0, squintL: 0, squintR: 0, wideL: 0, wideR: 0, gx: 0, gy: 0,
  browInner: 0, browUpL: 0, browUpR: 0, browDownL: 0, browDownR: 0,
  jaw: 0, close: 0, smileL: 0, smileR: 0, frownL: 0, frownR: 0,
  pucker: 0, funnel: 0, stretch: 0, shift: 0, puff: 0,
};
const face = { ...NEUTRAL_FACE };     // what gets drawn
let target = { ...NEUTRAL_FACE };     // latest filtered measurement
let baseline = null;                  // raw blendshapes + pose at "Set neutral"
let lastRaw = null, lastFacePx = null;
let lastSeen = -1e9;
const faceFilters = {};
const filterCfg = k => /^(x|y|z|yaw|pitch|roll)$/.test(k) ? [1.4, .9] : /^blink/.test(k) ? [10, 0] : [4, 1];
function filterFace(tg, tsec) {
  for (const k in tg) tg[k] = (faceFilters[k] ||= new OneEuro(...filterCfg(k))).filter(tg[k], tsec);
  return tg;
}

function measure(res, vw, vh) {
  const lm = res.faceLandmarks?.[0];
  const cats = res.faceBlendshapes?.[0]?.categories;
  if (!lm || !cats) return null;
  const b = {};
  for (const c of cats) b[c.categoryName] = c.score;
  const pt = i => [lm[i].x * vw, lm[i].y * vh, lm[i].z * vw];
  const a = pt(33), c = pt(263), top = pt(10), chin = pt(152);
  const sub = (p, q) => [p[0] - q[0], p[1] - q[1], p[2] - q[2]];
  const dot = (p, q) => p[0] * q[0] + p[1] * q[1] + p[2] * q[2];
  const norm = p => { const l = Math.hypot(...p) || 1; return p.map(v => v / l); };
  const X = norm(sub(c, a));
  let Y = sub(chin, top); Y = norm(sub(Y, X.map(v => v * dot(Y, X))));
  const Z = [X[1] * Y[2] - X[2] * Y[1], X[2] * Y[0] - X[0] * Y[2], X[0] * Y[1] - X[1] * Y[0]];
  const h = Math.hypot(chin[0] - top[0], chin[1] - top[1]);
  const cx = (a[0] + c[0] + top[0] + chin[0]) / 4, cy = (a[1] + c[1] + top[1] + chin[1]) / 4;
  return {
    b,
    yaw: Math.asin(clamp(-Z[0], -1, 1)),
    pitch: Math.asin(clamp(Z[1], -1, 1)),
    roll: Math.atan2(X[1], X[0]),
    cx: cx / vw, cy: cy / vh, size: h / vh,
    px: { cx, cy, h },
  };
}

// The forehead-to-chin line leans back a little on a level face.
const PITCH0 = -0.2;
// The camera frame maps onto the stage at this many world units across, for
// both the head and the hands, so a hand next to your face lands next to the avatar's.
const FRAME_W = 5.6;
function toTarget(m) {
  const base = baseline || { b: {}, yaw: 0, pitch: PITCH0, roll: 0 };
  const B = name => {
    const v = m.b[name] || 0, z = base.b[name] || 0;
    return clamp((v - z) / Math.max(.2, 1 - z));
  };
  const S = (stem, side, suffix = '') => B(stem + imgSide(side) + suffix);
  const gain = (v, k) => clamp(v * k);
  const lookR = (S('eyeLookOut', 'R') + S('eyeLookIn', 'L')) / 2;
  const lookL = (S('eyeLookIn', 'R') + S('eyeLookOut', 'L')) / 2;
  const lookUp = (B('eyeLookUpLeft') + B('eyeLookUpRight')) / 2;
  const lookDown = (B('eyeLookDownLeft') + B('eyeLookDownRight')) / 2;
  return {
    // head position in world units: the avatar moves around the frame like you do
    x: clamp((m.cx - .5) * FRAME_W, -2.4, 2.4),
    y: clamp(-(m.cy - .45) * FRAME_W * .75, -1, .45),
    z: clamp((Math.sqrt(m.size / .38) - 1) * 5, -2.5, 3),
    yaw: clamp((m.yaw - base.yaw) * 1.1, -.8, .8),
    pitch: clamp((m.pitch - base.pitch) * 1.1, -.55, .55),
    roll: clamp(m.roll - base.roll, -.6, .6),
    blinkL: clamp((S('eyeBlink', 'L') - .2) / .4), blinkR: clamp((S('eyeBlink', 'R') - .2) / .4),
    squintL: gain(S('eyeSquint', 'L'), 1.3), squintR: gain(S('eyeSquint', 'R'), 1.3),
    wideL: gain(S('eyeWide', 'L'), 2), wideR: gain(S('eyeWide', 'R'), 2),
    gx: clamp((lookR - lookL) * 2, -1, 1), gy: clamp((lookDown - lookUp) * 1.8, -1, 1),
    browInner: gain(B('browInnerUp'), 1.4),
    browUpL: gain(S('browOuterUp', 'L'), 1.5), browUpR: gain(S('browOuterUp', 'R'), 1.5),
    browDownL: gain(S('browDown', 'L'), 1.6), browDownR: gain(S('browDown', 'R'), 1.6),
    jaw: gain(B('jawOpen'), 1.8), close: gain(B('mouthClose'), 1.5),
    smileL: gain(S('mouthSmile', 'L'), 1.25), smileR: gain(S('mouthSmile', 'R'), 1.25),
    frownL: gain(S('mouthFrown', 'L'), 1.8), frownR: gain(S('mouthFrown', 'R'), 1.8),
    pucker: gain(B('mouthPucker'), 1.3), funnel: gain(B('mouthFunnel'), 1.4),
    stretch: gain((B('mouthStretchLeft') + B('mouthStretchRight')) / 2, 1.5),
    shift: clamp((S('mouth', 'R') - S('mouth', 'L')) * 2, -1, 1),
    puff: gain(B('cheekPuff'), 1.8),
  };
}

// Hands are kept in image space (normalised landmarks per side of the
// image) and turned into world space every frame, relative to the face.
const rawHands = { L: null, R: null };
const handSeen = { L: -1e9, R: -1e9 };
const handFilters = { L: null, R: null };
let debugHands = null;
function measureHands(res, tsec, now) {
  const list = (res?.landmarks || []).map(lm => ({ lm, x: lm[0].x })).sort((a, b) => a.x - b.x);
  const fx = lastRaw && now - lastSeen < 1000 ? lastRaw.cx : .5;
  const assign = {};
  if (list.length === 1) assign[list[0].x < fx ? 'L' : 'R'] = list[0].lm;
  else if (list.length >= 2) { assign.L = list[0].lm; assign.R = list[list.length - 1].lm; }
  for (const side of ['L', 'R']) {
    const lm = assign[side];
    if (!lm) continue;
    const F = handFilters[side] ||= Array.from({ length: 63 }, () => new OneEuro(2.5, 6));
    if (now - handSeen[side] > 400) F.forEach(f => f.reset());
    handSeen[side] = now;
    rawHands[side] = lm.map((p, i) => ({ x: F[i * 3].filter(p.x, tsec), y: F[i * 3 + 1].filter(p.y, tsec), z: F[i * 3 + 2].filter(p.z, tsec) }));
  }
}
const handWorld = { L: HAND_CANON.map(() => V3()), R: HAND_CANON.map(() => V3()) };
// A hand counts as lost after a few missed detections (slow machines detect less often).
let handInterval = 33, lastHandRun = 0;
const handFresh = (side, now) => now - handSeen[side] < Math.max(300, handInterval * 2.5);
function handsInWorld(now, vw, vh) {
  const outH = {};
  for (const side of ['L', 'R']) {
    const raw = debugHands ? debugHands[side] : (handFresh(side, now) ? rawHands[side] : null);
    if (!raw) continue;
    const fh = lastFacePx && lastRaw ? lastFacePx.h : vh * .38;
    const unit = FRAME_W / vw;
    // a hand that looks big next to the face is closer to the camera
    const hsz = Math.hypot((raw[9].x - raw[0].x) * vw, (raw[9].y - raw[0].y) * vh);
    const depth = face.z + .9 + clamp((hsz / fh / .45 - 1) * 2.2, -.6, 2.2);
    const o = handWorld[side];
    for (let i = 0; i < 21; i++) {
      o[i].set((raw[i].x - .5) * FRAME_W, -(raw[i].y * vh - vh * .45) * unit, depth - raw[i].z * vw * unit);
      // cartoon proportions: hands are sized to the avatar's head rather than the frame
      if (i) o[i].sub(o[0]).multiplyScalar(clamp(1.9 / (fh * unit), .7, 1.6) * .85).add(o[0]);
    }
    outH[side] = o;
  }
  return outH;
}

/* =====================================================================
   Camera, landmarkers and the render loop
   ===================================================================== */
const camVideo = document.createElement('video');
camVideo.muted = true; camVideo.playsInline = true;

let camStream = null, micTrack = null, canvasTrack = null;
let landmarker = null, handLandmarker = null, trackState = 'off';
let character = CHARS[store.get('dholakpur:char')] ? store.get('dholakpur:char') : 'bheem';
let bg = store.get('dholakpur:bg') === 'plain' ? 'plain' : 'village';
let micLevel = 0, analyser = null, audioCtx = null;
let lastVideoTime = -1, lastFrame = 0, lastDraw = 0;
let openTimer = 0, laddoo = null, ladCooldown = 0;
let debugFace = null;
let handEvery = 1, handTick = 0, handMs = 0, handCount = 0;

async function loadLandmarkers() {
  const base = new URL('../lib/mediapipe/', import.meta.url).href;
  const fileset = { wasmLoaderPath: base + 'vision_wasm_internal.js', wasmBinaryPath: base + 'vision_wasm_internal.wasm' };
  const make = async (Cls, model, extra) => {
    const opts = delegate => ({ baseOptions: { modelAssetPath: base + model, delegate }, runningMode: 'VIDEO', ...extra });
    try { return await Cls.createFromOptions(fileset, opts('GPU')); }
    catch (e) { console.warn('GPU delegate failed, using CPU', e); return Cls.createFromOptions(fileset, opts('CPU')); }
  };
  landmarker = await make(FaceLandmarker, 'face_landmarker.task', { numFaces: 1, outputFaceBlendshapes: true });
  if (trackState === 'loading') setTrack('searching');
  updateBar();
  handLandmarker = await make(HandLandmarker, 'hand_landmarker.task', {
    numHands: 2, minHandDetectionConfidence: .6, minHandPresenceConfidence: .6, minTrackingConfidence: .5,
  }).catch(e => { console.warn('hand tracking unavailable', e); return null; });
}
const landmarkerReady = loadLandmarkers().catch(e => { console.error(e); if (!landmarker) setTrack('failed'); });

function setTrack(s) {
  trackState = s;
  const chip = $('#trackChip');
  const hands = handCount ? ` and ${handCount === 1 ? 'a hand' : 'both hands'}` : '';
  const [cls, text] = {
    off: ['', 'Camera off'], loading: ['warn', 'Loading face tracking…'], searching: ['warn', 'Looking for your face…'],
    ok: ['ok', `Tracking your face${hands}`], failed: ['bad', 'Face tracking unavailable'], nocam: ['bad', 'No camera: voice moves the mouth'],
  }[s];
  chip.querySelector('.dot').className = 'dot ' + cls;
  chip.lastElementChild.textContent = text;
}

async function startMedia() {
  if (camStream) return;
  $('#startCam').hidden = true;
  let stream = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
  } catch (e) {
    console.warn('camera+mic failed', e);
    for (const c of [{ video: { facingMode: 'user' } }, { audio: true }]) {
      try { stream = await navigator.mediaDevices.getUserMedia(c); break; } catch {}
    }
  }
  camStream = stream || new MediaStream();
  micTrack = camStream.getAudioTracks()[0] || null;
  if (camStream.getVideoTracks().length) {
    camVideo.srcObject = new MediaStream(camStream.getVideoTracks());
    await camVideo.play().catch(() => {});
    setTrack(landmarker ? 'searching' : trackState === 'failed' ? 'failed' : 'loading');
  } else {
    setTrack('nocam');
  }
  if (micTrack) {
    try {
      audioCtx = audioCtx || new AudioContext();
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 512;
      audioCtx.createMediaStreamSource(new MediaStream([micTrack])).connect(analyser);
    } catch {}
  }
  if (!stream) showErr('No camera or microphone available. You can still join and watch.');
}

function level(an) {
  if (!an) return 0;
  const buf = new Uint8Array(an.fftSize);
  an.getByteTimeDomainData(buf);
  let sum = 0;
  for (const v of buf) sum += (v - 128) * (v - 128);
  return Math.sqrt(sum / buf.length) / 128;
}

const tv = V3(), tv2 = V3();
const sparkPos = sparkles.geometry.attributes.position;
let perfAcc = 0, perfN = 0, perfT = 0, goodChecks = 0;

function frame(now) {
  if (now - lastDraw < 15) return;
  const dt = Math.min(.1, (now - (lastFrame || now)) / 1000);
  lastFrame = lastDraw = now;
  const tsec = now / 1000;
  const vw = camVideo.videoWidth || 640, vh = camVideo.videoHeight || 480;
  if (camVideo.videoWidth && camVideo.readyState >= 2 && camVideo.currentTime !== lastVideoTime) {
    lastVideoTime = camVideo.currentTime;
    if (landmarker) {
      try {
        const m = measure(landmarker.detectForVideo(camVideo, now), vw, vh);
        if (m) { lastRaw = m; lastFacePx = m.px; target = filterFace(toTarget(m), tsec); lastSeen = now; if (trackState !== 'ok') setTrack('ok'); }
        else if (now - lastSeen > 600 && trackState === 'ok') setTrack('searching');
      } catch (e) { console.error(e); }
    }
    if (handLandmarker && ++handTick % handEvery === 0) {
      const t0 = performance.now();
      if (lastHandRun) handInterval = lerp(handInterval, t0 - lastHandRun, .2);
      lastHandRun = t0;
      try { measureHands(handLandmarker.detectForVideo(camVideo, now), tsec, now); } catch (e) { console.error(e); }
      handMs = lerp(handMs, performance.now() - t0, .1);
      handEvery = handMs > 22 ? 2 : 1;   // slow machines track hands every other frame
    }
  }
  micLevel = lerp(micLevel, level(analyser), .5);
  if (now - lastSeen > 600) {
    // hold still, ease back to neutral, blink now and then, and let the voice move the mouth
    target = { ...NEUTRAL_FACE, x: target.x * .98, y: target.y * .98, z: target.z * .98 };
    target.blinkL = target.blinkR = (tsec % 4) < .12 ? 1 : 0;
    target.jaw = clamp((micLevel - .02) * 8);
  }
  if (debugFace) Object.assign(target, debugFace);
  const k = 1 - Math.exp(-dt / .03);
  for (const key in face) face[key] = lerp(face[key], target[key], k);

  const hands = handsInWorld(now, vw, vh);
  const n = (hands.L ? 1 : 0) + (hands.R ? 1 : 0);
  if (n !== handCount) { handCount = n; if (trackState === 'ok') setTrack('ok'); }

  showCharacter(character);
  current.update({ face, hands }, dt, tsec);

  // open wide and hold for a laddoo power-up
  openTimer = face.jaw > .55 ? openTimer + dt : 0;
  if (openTimer > .8 && tsec > ladCooldown) { laddoo = { t0: tsec }; ladCooldown = tsec + 6; openTimer = 0; }
  let power = 0;
  laddooMesh.visible = false;
  if (laddoo) {
    const e = tsec - laddoo.t0;
    if (e > 3.6) laddoo = null;
    else if (e > .7) power = Math.min(1, (e - .7) * 4) * Math.min(1, (3.6 - e) * 2);
    else {
      const u = e / .7, to = current.mouthWorld(tv);
      laddooMesh.visible = true;
      laddooMesh.position.lerpVectors(tv2.set(3.2, -3.2, 3), to, u).y += Math.sin(u * Math.PI) * 1.6;
      laddooMesh.scale.setScalar(1 - u * .45);
      laddooMesh.rotation.set(u * 6, u * 4, 0);
    }
  }
  powerLight.intensity = power * 40 * (reduceMotion ? 1 : 1 + .25 * Math.sin(tsec * 9));
  powerLight.position.set(face.x, face.y + .3, face.z + 2.2);
  sparkles.material.opacity = power;
  if (power > 0) {
    for (let i = 0; i < 40; i++) {
      const a = (reduceMotion ? 0 : tsec * 1.6) + i * TAU / 40, r = 1.7 + .25 * Math.sin(i * 3.1 + tsec * 4);
      sparkPos.setXYZ(i, face.x + Math.cos(a) * r, face.y + Math.sin(a * 2) * .5 + Math.sin(a) * 1.2, face.z + Math.sin(a) * .8);
    }
    sparkPos.needsUpdate = true;
  }
  scene.background = background(bg);
  renderer.toneMappingExposure = current.vrm ? .85 : 1.02;
  renderer.render(scene, camera);
  adaptSize(now, dt);
  updateSpeaking();
}

// Step the output size down when frames get slow, and back up after five good checks.
let sizeLocked = false;
function adaptSize(now, dt) {
  if (document.hidden || sizeLocked) return;
  perfAcc += dt; perfN++;
  if (now - perfT < 2000) return;
  const avg = perfAcc / perfN * 1000;
  perfAcc = perfN = 0; perfT = now;
  if (avg > 40 && sizeIdx < SIZES.length - 1) { sizeIdx++; goodChecks = 0; renderer.setSize(...SIZES[sizeIdx], false); }
  else if (avg < 22 && sizeIdx > 0) { if (++goodChecks >= 5) { sizeIdx--; goodChecks = 0; renderer.setSize(...SIZES[sizeIdx], false); } }
  else goodChecks = 0;
}

// Background tabs stop requestAnimationFrame, which would freeze the video
// others see. A worker timer keeps frames coming while the tab is hidden.
const ticker = new Worker(URL.createObjectURL(new Blob(

const thumbs = {};       // id -> 320x240 canvas

function paintSlots(id) {
  for (const slot of thumbSlots[id] || []) if (thumbs[id]) slot.getContext('2d').drawImage(thumbs[id], 0, 0, slot.width, slot.height);

function renderThumb(id) {

  const f = { ...NEUTRAL_FACE, smileL: .55, smileR: .55, yaw: -.18, gx: .1 };
