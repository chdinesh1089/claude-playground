  h *= smooth(14, 40, Math.hypot(x, z));
  h *= 1 - smooth(425, 460, x);
  h -= smooth(544, 552, x) * 3;
  return h;
}
{

{

function cloudLayer(count, puffs, a, color, seed) {
  const r = rng(seed);
  const mesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1),
    new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 1 }), count * puffs);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = V(), p = V();
  let n = 0;
  for (let c = 0; c < count; c++) {
    const cx = lerp(a.x0, a.x1, r()), cy = lerp(a.y0, a.y1, r()), cz = lerp(a.z0, a.z1, r());
    for (let k = 0; k < puffs; k++) {

      p.set(cx + (r() - 0.5) * sz * 2.6, cy + (r() - 0.3) * sz * 0.6, cz + (r() - 0.5) * sz * 1.6);
      m.compose(p, q, s.set(sz * 1.3, sz * 0.8, sz));
      mesh.setMatrixAt(n++, m);
    }
  }
  scene.add(mesh);
  return mesh;
}

// ---------- per-frame update (everything is a pure function of t, so scrubbing works) ----------
function update(t) {
  sampleEnv(t);

  let flash = 0;
  for (const b of BOLTS) {
    const d = t - b.t, p = d >= 0 && d < 0.5 ? Math.exp(-d * 8) : 0;
    b.g.visible = p > 0.03;

  }

  skyMat.uniforms.bottom.value.copy(env.bottom);
  skyMat.uniforms.flash.value = flash * (REDUCED ? 0.1 : 0.4);
  scene.fog.color.copy(env.fog);
  scene.fog.near = lerp(90, 30, env.storm);
  scene.fog.far = lerp(lerp(560, 640, env.night), 240, env.storm);
  hemi.color.copy(env.hs);
  hemi.groundColor.copy(env.hg);
  hemi.intensity = env.hi + flash * (REDUCED ? 0.15 : 1.0);
  sun.color.copy(env.sc);
  sun.intensity = env.si;
  starMat.opacity = env.night;
  plane.material.emissiveIntensity = env.night * 0.45;
  moonMat.opacity = env.night;

  const cityLights = smooth(39, 46, t);
  for (const m of cityMats) m.emissiveIntensity = cityLights * 1.3;
  lampMat.opacity = cityLights;
  for (const r of risers) {
    const k = clamp((t - 40.5 - r.delay) / 3.5, 0, 1), e = 1 - Math.pow(1 - k, 3);
    r.obj.visible = k > 0;

  }

  miaArm.rotation.z = armAngle(t);

  // plane
  const landed = smooth(55.4, 56.2, t);
  const alive = smooth(10.6, 11.6, t) * (1 - landed);
  const storm = smooth(26.5, 27.5, t) * (1 - smooth(33, 35, t));
  let scale = lerp(0.45, 1, smooth(11, 14, t)) * lerp(1, 0.8, smooth(52, 55.5, t)) * (1 - smooth(61.3, 62.1, t));
  plane.visible = scale > 0.01;
  plane.scale.setScalar(Math.max(scale, 0.001));

    handPos(t, plane.position);
    plane.lookAt(plane.position.x + 1, plane.position.y + 0.12, plane.position.z);
  } else {
    pathPos(t, plane.position);
    const dir = pathPos(t + 0.12, tmp.dir).sub(plane.position);
    if (dir.lengthSq() < 1e-8) dir.set(1, 0, 0);
    dir.normalize().lerp(tmp.fwd, landed).normalize();

    if (!REDUCED) plane.position.y += storm * Math.sin(t * 5.1) * 0.35;
    plane.lookAt(plane.position.x + dir.x, plane.position.y + dir.y, plane.position.z + dir.z);
    let roll = clamp(-turn * 14, -0.7, 0.7) + Math.sin(t * 2.7) * 0.09;
    let pitch = Math.sin(t * 1.9 + 0.5) * 0.05;
    if (REDUCED) roll += storm * Math.sin(t * 3) * 0.3;

});
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter'))) return;
  if (e.key === ' ') { e.preventDefault(); ui.intro.classList.add('hidden'); ui.play.onclick(); }
  else if (e.key === 'ArrowRight') t = Math.min(DURATION - 0.01, t + 5);
  else if (e.key === 'ArrowLeft') { t = Math.max(0, t - 5); ui.end.classList.add('hidden'); }
  else if (e.key.toLowerCase() === 'r') { ui.intro.classList.add('hidden'); restart(); }
});
let idleTimer;
function poke() {
  ui.controls.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => playing && !scrubbing && ui.controls.classList.add('idle'), 2500);
}
addEventListener('pointermove', poke);
addEventListener('pointerdown', poke);
addEventListener('keydown', poke);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < h ? 68 : 50;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (playing) {
    t += dt;
    if (t >= DURATION) { t = DURATION; setPlaying(false); ui.end.classList.remove('hidden'); }
  }
  update(t);
  if (!scrubbing) ui.scrub.value = t;
  ui.time.textContent = fmt(t);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
// Warm up shaders and textures for the storm and the city while the title card is showing.
update(29); renderer.render(scene, camera);
update(50); renderer.render(scene, camera);
update(0);
requestAnimationFrame(frame);

window.story = { seek(v) { t = v; update(t); renderer.render(scene, camera); }, get t() { return t; } };
</script>
</body>
</html>
