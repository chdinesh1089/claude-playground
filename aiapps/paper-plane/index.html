<style>

    flex: none; width: 34px; height: 34px; border: 0; border-radius: 50%; background: none; color: #fff;
    cursor: pointer; font-size: 15px; display: grid; place-items: center;
  }

  .controls input[type=range] { flex: 1; min-width: 0; accent-color: #fff; }
  .time { flex: none; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: rgba(255,255,255,.8); font-variant-numeric: tabular-nums; }

<script type="module">
import * as THREE from 'three';

const DURATION = 71;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOBILE = matchMedia('(pointer: coarse)').matches || Math.min(screen.width, screen.height) < 700;

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = (e0, e1, x) => { const u = clamp((x - e0) / (e1 - e0), 0, 1); return u * u * (3 - 2 * u); };
const smoother = (e0, e1, x) => { const u = clamp((x - e0) / (e1 - e0), 0, 1); return u * u * u * (u * (u * 6 - 15) + 10); };
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const C = s => new THREE.Color(s);
function rng(seed) {

    seed = (seed + 0x6D2B79F5) | 0;
    let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;

}
const rand = rng(20260923);
const rr = (a, b) => lerp(a, b, rand());
const hash2 = (x, y) => {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};
function vnoise(x, y, period = 0) {
  let xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const w = i => (period ? ((i % period) + period) % period : i);
  const a = hash2(w(xi), w(yi)), b = hash2(w(xi + 1), w(yi)), c = hash2(w(xi), w(yi + 1)), d = hash2(w(xi + 1), w(yi + 1));
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, oct = 4, period = 0) {
  let s = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { s += amp * vnoise(x * f, y * f, period ? period * f : 0); norm += amp; amp *= 0.5; f *= 2; }
  return s / norm;
}

const CAPTIONS = [
  [0.6, 5.0, 'Every Saturday, Grandpa called from Chicago.'],
  [5.5, 9.6, 'This Saturday, the phone stayed quiet.'],
  [10.0, 15.0, 'So Mia folded a letter into a plane and threw it as hard as she could.'],
  [15.6, 23.2, 'It flew over the fields and past the windmills, farther than anything she had ever thrown.'],
  [25.0, 32.4, 'Somewhere over Missouri, the sky turned. The plane tumbled, soaked and small.'],
  [34.4, 40.4, 'But paper remembers how it was folded. It found the wind again.'],
  [42.0, 49.0, 'By nightfall, the city lights rose up to meet it.'],
  [51.0, 56.6, 'It came to rest on a windowsill, high above the street.'],
  [58.2, 63.4, 'A light came on. The window opened. Grandpa read the letter twice.'],
  [64.2, 69.6, 'Then he picked up the phone.'],
];

// ---------------------------------------------------------------- renderer & post-processing
const canvas = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('intro-sub').textContent = 'This story needs WebGL, which this browser has turned off.';
  document.getElementById('start').hidden = true;
  throw e;
}
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const MAX_ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xffffff, 0.002);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 6000);

const composer = new THREE.EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: MOBILE ? 2 : 4 }));
composer.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), 0.3, 0.4, 2.5);
composer.addPass(bloom);
const vignette = new THREE.ShaderPass({
  uniforms: { tDiffuse: { value: null }, strength: { value: 0.32 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float strength; varying vec2 vUv;
    void main() { vec4 c = texture2D(tDiffuse, vUv); vec2 d = vUv - 0.5; c.rgb *= 1.0 - strength * smoothstep(0.1, 0.55, dot(d, d)); gl_FragColor = c; }`,
});
composer.addPass(vignette);
composer.addPass(new THREE.OutputPass());

// Resolution adapts to the device so playback stays smooth.
const DPR_MAX = Math.min(devicePixelRatio || 1, MOBILE ? 1.5 : 2);
let dpr = Math.min(DPR_MAX, 1.5);
function applySize() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(dpr);
  composer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = w < h ? 68 : 50;
  camera.updateProjectionMatrix();
}

// ---------------------------------------------------------------- textures
function canvasTex(w, h, draw, { srgb = true } = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = MAX_ANISO;
  return t;
}
function pixels(ctx, w, h, fn) {
  const img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const [r, g, b, a = 255] = fn(x, y), i = (y * w + x) * 4;
    img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b; img.data[i + 3] = a;
  }
  ctx.putImageData(img, 0, 0);
}
const groundDetail = canvasTex(256, 256, (ctx, w, h) => pixels(ctx, w, h, (x, y) => {
  const n = fbm(x / 32, y / 32, 5, 8), g = 190 + n * 65;
  return [g, g, g];
}));
const waterNormals = canvasTex(256, 256, (ctx, w, h) => {
  const H = (x, y) => fbm(x / 24, y / 24, 4, 256 / 24 | 0) * 0.7 + fbm(x / 9, y / 9, 3, 256 / 9 | 0) * 0.3;
  pixels(ctx, w, h, (x, y) => {
    const dx = (H(x + 1, y) - H(x - 1, y)) * 6, dy = (H(x, y + 1) - H(x, y - 1)) * 6;
    const n = V(-dx, -dy, 1).normalize();
    return [(n.x * 0.5 + 0.5) * 255, (n.y * 0.5 + 0.5) * 255, (n.z * 0.5 + 0.5) * 255];
  });
}, { srgb: false });
const puffTex = canvasTex(128, 128, (ctx, w, h) => {
  const r = rng(3);
  for (let i = 0; i < 26; i++) {
    const cx = w / 2 + (r() - 0.5) * w * 0.45, cy = h / 2 + (r() - 0.5) * h * 0.4, rad = w * (0.12 + r() * 0.2);
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
    g.addColorStop(0, 'rgba(255,255,255,0.35)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }
  ctx.globalCompositeOperation = 'destination-in';
  const m = ctx.createRadialGradient(w / 2, h / 2, w * 0.2, w / 2, h / 2, w * 0.5);
  m.addColorStop(0, 'rgba(0,0,0,1)');
  m.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = m;
  ctx.fillRect(0, 0, w, h);
});
const brickTex = canvasTex(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#b3a38f';
  ctx.fillRect(0, 0, w, h);
  const r = rng(9);
  for (let row = 0; row < 16; row++) for (let col = -1; col < 9; col++) {
    const x = col * 32 + (row % 2) * 16 + 2, y = row * 16 + 2;
    const k = 0.85 + r() * 0.3;
    ctx.fillStyle = `rgb(${138 * k | 0},${72 * k | 0},${52 * k | 0})`;
    ctx.fillRect(x, y, 29, 13);
  }
});
const sidingTex = canvasTex(64, 64, (ctx, w, h) => {
  ctx.fillStyle = '#e9e0cd';
  ctx.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 8) {
    ctx.fillStyle = 'rgba(80,60,40,0.18)'; ctx.fillRect(0, y + 6, w, 2);
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(0, y, w, 1);
  }
});
const shingleTex = canvasTex(128, 128, (ctx, w, h) => {
  const r = rng(12);
  ctx.fillStyle = '#3d2723';
  ctx.fillRect(0, 0, w, h);
  for (let row = 0; row < 8; row++) for (let col = -1; col < 9; col++) {
    const k = 0.8 + r() * 0.35;
    ctx.fillStyle = `rgb(${92 * k | 0},${56 * k | 0},${46 * k | 0})`;
    ctx.fillRect(col * 16 + (row % 2) * 8 + 1, row * 16 + 1, 14, 14);
  }
});
const paperTex = canvasTex(512, 512, (ctx, w, h) => {
  pixels(ctx, w, h, (x, y) => { const n = 236 + fbm(x / 6, y / 6, 3) * 18; return [n, n - 2, n - 9]; });
  ctx.strokeStyle = 'rgba(90,130,200,0.35)';
  ctx.lineWidth = 2;
  for (let y = 60; y < h; y += 34) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  ctx.fillStyle = 'rgba(30,40,90,0.85)';
  ctx.font = 'italic 34px "Segoe Script", "Bradley Hand", "Snell Roundhand", "Comic Sans MS", cursive';
  ctx.fillText('Dear Grandpa,', 40, 88);
  const r = rng(21);
  ctx.strokeStyle = 'rgba(30,40,90,0.7)';
  ctx.lineWidth = 2.2;
  for (let line = 0; line < 9; line++) {
    const y = 122 + line * 34, len = line === 8 ? 180 : 330 + r() * 120;
    ctx.beginPath();

    ctx.stroke();
  }
  ctx.fillText('love, Mia', 300, 450);
});
function facadeTextures(style, seed) {
  const r = rng(seed), lit = [];

    ctx.fillStyle = emissive ? '#000' : ['#33414f', '#b8ad9a', '#1d2126'][style];
    ctx.fillRect(0, 0, w, h);
    for (let row = 0; row < 8; row++) for (let col = 0; col < 4; col++) {
      const x = col * 64, y = row * 64, on = lit[row * 4 + col], warm = on < 0.34, cool = on >= 0.34 && on < 0.46;
      const glow = warm ? '#ffcf8a' : cool ? '#a9bde0' : null;
      if (style === 0) {
        ctx.fillStyle = emissive ? (glow || '#000') : (on > 0.7 ? '#4a6278' : '#3d5266');
        ctx.fillRect(x + 3, y + 3, 58, 58);
        if (!emissive) { ctx.fillStyle = '#1b222b'; ctx.fillRect(x, y, 64, 3); ctx.fillRect(x, y, 3, 64); }
        if (emissive && glow && on < 0.12) { ctx.fillStyle = '#000'; for (let s = 0; s < 58; s += 8) ctx.fillRect(x + 3, y + 3 + s, 58, 3); }
      } else if (style === 1) {
        if (!emissive) { ctx.fillStyle = '#ede6d8'; ctx.fillRect(x + 13, y + 9, 38, 46); }
        ctx.fillStyle = emissive ? (glow || '#000') : '#2a3440';
        ctx.fillRect(x + 16, y + 12, 32, 40);
      } else {
        ctx.fillStyle = emissive ? (glow || '#000') : '#3a4756';
        ctx.fillRect(x, y + 20, 64, 30);
        if (!emissive) { ctx.fillStyle = '#15191e'; ctx.fillRect(x + 62, y + 20, 2, 30); }
      }

}

// ---------------------------------------------------------------- sky, stars, moon, environment lighting
const sky = new THREE.Sky();
sky.scale.setScalar(5000);
const skyU = sky.material.uniforms;
skyU.rayleigh.value = 1.6;
skyU.mieCoefficient.value = 0.004;
skyU.mieDirectionalG.value = 0.82;
skyU.cloudScale.value = 0.00025;
scene.add(sky);

const overlayMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, transparent: true, depthWrite: false, fog: false,
  uniforms: { top: { value: C('#000') }, bottom: { value: C('#000') }, alpha: { value: 0 }, flash: { value: 0 } },
  vertexShader: `varying vec3 vDir;
    void main() { vDir = normalize(position); vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p; gl_Position.z = p.w * 0.99999; }`,
  fragmentShader: `uniform vec3 top; uniform vec3 bottom; uniform float alpha; uniform float flash; varying vec3 vDir;

      gl_FragColor = vec4(mix(bottom, top, pow(h, 0.8)) + flash * vec3(1.2, 1.3, 1.6), clamp(alpha + flash * 0.25, 0.0, 1.0));
    }`,

const overlay = new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), overlayMat);
overlay.renderOrder = 0;
scene.add(overlay);

const starPos = [];
for (let i = 0; i < 2200; i++) {
  const th = rand() * Math.PI * 2, ph = Math.acos(rr(0.05, 1)), r = 3000;
  starPos.push(r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th));
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.3, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
const stars = new THREE.Points(starGeo, starMat);
stars.renderOrder = 1;
scene.add(stars);

const MOON_DIR = V(0.62, 0.3, -0.72).normalize();
const moonMat = new THREE.MeshBasicMaterial({ color: C('#fff6df').multiplyScalar(2.2), transparent: true, opacity: 0, fog: false });
const moon = new THREE.Mesh(new THREE.SphereGeometry(40, 24, 16), moonMat);
moon.renderOrder = 2;
scene.add(moon);

const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
const envSky = new THREE.Mesh(sky.geometry, sky.material);
envSky.scale.setScalar(5000);
envScene.add(envSky, new THREE.Mesh(overlay.geometry, overlayMat));
let envRT = null, envT = -99;
function updateEnvironment(t, force) {
  if (!force && Math.abs(t - envT) < 0.4) return;
  envT = t;
  // The sun disc is thousands of times brighter than the sky; it lights the scene directly, so keep it out of the ambient capture.
  skyU.showSunDisc.value = 0;
  const rt = pmrem.fromScene(envScene, 0, 1, 20000, { size: 128 });
  skyU.showSunDisc.value = 1;
  if (envRT) envRT.dispose();
  envRT = rt;
  scene.environment = rt.texture;
}

const hemi = new THREE.HemisphereLight('#dfe9ff', '#5b5140', 0.3);
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.castShadow = true;
sun.shadow.mapSize.setScalar(MOBILE ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 500 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.04;
sun.shadow.radius = 3;
const moonLight = new THREE.DirectionalLight('#a8bcff', 0);
const flashLight = new THREE.PointLight('#dfe8ff', 0, 0, 1.3);
scene.add(hemi, sun, sun.target, moonLight, moonLight.target, flashLight);

// Time-of-day keyframes. Colors are sRGB hex; everything interpolates smoothly between keys.
const MORNING = { el: 14, az: 35, sunI: 2.0, sunC: '#ffd2a6', hemiI: 0.12, exp: 0.5, fogC: '#c3cfdb', fogD: 0.0022, ovTop: '#262e38', ovBot: '#59626e', ovA: 0, night: 0, storm: 0, cloudC: '#fff4e6', cov: 0.28, turb: 4, ray: 1.4, bloomS: 0.2, bloomT: 6.0, envI: 0.4 };
const DAY = { ...MORNING, el: 50, az: 75, sunI: 2.2, sunC: '#fff4e5', hemiI: 0.12, exp: 0.46, fogC: '#b8c8da', fogD: 0.0019, cloudC: '#ffffff', cov: 0.35, turb: 3, ray: 1.6 };
const STORM = { ...DAY, az: 90, sunI: 0.35, sunC: '#c9d3e0', hemiI: 0.35, exp: 0.8, fogC: '#59626e', fogD: 0.011, ovA: 0.97, storm: 1, cloudC: '#5d6674', cov: 0.9, turb: 10, bloomS: 0.2, bloomT: 4.0, envI: 0.8 };
const SUNSET = { ...DAY, el: 4, az: 168, sunI: 1.8, sunC: '#ffa060', hemiI: 0.1, exp: 0.6, fogC: '#c78d77', fogD: 0.0095, ovTop: '#2b3d85', ovBot: '#f29a5c', ovA: 0.72, cloudC: '#ffb08a', cov: 0.3, turb: 6, ray: 2.6, bloomS: 0.3, bloomT: 4.0, envI: 0.6 };
const DUSK = { ...SUNSET, el: -3.5, az: 175, sunI: 0.2, sunC: '#ff7a4a', hemiI: 0.22, exp: 0.9, fogC: '#3a3350', fogD: 0.0055, ovTop: '#121c4a', ovBot: '#4a3358', ovA: 0.65, night: 0.55, cloudC: '#5d4a6e', bloomS: 0.45, bloomT: 1.2, envI: 0.8 };

      const p = flight(t, 0, tmp.p), w = smoother(14, 18.5, t);
      o.pos.set(p.x - lerp(6.5, 10, w), p.y + lerp(1.6, 4.5, w), p.z + lerp(4.5, 11, w));
      o.target.set(p.x + lerp(2, 6, w), p.y - lerp(0, 3, w), p.z);
  } },
  { start: 25, blend: 2.6, fn(t, o) {
      const p = flight(t, 0, tmp.p);
      o.pos.set(p.x - 5.2, p.y + 1.3, p.z + 3.6);
      o.target.set(p.x + 2.5, p.y + 0.4, p.z);
  } },
  { start: 34.5, blend: 3, fn(t, o) {
      const p = flight(t, 0, tmp.p), u = smoother(36, 48, t);
      o.pos.set(p.x - lerp(8, 16, u), p.y + lerp(2.5, 7, u), p.z + lerp(7, 14, u));
      o.target.set(p.x + lerp(4, 24, u), p.y - lerp(1, 5, u), p.z - lerp(0, 4, u));
  } },
  { start: 48.5, blend: 3.5, fn(t, o) {
      const p = flight(t, 0, tmp.p), u = smoother(54.5, 58.5, t), v = smoother(59, 70, t);
      o.pos.set(p.x - 3.6, p.y + 1.0, p.z + 3.4).lerp(tmp.c.set(487.6 + v * 2.4, 26.3 - v * 0.5, 6.2 - v * 2.2), u);
      o.target.set(p.x + 2.5, p.y - 0.1, p.z - 0.3).lerp(tmp.c.set(495.7, 25.2, 0), u);
  } },
];
function placeCamera(t) {
  let i = 0;
  while (i < SHOTS.length - 1 && t >= SHOTS[i + 1].start) i++;
  const cur = SHOTS[i];
  cur.fn(t, shotA);
  const w = i > 0 ? smoother(cur.start, cur.start + cur.blend, t) : 1;
  if (w < 1) {
    SHOTS[i - 1].fn(t, shotB);
    camState.pos.lerpVectors(shotB.pos, shotA.pos, w);
    camState.target.lerpVectors(shotB.target, shotA.target, w);
  } else {
    camState.pos.copy(shotA.pos);
    camState.target.copy(shotA.target);
  }
  if (!REDUCED) {
    // A gentle, low-frequency "handheld" drift; stronger in the storm.
    const amp = 0.06 + 0.16 * env.storm;
    camState.pos.x += amp * (Math.sin(t * 0.9) * 0.6 + Math.sin(t * 2.1 + 1.3) * 0.4);
    camState.pos.y += amp * (Math.sin(t * 1.1 + 0.7) * 0.5 + Math.sin(t * 2.6 + 2.1) * 0.3);
    camState.target.y += amp * 0.4 * Math.sin(t * 0.7 + 2.0);
  }
  camera.position.copy(camState.pos);
  camera.lookAt(camState.target);
}

// ---------------------------------------------------------------- per-frame update (a pure function of t, so scrubbing works)
function update(t) {
  sampleEnv(t);
  const el = THREE.MathUtils.degToRad(env.el), az = THREE.MathUtils.degToRad(env.az);
  sunDir.set(Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az));
  skyU.sunPosition.value.copy(sunDir);
  skyU.turbidity.value = env.turb;
  skyU.rayleigh.value = env.ray;
  skyU.cloudCoverage.value = env.cov;
  skyU.time.value = t * 6;

  let flash = 0, flashAt = null;
  for (const b of BOLTS) {
    const d = t - b.t, p = d >= 0 && d < 0.6 ? Math.exp(-d * 7) : 0;
    b.mesh.visible = p > 0.02;
    b.mat.opacity = p;
    if (p > flash) { flash = p; flashAt = b.pos; }
  }
  const flashK = REDUCED ? 0.25 : 1;
  overlayMat.uniforms.top.value.copy(env.ovTop);
  overlayMat.uniforms.bottom.value.copy(env.ovBot);
  overlayMat.uniforms.alpha.value = env.ovA;
  overlayMat.uniforms.flash.value = flash * 0.35 * flashK;
  flashLight.intensity = flash * 2500 * flashK;
  if (flashAt) flashLight.position.copy(flashAt);

  scene.fog.color.copy(env.fogC);
  scene.fog.density = env.fogD;
  scene.environmentIntensity = env.envI;
  renderer.toneMappingExposure = env.exp;
  bloom.strength = env.bloomS;
  bloom.threshold = env.bloomT;
  hemi.intensity = env.hemiI + flash * 0.8 * flashK;
  sun.color.copy(env.sunC);
  sun.intensity = env.sunI;
  moonLight.intensity = env.night * 0.55;
  starMat.opacity = env.night * (1 - env.storm);
  moonMat.opacity = env.night;
  dayClouds.color.copy(env.cloudC);
  dayClouds.opacity = 0.95 * (1 - env.storm * 0.6);
  stormClouds.color.copy(env.cloudC);
  stormClouds.opacity = smooth(20, 25, t) * (1 - smooth(34, 40, t)) * 0.97;
  waterMat.normalMap.offset.set(t * 0.012, t * 0.007);
  renderer.shadowMap.autoUpdate = t < 43;

  for (const w of turbines) w.blades.rotation.z = t * w.speed + w.phase;
  poseMia(t);

  // City lights come on in a wave from the lakefront toward the plane.
  city.visible = t > 29;
  let nightLights = 0;
  for (let b = 0; b < BUCKETS; b++) {
    const on = smoother(40 + b * 1.1, 41.2 + b * 1.1, t);
    nightLights = Math.max(nightLights, on);
    for (let s = 0; s < 3; s++) cityMats[s * BUCKETS + b].emissiveIntensity = on * 0.85;
  }
  lampMat.opacity = headMat.opacity = tailMat.opacity = smoother(40.5, 43, t);
  litWinMat.color.lerpColors(LIT_OFF, LIT_ON, smoother(41, 42.5, t));
  beaconMat.visible = Math.sin(t * 3.2) > 0.2;
  if (city.visible) {
    const hp = carGeo.head.attributes.position.array, tp = carGeo.tail.attributes.position.array;
    CARS.forEach((c, i) => {
      const x = 462 + (((t * c.speed + c.off) % 84) + 84) % 84 * (c.dir > 0 ? 1 : -1) + (c.dir > 0 ? 0 : 84);
      const z = c.rz + c.lane;
      hp.set([x + c.dir * 1.8, 0.7, z - 0.35, x + c.dir * 1.8, 0.7, z + 0.35], i * 6);
      tp.set([x - c.dir * 1.8, 0.7, z - 0.35, x - c.dir * 1.8, 0.7, z + 0.35], i * 6);
    });
    carGeo.head.attributes.position.needsUpdate = true;
    carGeo.tail.attributes.position.needsUpdate = true;
  }

  // The plane: orientation follows its velocity, and it banks with its real lateral acceleration.
  const landed = smoother(55.4, 56.2, t);
  const alive = smoother(LAUNCH, LAUNCH + 1, t) * (1 - landed);
  const storm = smoother(26.3, 27.6, t) * (1 - smoother(32.8, 35, t));
  const scale = lerp(0.45, 0.85, smoother(11, 14, t)) * lerp(1, 0.9, smoother(52, 55.5, t)) * (1 - smoother(61.3, 62.1, t));
  plane.visible = scale > 0.01;
  plane.scale.setScalar(Math.max(scale, 0.001));
  plane.material.color.lerpColors(PAPER_DRY, PAPER_WET, smooth(27, 29, t) * (1 - smooth(34, 44, t)));
  plane.material.emissiveIntensity = env.night * 0.6;
  if (t < LAUNCH) {
    handPos(t, plane.position);
    plane.lookAt(plane.position.x + 1, plane.position.y + 0.1, plane.position.z);
  } else {
    flight(t, 0, plane.position);
    const v = flight(t, 1, tmp.v), acc = flight(t, 2, tmp.acc);
    const turb = REDUCED ? 0.4 : 1;
    plane.position.y += storm * turb * (Math.sin(t * 2.1) * 0.45 + Math.sin(t * 3.4 + 1) * 0.2);
    plane.position.z += storm * turb * Math.sin(t * 1.7 + 2) * 0.3;
    if (v.lengthSq() < 1e-4 || landed >= 1) v.set(1, 0, 0);
    v.normalize().lerp(tmp.look.set(1, 0, 0), landed).normalize();
    plane.lookAt(plane.position.x + v.x, plane.position.y + v.y, plane.position.z + v.z);
    const vel = flight(t, 1, tmp.b);
    const lat = -(vel.z * acc.x - vel.x * acc.z) / Math.max(Math.hypot(vel.x, vel.z), 0.5);
    let roll = Math.atan(lat / 9.8) + Math.sin(t * 1.7) * 0.05;
    roll += storm * turb * (Math.sin(t * 2.3) * 0.42 + Math.sin(t * 3.7 + 1) * 0.22);
    const pitch = (Math.sin(t * 1.4 + 0.5) * 0.05 + storm * turb * Math.sin(t * 2.9) * 0.2) * alive;
    const flare = -0.28 * smoother(54.8, 55.8, t) * (1 - smoother(55.8, 56.3, t));
    plane.rotateZ(roll * alive);
    plane.rotateX(pitch + flare);
  }

  // rain follows the plane through the storm
  const rainAmt = smoother(26.6, 28.2, t) * (1 - smoother(32.8, 35, t));
  rain.visible = rainAmt > 0.01;
  if (rain.visible) {
    const c = flight(t, 0, tmp.a), arr = rainGeo.attributes.position.array;
    for (let i = 0; i < RAIN; i++) {
      const [ox, oy, oz, len] = rainSeed[i];
      const y = 45 - ((t * 34 + oy * 45) % 45), x = c.x + ox, z = c.z + oz;
      arr[i * 6] = x; arr[i * 6 + 1] = y; arr[i * 6 + 2] = z;
      arr[i * 6 + 3] = x - 0.22 * len; arr[i * 6 + 4] = y - 1.5 * len; arr[i * 6 + 5] = z;
    }
    rainGeo.attributes.position.needsUpdate = true;
    rainMat.opacity = rainAmt;
  }

  // Grandpa's window
  const lightOn = smoother(57.4, 58.0, t);
  glowMat.color.lerpColors(GLOW_OFF, GLOW_ON, lightOn);
  gpa.userData.curtainMat.emissiveIntensity = lightOn * 0.8;
  windowLight.intensity = lightOn * 6;
  const open = smoother(58.6, 60.2, t);
  leftPane.rotation.y = -1.35 * open;
  rightPane.rotation.y = 1.9 * open;
  silMat.opacity = smoother(57.8, 58.6, t);
  silArm.rotation.z = lerp(0, 2.78, smoother(64.6, 65.6, t));

  placeCamera(t);
  sky.position.copy(camera.position);
  overlay.position.copy(camera.position);
  stars.position.copy(camera.position);
  moon.position.copy(camera.position).addScaledVector(MOON_DIR, 2800);
  const focus = camState.target;
  sun.target.position.copy(focus);
  sun.position.copy(focus).addScaledVector(sunDir.y > 0.02 ? sunDir : tmp.a.set(sunDir.x, 0.02, sunDir.z), 200);
  moonLight.target.position.copy(focus);
  moonLight.position.copy(focus).addScaledVector(MOON_DIR, 200);

  updateCaption(t);
}

// ---------------------------------------------------------------- captions & UI
const ui = Object.fromEntries(['caption', 'controls', 'play', 'scrub', 'time', 'restart', 'intro', 'start', 'end', 'again']
  .map(id => [id, document.getElementById(id)]));
ui.scrub.max = DURATION;
let capIdx = -1;
function updateCaption(t) {
  let idx = -1, op = 0;
  CAPTIONS.forEach(([a, b], i) => {
    const o = smooth(a - 0.35, a + 0.35, t) * (1 - smooth(b - 0.35, b + 0.35, t));
    if (o > op) { op = o; idx = i; }
  });
  if (idx >= 0 && idx !== capIdx) { ui.caption.textContent = CAPTIONS[idx][2]; capIdx = idx; }
  ui.caption.style.opacity = op;
}

let t = 0, playing = false, scrubbing = false;
function setPlaying(p) {
  playing = p;
  ui.play.innerHTML = p ? '&#10074;&#10074;' : '&#9654;';
  ui.play.setAttribute('aria-label', p ? 'Pause' : 'Play');
  poke();
}
function restart() { t = 0; ui.end.classList.add('hidden'); setPlaying(true); ui.play.focus({ preventScroll: true }); }
ui.start.onclick = () => { ui.intro.classList.add('hidden'); setPlaying(true); ui.play.focus({ preventScroll: true }); };
ui.again.onclick = restart;
ui.restart.onclick = restart;
ui.play.onclick = () => (t >= DURATION ? restart() : setPlaying(!playing));
ui.scrub.addEventListener('pointerdown', () => (scrubbing = true));
addEventListener('pointerup', () => (scrubbing = false));
ui.scrub.addEventListener('input', () => {
  t = +ui.scrub.value;
  ui.intro.classList.add('hidden');
  if (t < DURATION) ui.end.classList.add('hidden');
});
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter'))) return;
  if (e.key === ' ') { e.preventDefault(); ui.intro.classList.add('hidden'); ui.play.onclick(); }
  else if (e.key === 'ArrowRight') t = Math.min(DURATION - 0.01, t + 5);
  else if (e.key === 'ArrowLeft') { t = Math.max(0, t - 5); ui.end.classList.add('hidden'); }
  else if (e.key.toLowerCase() === 'r') { ui.intro.classList.add('hidden'); restart(); }
});
let idleTimer;
function poke() {
  ui.controls.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => playing && !scrubbing && ui.controls.classList.add('idle'), 2500);
}
addEventListener('pointermove', poke);
addEventListener('pointerdown', poke);
addEventListener('keydown', poke);
addEventListener('resize', applySize);
applySize();

function render(t, forceEnv) {
  update(t);
  updateEnvironment(t, forceEnv);
  composer.render();
}

const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
let last = performance.now(), lastT = -1, frameAvg = 16.7, lastCheck = last, goodChecks = 0;
function frame(now) {
  const raw = now - last;
  const dt = Math.min(raw / 1000, 0.1);
  last = now;
  if (playing) {
    t += dt;
    if (t >= DURATION) { t = DURATION; setPlaying(false); ui.end.classList.remove('hidden'); }
    frameAvg = frameAvg * 0.9 + Math.min(raw, 100) * 0.1;
    if (now - lastCheck > 1000) {
      lastCheck = now;
      if (frameAvg > 21 && dpr > 0.6) { dpr = Math.max(0.6, dpr * 0.85); applySize(); goodChecks = 0; }
      else if (frameAvg < 17.5 && dpr < DPR_MAX) { if (++goodChecks >= 5) { dpr = Math.min(DPR_MAX, dpr * 1.1); applySize(); goodChecks = 0; } }
      else goodChecks = 0;
    }
  }
  render(t, Math.abs(t - lastT) > 1);
  lastT = t;
  if (!scrubbing) ui.scrub.value = t;
  ui.time.textContent = fmt(t);
  requestAnimationFrame(frame);
}

// Compile every shader and upload every texture behind the title card, so nothing stalls mid-story.
[29, 50, 60, 0].forEach(v => render(v, true));
requestAnimationFrame(frame);

window.story = { seek(v) { t = v; render(t, true); }, get t() { return t; }, get dpr() { return dpr; } };
</script>
</body>
</html>
