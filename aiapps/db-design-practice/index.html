{ id: 'er30', tag: 'ER', ex: '7.22', type: 'tf', q: '"A player listed for a game must belong to one of the two teams in that game" can be expressed with (min, max) constraints.', answer: false, explain: '(min, max) only counts participations. This rule compares values across relationships and has to be stated as an extra constraint (an assertion or application check).' },
{ id: 'er31', tag: 'ER', ex: '7.22', type: 'mc', q: 'Soccer: each side fields 11 starters and up to 5 substitutes. What (min, max) does GAME get in PLAYED_IN?', options: ['(22,32)', '(11,16)', '(2,2)', '(0,N)'], answer: 0, explain: 'Count the players per game: 2 × 11 = 22 at least, 2 × 16 = 32 at most.' },
{ id: 'er32', tag: 'ER', ex: null, type: 'tf', q: 'A derived attribute (e.g. Age from Bdate) is drawn as a dashed oval.', answer: true, explain: 'Dashed oval = derived, double oval = multivalued, underlined = key, dashed underline = partial key.' },

{ id: 'map01', tag: 'MAP', ex: null, type: 'mc', q: 'Mapping a weak entity type: its relation\'s primary key is…', options: ['the owner\'s primary key plus the partial key', 'the partial key alone', 'a new surrogate id', 'the owner\'s primary key alone'], answer: 0, explain: 'Step 2: include the owner\'s primary key as a foreign key; the PK is that FK combined with the partial key.' },
{ id: 'map02', tag: 'MAP', ex: null, type: 'mc', q: 'A binary 1:N relationship is usually mapped by…', options: ['adding the 1-side\'s primary key as a foreign key in the N-side relation', 'adding the N-side\'s primary key as a foreign key in the 1-side relation', 'always creating a separate relation', 'merging the two relations'], answer: 0, explain: 'Step 4: each N-side tuple refers to at most one 1-side tuple, so a single FK column on the N side works. Relationship attributes go there too.' },
{ id: 'map03', tag: 'MAP', ex: null, type: 'mc', q: 'A binary M:N relationship is mapped by…', options: ['a new relation whose PK is both participants\' primary keys combined', 'a foreign key on either side', 'a multivalued attribute', 'a foreign key on both sides'], answer: 0, explain: 'Step 5: an FK column can hold only one value, so M:N needs its own relation, keyed by both FKs, holding the relationship\'s attributes.' },
{ id: 'map04', tag: 'MAP', ex: null, type: 'mc', q: 'A multivalued attribute A of entity E is mapped to…', options: ['a new relation with E\'s key and A, both forming the PK', 'several columns A1, A2, A3 in E', 'a comma-separated string in E', 'a foreign key in E'], answer: 0, explain: 'Step 6: one row per value, so the PK is (E\'s key, A). If A is composite, include its components.' },
{ id: 'map05', tag: 'MAP', ex: null, type: 'mc', q: 'A composite attribute Name(Fname, Minit, Lname) maps to…', options: ['the columns Fname, Minit, Lname', 'one column Name', 'a separate relation', 'Name plus the three parts'], answer: 0, explain: 'Only the simple (leaf) components become columns.' },
{ id: 'map06', tag: 'MAP', ex: null, type: 'mc', q: 'For a 1:1 relationship where one side participates totally (every department has a manager), the preferred mapping is…', options: ['put the FK in the total side\'s relation (DEPARTMENT gets Mgr_ssn)', 'put the FK in the partial side\'s relation', 'always merge the two relations', 'always create a separate relation'], answer: 0, explain: 'Foreign-key approach: the total side\'s FK is never NULL. On EMPLOYEE it would be NULL for almost everyone.' },
{ id: 'map07', tag: 'MAP', ex: '7.23', type: 'mc', q: 'How many relations does the basic mapping of the BANK diagram (Figure 7.21) produce?', options: ['7', '5', '6', '9'], answer: 0, explain: 'BANK, BANK_BRANCH, ACCOUNT, LOAN, CUSTOMER (entities) + A_C and L_C (M:N). BRANCHES, ACCTS and LOANS become foreign keys.' },
{ id: 'map08', tag: 'MAP', ex: '7.23', type: 'tf', q: 'In the mapped BANK schema, ACCOUNT\'s foreign key to its branch must be the pair (Bank_code, Branch_no).', answer: true, explain: 'BANK_BRANCH\'s primary key is composite; Branch_no alone is not unique across banks, so it can\'t be referenced by itself.' },
{ id: 'map09', tag: 'MAP', ex: '7.19', type: 'mc', q: 'In the mapped AIRLINE schema, what is the primary key of SEAT_RESERVATION?', options: ['(Flight_number, Leg_number, Date, Seat_number)', '(Seat_number)', '(Date, Seat_number)', '(Flight_number, Seat_number)'], answer: 0, explain: 'SEAT is weak under LEG_INSTANCE, whose key is (Flight_number, Leg_number, Date); add the partial key Seat_number.' },
{ id: 'map10', tag: 'MAP', ex: '7.19', type: 'mc', q: 'In the mapped AIRLINE schema, where does Scheduled_departure_time go?', options: ['FLIGHT_LEG, next to Departure_airport_code', 'AIRPORT', 'A separate DEPARTURE_AIRPORT relation', 'LEG_INSTANCE'], answer: 0, explain: 'DEPARTURE_AIRPORT is 1:N, so it becomes an FK in FLIGHT_LEG and its attribute moves with it.' },
{ id: 'map11', tag: 'MAP', ex: '7.19', type: 'tf', q: 'CAN_LAND needs its own relation in the mapped AIRLINE schema.', answer: true, explain: 'It is the only M:N relationship: CAN_LAND(Airplane_type_name, Airport_code).' },
{ id: 'map12', tag: 'MAP', ex: '7.16', type: 'mc', q: 'In 7.16, GRADE_REPORT references SECTION. What must its foreign key to SECTION be?', options: ['(Course_no, Semester, Year, Sec_no)', '(Sec_no)', '(Course_no, Sec_no)', '(Semester, Year, Sec_no)'], answer: 0, explain: 'An FK must reference the whole primary key, and SECTION\'s PK is the owner key Course_no plus the partial key (Sec_no, Semester, Year).' },
{ id: 'map13', tag: 'MAP', ex: '7.17', type: 'mc', q: 'Mapping 7.17\'s nested attribute, what is the PK of the relation holding previous degrees?', options: ['(Ssn, College_name, Start_date, Degree_name)', '(Degree_name)', '(Ssn, Degree_name)', '(College_name, Degree_name)'], answer: 0, explain: 'Each nested level carries the full key of the level above: student → previous college (Ssn, College_name, Start_date) → degree.' },
{ id: 'map14', tag: 'MAP', ex: '7.22', type: 'tf', q: 'In 7.22\'s mapping, the minimum of 22 players per game is enforced by the primary key of PLAYED_IN.', answer: false, explain: 'Keys and FKs enforce uniqueness and existence, not minimum counts. A min > 1 needs an assertion, trigger or application check.' },
{ id: 'map15', tag: 'MAP', ex: null, type: 'tf', q: 'Attributes of an M:N relationship become columns of the relation created for that relationship.', answer: true, explain: 'E.g. Hours of WORKS_ON goes into WORKS_ON(Essn, Pno, Hours).' },

{ id: 'eer01', tag: 'EER', ex: null, type: 'mc', q: 'A "d" in the specialization circle means…', options: ['disjoint: an entity is in at most one subclass', 'derived subclass', 'total specialization', 'defining attribute present'], answer: 0, explain: '"d" = disjoint, "o" = overlapping. Total vs partial is shown by the double vs single line from the superclass.' },
{ id: 'eer02', tag: 'EER', ex: null, type: 'tf', q: 'A double line from the superclass to the specialization circle means every superclass entity must belong to some subclass.', answer: true, explain: 'That is total specialization. A single line is partial.' },
{ id: 'eer03', tag: 'EER', ex: '8.17', type: 'mc', q: 'If every account is exactly one of savings or checking, the specialization is…', options: ['disjoint and total', 'disjoint and partial', 'overlapping and total', 'overlapping and partial'], answer: 0, explain: 'Exactly one: no account in both (disjoint) and none in neither (total).' },
{ id: 'eer04', tag: 'EER', ex: '8.17', type: 'mc', q: 'In 8.17, why model TRANSACTION as a weak entity of ACCOUNT?', options: ['A transaction is numbered within its account and can\'t exist without it', 'Because it has no attributes', 'Because transactions are subclasses of accounts', 'Because it is M:N with ACCOUNT'], answer: 0, explain: 'Transaction numbers like 1, 2, 3 restart per account (partial key) and each transaction belongs to exactly one account. A global Trans_id with a 1:N relationship is also acceptable if stated.' },
{ id: 'eer05', tag: 'EER', ex: '8.17', type: 'tf', q: 'Because TRANSACTION and PAYMENT both have Amount, Date and Time, they must be generalized into one superclass.', answer: false, explain: 'Generalization is a design choice, not a rule. They have different owners (ACCOUNT vs LOAN) and uses, so keeping them separate is reasonable.' },
{ id: 'eer06', tag: 'EER', ex: null, type: 'mc', q: 'Which mapping option creates one relation with a Boolean flag per subclass, suitable for overlapping subclasses?', options: ['8D', '8A', '8B', '8C'], answer: 0, explain: '8C uses one type attribute (disjoint only); 8D uses one flag per subclass (overlapping allowed).' },
{ id: 'eer07', tag: 'EER', ex: null, type: 'mc', q: 'Option 8B (subclass relations only) should only be used when the specialization is…', options: ['total (and preferably disjoint)', 'partial', 'overlapping and partial', 'a category'], answer: 0, explain: 'With a partial specialization, entities in no subclass would have nowhere to go. With overlap, an entity\'s inherited attributes would be stored twice.' },
{ id: 'eer08', tag: 'EER', ex: null, type: 'mc', q: 'Option 8A maps a specialization to…', options: ['a superclass relation plus one relation per subclass holding its own attributes and the superclass key', 'only subclass relations', 'one relation with a type attribute', 'one relation with Boolean flags'], answer: 0, explain: '8A works for any specialization. Each subclass\'s PK is also an FK to the superclass relation.' },
{ id: 'eer09', tag: 'EER', ex: null, type: 'tf', q: 'A subclass entity inherits all attributes and relationships of its superclass.', answer: true, explain: 'That is type inheritance. A SAVINGS_ACCT has Acct_no and Balance and takes part in A_C.' },
{ id: 'eer10', tag: 'EER', ex: null, type: 'mc', q: 'A predicate-defined (condition-defined) subclass is one whose membership…', options: ['is determined by a condition on a superclass attribute (e.g. Acct_type = \'Savings\')', 'is chosen by the user for each entity', 'comes from a union of several superclasses', 'is derived from a relationship'], answer: 0, explain: 'When all subclasses use the same attribute, it\'s an attribute-defined specialization and the attribute is written next to the line.' },
{ id: 'eer11', tag: 'EER', ex: '8.18', type: 'mc', q: 'In 8.18, how should "multisport complexes have areas designated for each sport with a location indicator" be modeled?', options: ['A multivalued composite attribute {Sport_area(Sport, Location_indicator)} of MULTISPORT (or a weak entity)', 'A single attribute Location of COMPLEX', 'A subclass of EVENT', 'An attribute of ONE_SPORT'], answer: 0, explain: 'Each multisport complex has several sport areas, each with two parts. It belongs to MULTISPORT only, which is exactly why the subclass exists.' },
{ id: 'eer12', tag: 'EER', ex: '8.18', type: 'tf', q: 'In 8.18, the split of complexes into one-sport and multisport is naturally disjoint and total.', answer: true, explain: 'A complex hosts either one sport or several; it can\'t be both and must be one of them.' },
{ id: 'eer13', tag: 'EER', ex: '8.18', type: 'mc', q: 'In 8.18, "for each type, the number of facilities needed and an approximate budget" is best stored…', options: ['once per type, e.g. in a FACILITY_TYPE entity', 'as attributes of every COMPLEX', 'as attributes of EVENT', 'as a derived attribute of OFFICIAL'], answer: 0, explain: 'These values describe the type as a whole. Repeating them on every complex would be redundant and could disagree.' },
{ id: 'eer14', tag: 'EER', ex: '8.18', type: 'mc', q: 'In 8.18, the OFFICIAL–EVENT relationship is…', options: ['M:N', '1:N from OFFICIAL to EVENT', '1:N from EVENT to OFFICIAL', '1:1'], answer: 0, explain: 'An official works many events and an event has several officials.' },
{ id: 'eer15', tag: 'EER', ex: null, type: 'tf', q: 'In option 8C, subclass-specific attributes are NULL for entities that are not in that subclass.', answer: true, explain: 'That is the cost of the single-relation options: many NULLs if subclasses have many specific attributes.' },

{ id: 'rel01', tag: 'REL', ex: '3.13', type: 'ms', q: 'For CLASS(Course#, Univ_Section#, Instructor_name, Semester, Building_code, Room#, Time_period, Weekdays, Credit_hours), which can be candidate keys under reasonable assumptions? Select all that apply.', options: ['{Univ_Section#}', '{Instructor_name, Semester, Weekdays, Time_period}', '{Building_code, Room#, Semester, Weekdays, Time_period}', '{Course#, Semester}', '{Univ_Section#, Course#}'], answer: [0, 1, 2], explain: 'An instructor can\'t teach two classes at once; a room can\'t hold two classes at once. {Course#, Semester} fails with multiple sections, and {Univ_Section#, Course#} is a superkey but not minimal.' },
{ id: 'rel02', tag: 'REL', ex: '3.13', type: 'tf', q: '{Univ_Section#, Course#} is a candidate key of CLASS.', answer: false, explain: 'It is unique, but removing Course# still leaves a unique set. A candidate key must be minimal; this is only a superkey.' },
{ id: 'rel03', tag: 'REL', ex: '3.14', type: 'ms', q: 'In the order-processing schema (3.14), which are foreign keys? Select all that apply.', options: ['ORDER.Cust# → CUSTOMER', 'ORDER_ITEM.Item# → ITEM', 'SHIPMENT.Warehouse# → WAREHOUSE', 'WAREHOUSE.City → CUSTOMER.City', 'SHIPMENT.Order# → ORDER'], answer: [0, 1, 2, 4], explain: 'City is not a key of CUSTOMER, so it can\'t be referenced. The full list also has ORDER_ITEM.Order# → ORDER.' },
{ id: 'rel04', tag: 'REL', ex: '3.14', type: 'mc', q: 'An order can ship from several warehouses. Assuming it ships at most once from each, what is SHIPMENT\'s primary key?', options: ['(Order#, Warehouse#)', '(Order#)', '(Warehouse#)', '(Order#, Warehouse#, Ship_date) is required in every case'], answer: 0, explain: 'Order# alone repeats for multi-warehouse orders. Add Ship_date only if one order can ship several times from the same warehouse.' },
{ id: 'rel05', tag: 'REL', ex: '3.14', type: 'tf', q: '"Ord_amt equals the sum of Qty × Unit_price for the order\'s items" can be enforced by a foreign key.', answer: false, explain: 'Foreign keys only check that referenced values exist. This is a semantic constraint (assertion or trigger).' },
{ id: 'rel06', tag: 'REL', ex: '3.14', type: 'mc', q: 'Which of these is a semantic constraint for the order schema, not a key or referential one?', options: ['Ship_date ≥ Odate', 'Order# is unique', 'ORDER_ITEM.Item# must exist in ITEM', 'Cust# is not NULL in CUSTOMER'], answer: 0, explain: 'The others are key, referential and entity-integrity constraints.' },
{ id: 'rel07', tag: 'REL', ex: '3.15', type: 'ms', q: 'In the trip schema (3.15), which foreign keys can be declared? Select all that apply.', options: ['TRIP.Ssn → SALESPERSON.Ssn', 'EXPENSE.Trip_id → TRIP.Trip_id', 'SALESPERSON.Dept_no → DEPARTMENT', 'EXPENSE.Account# → ACCOUNT'], answer: [0, 1], explain: 'There is no DEPARTMENT or ACCOUNT relation in this schema, so those can\'t be declared (mention them as assumptions).' },
{ id: 'rel08', tag: 'REL', ex: '3.15', type: 'mc', q: '"A trip can be charged to one or more accounts." What is EXPENSE\'s primary key?', options: ['(Trip_id, Account#)', '(Trip_id)', '(Account#)', '(Trip_id, Amount)'], answer: 0, explain: 'Trip_id repeats for multi-account trips, and one account is charged by many trips. The pair is unique (assuming one row per trip per account).' },
{ id: 'rel09', tag: 'REL', ex: null, type: 'tf', q: 'Entity integrity: no primary-key attribute may be NULL.', answer: true, explain: 'Otherwise some tuples couldn\'t be identified.' },
{ id: 'rel10', tag: 'REL', ex: null, type: 'tf', q: 'A foreign key value may be NULL (unless the FK is part of the primary key or declared NOT NULL).', answer: true, explain: 'Referential integrity requires an FK value to match an existing PK value or be entirely NULL.' },
{ id: 'rel11', tag: 'REL', ex: null, type: 'mc', q: 'What is the difference between a superkey and a candidate key?', options: ['A candidate key is a minimal superkey', 'A superkey is a minimal candidate key', 'A superkey must be a single attribute', 'There is no difference'], answer: 0, explain: 'Every candidate key is a superkey; a superkey may contain extra attributes. One candidate key is chosen as the primary key.' },
{ id: 'rel12', tag: 'REL', ex: '3.15', type: 'tf', q: 'TRIP.Ssn should allow NULL.', answer: false, explain: 'Every trip is made by some salesperson. The FK should be NOT NULL.' },
];
const QBY = new Map(BANK.map(q => [q.id, q]));
const TAGS = { ER: 'ER model (Ch 7)', EER: 'EER model (Ch 8)', MAP: 'ER → relational mapping', REL: 'Relational model (Ch 3)' };
const KIND = { tf: 'True or false', mc: 'Choose one', ms: 'Select all that apply' };
const LETTERS = 'ABCDE';

// ---------- state ----------
const KEY = 'dbpractice:v1';
const store = load(KEY, {});
const state = { ex: store.ex || {}, q: store.q || {}, theme: ['auto', 'light', 'dark'].includes(store.theme) ? store.theme : 'auto' };
const persist = () => save(KEY, state);
const exState = id => state.ex[id] || (state.ex[id] = { checks: [], notes: '', open: [] });
let quiz = null; // { title, ids, i, ans: {id: value}, sel: {id: [..]}, perm: {id: [..]}, done: {id: bool}, finished }

function isRight(q, a) {
  if (q.type === 'ms') return Array.isArray(a) && a.length === q.answer.length && [...a].sort((x, y) => x - y).every((v, i) => v === q.answer[i]);
  return a === q.answer;
}
function record(id, ok) {
  const s = state.q[id] || (state.q[id] = { seen: 0, right: 0, last: null });
  s.seen++; if (ok) s.right++; s.last = ok; persist();
}
function startQuiz(title, ids) {
  ids = shuffle([...ids]);
  if (!ids.length) return;
  const perm = {};
  for (const id of ids) { const q = QBY.get(id); if (q.type !== 'tf') perm[id] = shuffle(q.options.map((_, i) => i)); }
  quiz = { title, ids, i: 0, ans: {}, sel: {}, perm, done: {}, finished: false };
  location.hash = '#quiz';
}

// ---------- views ----------
const app = document.getElementById('app');
const THEME_ICON = {
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
};
const themeBtn = () => `<button class="icon" data-act="theme" title="Theme: ${state.theme}" aria-label="Theme: ${state.theme}. Click to change.">${THEME_ICON[state.theme]}</button>`;
function exProgress(e) { const s = state.ex[e.id]; return s ? s.checks.filter(Boolean).length : 0; }
const qFor = pred => BANK.filter(pred).map(q => q.id);
const missed = () => BANK.filter(q => state.q[q.id]?.last === false).map(q => q.id);

function homeView() {
  const seen = BANK.filter(q => state.q[q.id]?.seen).length, rightNow = BANK.filter(q => state.q[q.id]?.last === true).length;
  let h = `<div class="top"><a class="back" href="../../">← aiapps</a><div class="grow"></div>${themeBtn()}</div>
  <h1>Database design practice</h1>
  <p class="sub">The assigned book exercises from <i>Fundamentals of Database Systems</i> (Elmasri &amp; Navathe, 6th ed.), with worked answers you open one step at a time, plus a ${BANK.length}-question drill on the same ideas.</p>
  <div class="howto">How to use it: open an exercise and draw your own ER/EER diagram, with (min, max) on every line, on paper or on the sketch pad on each page. Map it to relations, then open the answer sections one at a time and tick the self-check list. The <b>Draw it yourself</b> set has 8 new problems in the same style for extra practice.</div>`;
  for (const c of CHAPTERS) {
    h += `<h2>${esc(c.t)}</h2><div class="grid">`;
    for (const id of c.ids) {
      const e = EX[id], n = exProgress(e), tot = e.check.length;
      h += `<button class="ex${n === tot ? ' done' : ''}" data-act="open" data-id="${id}"><span class="n">${id} <span class="chip">${esc(e.kind)}</span></span><span class="t">${esc(e.title)}</span>
        <div class="bar" aria-hidden="true"><i style="width:${pct(n, tot)}%"></i></div><span class="m">${n ? `${n} / ${tot} self-checks ticked` : 'not started'}</span></button>`;
    }
    h += '</div>';
  }
  const nm = missed().length;
  h += `<h2>Drill</h2><div class="small" style="margin-bottom:10px">${seen} of ${BANK.length} questions tried · ${rightNow} right on the last try</div><div class="modes">
    <button class="mode primary" data-act="quiz" data-tag="all"><b>All topics</b><span>${BANK.length} questions, shuffled</span></button>
    ${Object.entries(TAGS).map(([t, name]) => `<button class="mode" data-act="quiz" data-tag="${t}"><b>${esc(name)}</b><span>${qFor(q => q.tag === t).length} questions</span></button>`).join('')}
    <button class="mode" data-act="quiz" data-tag="missed" ${nm ? '' : 'disabled'}><b>Missed · ${nm}</b><span>Wrong on your last try</span></button>
  </div>
  <h2>Cheat sheet</h2>
  <div class="card ans" style="padding:14px 16px">
    <h4 style="margin-top:0">(min, max)</h4>${ul([
      'Written next to entity E on its line to R: each E takes part in at least min and at most max R instances.',
      'min = 0 → partial; min ≥ 1 → total (double line). 1:N converts to (?,N) on the 1 side and (?,1) on the N side.',
      'Weak entity in its identifying relationship: always (1,1).',
    ])}
    <h4>ER → relations (Chapter 9 algorithm)</h4><ol>
      <li>Strong entity → relation with simple attributes; pick a primary key.</li>
      <li>Weak entity → relation with owner PK as FK; PK = owner PK + partial key.</li>
      <li>1:1 → FK in one side (prefer the total side), or merge, or a cross-reference relation.</li>
      <li>1:N → FK on the N side, with the relationship's attributes.</li>
      <li>M:N → new relation; PK = both FKs; relationship attributes go here.</li>
      <li>Multivalued attribute → new relation; PK = owner key + the attribute.</li>
      <li>n-ary relationship → new relation with all participants' keys.</li>
      <li>Specialization: 8A superclass + subclass relations (always works) · 8B subclass relations only (total) · 8C one relation + type attribute (disjoint) · 8D one relation + Boolean flags (overlapping).</li>
      <li>Category (union type) → surrogate key in the category relation.</li></ol>
  </div>
  <footer><p>Exercise prompts are paraphrased; the answers are original and are one reasonable design each. Design questions have many right answers, so what matters is that your assumptions are stated and your constraints match them.</p>
  <p>Progress (ticked checks, your notes, quiz results) is saved in this browser. <button class="btn ghost sm" data-act="reset">Reset progress</button></p></footer>`;
  return h;
}

function exView(id) {
  const e = EX[id], s = exState(id), order = CHAPTERS.flatMap(c => c.ids), i = order.indexOf(id);
  const prev = order[i - 1], next = order[i + 1], nq = qFor(q => q.ex === id).length;
  let h = `<div class="top"><a class="back" href="#">← All exercises</a><div class="grow"></div>${themeBtn()}</div>
  <div class="row" style="margin-bottom:4px"><span class="chip kind">Exercise ${id}</span><span class="chip">${esc(e.kind)}</span></div>
  <h1>${esc(e.title)}</h1>
  <div class="card prompt" style="margin-top:12px">${e.prompt}</div>
  <h2>Your attempt</h2>
  ${padHTML()}
  <textarea data-act="notes" placeholder="Jot your entities, relationships, (min, max) and relations here before opening the answers. Saved in this browser.">${esc(s.notes)}</textarea>
  <details class="sec"${s.open.includes('hints') ? ' open' : ''} data-sec="hints"><summary><span class="grow">Hints</span><span class="small">${e.hints.length}</span></summary><div class="ans">${ul(e.hints)}</div></details>
  <h2>Worked answer <button class="btn ghost sm" data-act="openall">open all</button></h2>`;
  e.sections.forEach((sec, k) => {
    let body = '';
    if (sec.diagram) {
      const d = DIAGRAMS[sec.diagram]();
      body += `<div class="dia-bar"><span class="small">Wide diagram: zoom in to read it on a phone.</span><button class="btn sm" data-act="zoom">Zoom</button></div>
        <div class="dia">${erSVG(d, `${e.title}: ${sec.h}`)}</div><p class="legend">${LEGEND}</p>`;
    }
    if (sec.rels) body += relHTML(sec.rels);
    if (sec.html) body += sec.html;
    h += `<details class="sec"${s.open.includes(k) ? ' open' : ''} data-sec="${k}"><summary><span class="grow">${esc(sec.h)}</span></summary><div class="ans">${body}</div></details>`;
  });
  h += `<h2>Self-check</h2><div class="card">${e.check.map((c, k) => `<label class="check"><input type="checkbox" data-act="check" data-k="${k}" ${s.checks[k] ? 'checked' : ''}><span>${c}</span></label>`).join('')}
    ${exProgress(e) === e.check.length ? '<p class="pill-good" style="margin:8px 0 0">All checks ticked. Nice.</p>' : ''}</div>
  <div class="actions">${nq ? `<button class="btn primary" data-act="quiz" data-tag="ex:${id}">Drill ${id} · ${nq} questions</button>` : ''}<span class="grow"></span>
    ${prev ? `<a class="btn" href="#ex/${prev}">← ${prev}</a>` : ''}${next ? `<a class="btn" href="#ex/${next}">${next} →</a>` : ''}</div>`;
  return h;
}

function quizView() {
  if (quiz.finished) return resultsView();
  const id = quiz.ids[quiz.i], q = QBY.get(id), n = quiz.ids.length, done = !!quiz.done[id];
  const sel = quiz.sel[id] || [], a = quiz.ans[id], nRight = quiz.ids.filter(x => quiz.done[x] && isRight(QBY.get(x), quiz.ans[x])).length;
  let h = `<div class="top"><a class="back" href="#">← Home</a><div class="grow"></div><span class="small">${nRight} right</span>${themeBtn()}</div>
  <div class="row"><span class="chip">${esc(TAGS[q.tag])}</span>${q.ex ? `<span class="chip">Ex ${q.ex}</span>` : ''}<span class="chip kind">${KIND[q.type]}</span><span class="grow" style="flex:1"></span><span class="small">${esc(quiz.title)} · ${quiz.i + 1} / ${n}</span></div>
  <div class="progress"><i style="width:${pct(quiz.i + (done ? 1 : 0), n)}%"></i></div>
  <div class="q" id="qtext" tabindex="-1">${fmt(q.q)}</div>`;
  if (q.type === 'tf') {
    h += `<div class="opts tf">${[true, false].map((v, k) => {
      let cls = '';
      if (done) cls = v === q.answer ? 'right' : (a === v ? 'wrong' : '');
      return `<button class="opt ${cls}" data-act="pick" data-v="${v}" ${done ? 'disabled' : ''}><span class="tx">${v ? 'True' : 'False'}</span></button>`;
    }).join('')}</div>`;
  } else {
    if (q.type === 'ms') h += '<div class="hint">Select every correct option, then press Check.</div>';
    h += '<div class="opts">' + quiz.perm[id].map((oi, k) => {
      const chosen = q.type === 'ms' ? sel.includes(oi) : a === oi, correct = q.type === 'ms' ? q.answer.includes(oi) : q.answer === oi;
      let cls = '', mark = '';
      if (done) { if (correct && chosen) { cls = 'right'; mark = '✓'; } else if (chosen) { cls = 'wrong'; mark = '✗'; } else if (correct) { cls = q.type === 'ms' ? 'missed' : 'right'; mark = q.type === 'ms' ? 'missed' : '✓'; } }
      else if (chosen) cls = 'sel';
      return `<button class="opt ${cls}" data-act="pick" data-v="${oi}" ${done ? 'disabled' : ''}><span class="k">${LETTERS[k]}</span><span class="tx">${fmt(q.options[oi])}</span><span class="mark">${mark}</span></button>`;
    }).join('') + '</div>';
  }
  if (done) {
    const ok = isRight(q, a);
    h += `<div class="feedback ${ok ? 'ok' : 'no'}"><div class="verdict">${ok ? 'Correct' : 'Not quite'}</div><div>${fmt(q.explain)}</div>
      ${q.ex ? `<div class="small" style="margin-top:8px"><a href="#ex/${q.ex}">Open exercise ${q.ex}</a></div>` : ''}</div>`;
  }
  h += `<div class="actions"><span class="grow"></span>${!done && q.type === 'ms' ? `<button class="btn primary" data-act="check-ms" ${sel.length ? '' : 'disabled'}>Check</button>` : ''}
    ${done ? `<button class="btn primary" data-act="next">${quiz.i + 1 < n ? 'Next →' : 'See results'}</button>` : ''}</div>
  <p class="small" style="margin-top:22px">Keys: <kbd>A</kbd>–<kbd>E</kbd> or <kbd>1</kbd>–<kbd>5</kbd> pick, <kbd>T</kbd>/<kbd>F</kbd>, <kbd>Enter</kbd> check / next.</p>`;
  return h;
}
function resultsView() {
  const ids = quiz.ids, right = ids.filter(id => isRight(QBY.get(id), quiz.ans[id]));
  const wrong = ids.filter(id => !right.includes(id));
  let h = `<div class="top"><a class="back" href="#">← Home</a><div class="grow"></div>${themeBtn()}</div>
  <h1>${esc(quiz.title)}: results</h1>
  <div class="card score" style="margin-top:14px"><b>${pct(right.length, ids.length)}%</b><span>${right.length} of ${ids.length} right</span></div>
  <div class="actions">${wrong.length ? `<button class="btn primary" data-act="retry">Retry the ${wrong.length} missed</button>` : ''}<a class="btn" href="#">Home</a></div>
  <h2>Review</h2>`;
  for (const id of ids) {
    const q = QBY.get(id), ok = right.includes(id);
    const ans = q.type === 'tf' ? (q.answer ? 'True' : 'False') : q.type === 'mc' ? q.options[q.answer] : q.answer.map(i => q.options[i]).join('; ');
    h += `<details class="rev"><summary><span class="m ${ok ? 'ok' : 'no'}">${ok ? '✓' : '✗'}</span><span class="s">${fmt(q.q)}</span></summary>
      <div class="body"><p><b>Answer:</b> ${fmt(ans)}</p><p>${fmt(q.explain)}</p></div></details>`;
  }
  return h;
}

// ---------- sketch pad ----------
// Draw ER/EER diagrams by hand or with shape stamps. Saved per exercise as a list of items, not pixels.
const PAD_W = 1000, PAD_H = 750;
const PAD_TOOLS = [['pen', 'Pen'], ['rect', 'Entity ▭'], ['dia', 'Relation ◇'], ['oval', 'Attribute ◯'], ['circle', 'd/o/U ○'], ['line', 'Line'], ['text', 'Text'], ['erase', 'Eraser']];
let pad = null;
function padHTML() {
  return `<div class="pad" id="pad"><div class="padbar">${PAD_TOOLS.map(([t, l]) => `<button data-tool="${t}">${l}</button>`).join('')}
    <span class="sep"></span><button data-pad="dbl">Double</button><button data-pad="undo">Undo</button><button data-pad="clear">Clear</button><button data-pad="full">Expand</button></div>
    <canvas width="${PAD_W}" height="${PAD_H}" aria-label="Sketch pad"></canvas>
    <div class="padhelp">Drag to place a shape, then type its label. <b>Double</b> draws weak entities, identifying relationships, multivalued attributes and total-participation lines. Start a label with <code>_</code> for a key or <code>~</code> for a partial key. Saved in this browser.</div></div>`;
}
function padKey(id) { return 'dbpractice:sketch:' + id; }
function initPad(id) {
  const root = document.getElementById('pad');
  if (!root) return;
  const cv = root.querySelector('canvas'), ctx = cv.getContext('2d');
  let items = [];
  try { items = JSON.parse(localStorage.getItem(padKey(id))) || []; } catch {}
  pad = { id, root, cv, ctx, items, tool: pad?.tool || 'pen', dbl: pad?.dbl || false, cur: null };
  const saveItems = () => { try { localStorage.setItem(padKey(id), JSON.stringify(pad.items)); } catch {} };
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const syncBar = () => {
    root.querySelectorAll('[data-tool]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === pad.tool));
    root.querySelector('[data-pad="dbl"]').setAttribute('aria-pressed', pad.dbl);
  };
  function shapePath(it, inset) {
    const x1 = Math.min(it.x1, it.x2) + inset, x2 = Math.max(it.x1, it.x2) - inset, y1 = Math.min(it.y1, it.y2) + inset, y2 = Math.max(it.y1, it.y2) - inset;
    const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
    ctx.beginPath();
    if (it.t === 'rect') ctx.rect(x1, y1, x2 - x1, y2 - y1);
    else if (it.t === 'dia') { ctx.moveTo(cx, y1); ctx.lineTo(x2, cy); ctx.lineTo(cx, y2); ctx.lineTo(x1, cy); ctx.closePath(); }
    else if (it.t === 'oval') ctx.ellipse(cx, cy, Math.max(1, (x2 - x1) / 2), Math.max(1, (y2 - y1) / 2), 0, 0, Math.PI * 2);
    else if (it.t === 'circle') ctx.arc(cx, cy, Math.max(4, Math.min(x2 - x1, y2 - y1) / 2), 0, Math.PI * 2);
    ctx.stroke();
    return [cx, cy];
  }
  function label(it, cx, cy) {
    if (!it.s) return;
    let s = it.s, key = 0;
    if (s[0] === '_') { key = 1; s = s.slice(1); } else if (s[0] === '~') { key = 2; s = s.slice(1); }
    ctx.font = `${it.t === 'oval' || it.t === 'text' ? 400 : 600} 28px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(s, cx, cy);
    if (key) {
      const w = ctx.measureText(s).width / 2;
      ctx.setLineDash(key === 2 ? [7, 5] : []); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx - w, cy + 16); ctx.lineTo(cx + w, cy + 16); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  function draw() {
    const ink = css('--ink') || '#000';
    ctx.clearRect(0, 0, PAD_W, PAD_H);
    ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const it of [...pad.items, ...(pad.cur ? [pad.cur] : [])]) {
      ctx.lineWidth = 3.5;
      if (it.t === 'pen') {
        ctx.beginPath(); it.p.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); if (it.p.length === 1) ctx.lineTo(it.p[0][0] + .1, it.p[0][1]); ctx.stroke();
      } else if (it.t === 'line') {
        const L = Math.hypot(it.x2 - it.x1, it.y2 - it.y1) || 1, nx = -(it.y2 - it.y1) / L * 4, ny = (it.x2 - it.x1) / L * 4;
        for (const k of it.dbl ? [1, -1] : [0]) { ctx.beginPath(); ctx.moveTo(it.x1 + nx * k, it.y1 + ny * k); ctx.lineTo(it.x2 + nx * k, it.y2 + ny * k); ctx.stroke(); }
      } else if (it.t === 'text') {
        label(it, it.x1, it.y1);
      } else {
        const [cx, cy] = shapePath(it, 0);
        if (it.dbl) { ctx.lineWidth = 2; shapePath(it, it.t === 'dia' ? 12 : 7); }
        label(it, cx, cy);
      }
    }
  }
  const pos = e => { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) * PAD_W / r.width), Math.round((e.clientY - r.top) * PAD_H / r.height)]; };
  function hit(x, y) {
    for (let i = pad.items.length - 1; i >= 0; i--) {
      const it = pad.items[i];
      if (it.t === 'pen' ? it.p.some(([a, b], k) => (k ? segDist(x, y, { x1: it.p[k - 1][0], y1: it.p[k - 1][1], x2: a, y2: b }) : Math.hypot(a - x, b - y)) < 16) :
          it.t === 'text' ? Math.abs(it.x1 - x) < 80 && Math.abs(it.y1 - y) < 20 :
          it.t === 'line' ? segDist(x, y, it) < 14 :
          x > Math.min(it.x1, it.x2) - 10 && x < Math.max(it.x1, it.x2) + 10 && y > Math.min(it.y1, it.y2) - 10 && y < Math.max(it.y1, it.y2) + 10) return i;
    }
    return -1;
  }
  function segDist(x, y, it) {
    const dx = it.x2 - it.x1, dy = it.y2 - it.y1, L = dx * dx + dy * dy || 1, t = Math.max(0, Math.min(1, ((x - it.x1) * dx + (y - it.y1) * dy) / L));
    return Math.hypot(x - it.x1 - t * dx, y - it.y1 - t * dy);
  }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    const [x, y] = pos(e);
    if (pad.tool === 'erase') { const i = hit(x, y); if (i >= 0) { pad.items.splice(i, 1); saveItems(); draw(); } pad.cur = { t: 'erase' }; return; }
    pad.cur = pad.tool === 'pen' ? { t: 'pen', p: [[x, y]] } : { t: pad.tool, x1: x, y1: y, x2: x, y2: y, dbl: pad.dbl };
    draw();
  });
  cv.addEventListener('pointermove', e => {
    if (!pad.cur) return;
    const [x, y] = pos(e);
    if (pad.cur.t === 'erase') { const i = hit(x, y); if (i >= 0) { pad.items.splice(i, 1); saveItems(); draw(); } return; }
    if (pad.cur.t === 'pen') pad.cur.p.push([x, y]); else { pad.cur.x2 = x; pad.cur.y2 = y; }
    draw();
  });
  const finish = () => {
    const it = pad.cur; pad.cur = null;
    if (!it || it.t === 'erase') return;
    if (['rect', 'dia', 'oval', 'circle'].includes(it.t)) {
      // a tap (no drag) places a default-size shape
      if (Math.abs(it.x2 - it.x1) < 12 && Math.abs(it.y2 - it.y1) < 12) {
        const [w, h] = { rect: [170, 56], dia: [200, 86], oval: [150, 48], circle: [44, 44] }[it.t];
        it.x1 -= w / 2; it.y1 -= h / 2; it.x2 = it.x1 + w; it.y2 = it.y1 + h;
      }
      const s = prompt(it.t === 'circle' ? 'Letter (d, o or U)' : 'Label (start with _ for a key, ~ for a partial key)', it.t === 'circle' ? 'd' : '');
      if (s === null) { draw(); return; }
      it.s = s.trim();
    } else if (it.t === 'text') {
      const s = prompt('Text, e.g. (1,N)', '(1,N)');
      if (!s) { draw(); return; }
      it.s = s.trim();
    } else if (it.t === 'line' && Math.hypot(it.x2 - it.x1, it.y2 - it.y1) < 6) { draw(); return; }
    else if (it.t === 'pen') it.p = it.p.filter((q, i) => i === 0 || Math.hypot(q[0] - it.p[i - 1][0], q[1] - it.p[i - 1][1]) >= 2);
    pad.items.push(it); saveItems(); draw();
  };
  cv.addEventListener('pointerup', finish);
  cv.addEventListener('pointercancel', () => { pad.cur = null; draw(); });
  root.querySelector('.padbar').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    b.blur();
    if (b.dataset.tool) pad.tool = b.dataset.tool;
    else if (b.dataset.pad === 'dbl') pad.dbl = !pad.dbl;
    else if (b.dataset.pad === 'undo') { pad.items.pop(); saveItems(); }
    else if (b.dataset.pad === 'clear') { if (pad.items.length && confirm('Clear your drawing?')) { pad.items = []; saveItems(); } }
    else if (b.dataset.pad === 'full') { root.classList.toggle('full'); b.textContent = root.classList.contains('full') ? 'Close' : 'Expand'; }
    syncBar(); draw();
  });
  pad.redraw = draw;
  syncBar(); draw();
}

// ---------- routing & events ----------
function route() {
  const m = location.hash.match(/^#ex\/([\w.]+)$/);
  if (m && EX[m[1]]) { view = 'ex'; exId = m[1]; }
  else if (location.hash === '#quiz' && quiz) view = 'quiz';
  else view = 'home';
  render(); window.scrollTo(0, 0);
}
let view = 'home', exId = null;
function render() {
  app.innerHTML = view === 'ex' ? exView(exId) : view === 'quiz' ? quizView() : homeView();
  if (view === 'ex') initPad(exId);
  if (view === 'quiz') document.getElementById('qtext')?.focus({ preventScroll: true });
}
function applyTheme() { if (state.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = state.theme; }
function pick(v) {
  const id = quiz.ids[quiz.i], q = QBY.get(id);
  if (quiz.done[id]) return;
  if (q.type === 'ms') { const s = quiz.sel[id] || (quiz.sel[id] = []); const k = s.indexOf(v); k < 0 ? s.push(v) : s.splice(k, 1); render(); return; }
  quiz.ans[id] = v; quiz.done[id] = true; record(id, isRight(q, v)); render();
}
function checkMs() {
  const id = quiz.ids[quiz.i], q = QBY.get(id);
  if (q.type !== 'ms' || quiz.done[id] || !(quiz.sel[id] || []).length) return;
  quiz.ans[id] = [...quiz.sel[id]].sort((x, y) => x - y); quiz.done[id] = true; record(id, isRight(q, quiz.ans[id])); render();
}
function next() { if (quiz.i + 1 < quiz.ids.length) quiz.i++; else quiz.finished = true; render(); window.scrollTo(0, 0); }

app.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'theme') { state.theme = { auto: 'light', light: 'dark', dark: 'auto' }[state.theme]; persist(); applyTheme(); render(); }
  else if (act === 'open') location.hash = '#ex/' + t.dataset.id;
  else if (act === 'quiz') {
    const tag = t.dataset.tag;
    if (tag === 'all') startQuiz('All topics', BANK.map(q => q.id));
    else if (tag === 'missed') startQuiz('Missed questions', missed());
    else if (tag.startsWith('ex:')) startQuiz('Exercise ' + tag.slice(3), qFor(q => q.ex === tag.slice(3)));
    else startQuiz(TAGS[tag], qFor(q => q.tag === tag));
    if (location.hash === '#quiz') route();
  }
  else if (act === 'pick') { const q = QBY.get(quiz.ids[quiz.i]); pick(q.type === 'tf' ? t.dataset.v === 'true' : +t.dataset.v); }
  else if (act === 'check-ms') checkMs();
  else if (act === 'next') next();
  else if (act === 'retry') { const w = quiz.ids.filter(id => !isRight(QBY.get(id), quiz.ans[id])); startQuiz(quiz.title + ' (retry)', w); route(); }
  else if (act === 'zoom') { const d = t.closest('.ans').querySelector('.dia'); d.classList.toggle('zoom'); t.textContent = d.classList.contains('zoom') ? 'Fit' : 'Zoom'; }
  else if (act === 'openall') { document.querySelectorAll('details.sec').forEach(d => d.open = true); }
  else if (act === 'reset') { if (confirm('Clear all ticked checks, notes and quiz results?')) { state.ex = {}; state.q = {}; persist(); render(); } }
});
app.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.act === 'check') { const s = exState(exId); s.checks[+t.dataset.k] = t.checked; persist(); const sc = window.scrollY; render(); window.scrollTo(0, sc); }
});
app.addEventListener('input', ev => { if (ev.target.dataset.act === 'notes') { exState(exId).notes = ev.target.value; persist(); } });
app.addEventListener('toggle', ev => {
  const d = ev.target;
  if (!(d instanceof HTMLDetailsElement) || !d.dataset.sec || view !== 'ex') return;
  const s = exState(exId), k = d.dataset.sec === 'hints' ? 'hints' : +d.dataset.sec, i = s.open.indexOf(k);
  if (d.open && i < 0) s.open.push(k); else if (!d.open && i >= 0) s.open.splice(i, 1);
  persist();
}, true);
document.addEventListener('keydown', ev => {
  if (view !== 'quiz' || !quiz || quiz.finished || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.target.closest('textarea, input')) return;
  const id = quiz.ids[quiz.i], q = QBY.get(id), k = ev.key.toLowerCase();
  if (k === 'enter') { ev.preventDefault(); if (quiz.done[id]) next(); else checkMs(); return; }
  if (quiz.done[id]) return;
  if (q.type === 'tf') { if (k === 't') pick(true); else if (k === 'f') pick(false); return; }
  const idx = '12345'.indexOf(k) >= 0 ? '12345'.indexOf(k) : 'abcde'.indexOf(k);
  if (idx >= 0 && idx < quiz.perm[id].length) pick(quiz.perm[id][idx]);
});
window.addEventListener('hashchange', route);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => pad?.redraw?.()); } catch {}

// test hook
window.dbp = {
  get view() { return view; }, get quiz() { return quiz; }, state, EXERCISES, BANK, DIAGRAMS,
  open(id) { location.hash = '#ex/' + id; route(); },
  startQuiz(tag) { const b = document.createElement('button'); b.dataset.act = 'quiz'; b.dataset.tag = tag; app.appendChild(b); b.click(); b.remove(); },
  pick, checkMs, next, home() { location.hash = ''; route(); },
};
applyTheme();
route();
</script>
</body>
</html>
