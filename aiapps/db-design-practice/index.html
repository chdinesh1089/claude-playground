<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Database design practice for the assigned Elmasri &amp; Navathe 6e exercises (7.16, 7.17, 7.19, 7.22, 7.23, 8.17, 8.18, 3.13–3.15): worked ER/EER diagrams with (min, max), relational mappings, self-check rubrics and a quiz.">
<title>DB Design Practice</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --raised: #ffffff; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --border: rgba(11,11,11,.12); --accent: #2a78d6; --accent-ink: #ffffff; --accent-soft: rgba(42,120,214,.10);
  --good: #1f8a4c; --good-soft: rgba(31,138,76,.12); --bad: #c8382e; --bad-soft: rgba(200,56,46,.10);
  --warn: #b7791f; --track: rgba(11,11,11,.08);
  --er-stroke: #3d3c39; --er-e: #e4eefb; --er-r: #fbeedd; --er-a: #ffffff; --er-s: #ffffff; --er-mm: #b23a2f; --er-line: #6d6c67;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --raised: #222220; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --border: rgba(255,255,255,.12); --accent: #3987e5; --accent-ink: #ffffff; --accent-soft: rgba(57,135,229,.16);
    --good: #3fb871; --good-soft: rgba(63,184,113,.15); --bad: #ef6a5f; --bad-soft: rgba(239,106,95,.14);
    --warn: #e0a440; --track: rgba(255,255,255,.10);
    --er-stroke: #c9c8be; --er-e: #1d2c40; --er-r: #3a2d1b; --er-a: #1f1f1d; --er-s: #1f1f1d; --er-mm: #ff8a7d; --er-line: #8f8e86;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --raised: #222220; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --border: rgba(255,255,255,.12); --accent: #3987e5; --accent-ink: #ffffff; --accent-soft: rgba(57,135,229,.16);
  --good: #3fb871; --good-soft: rgba(63,184,113,.15); --bad: #ef6a5f; --bad-soft: rgba(239,106,95,.14);
  --warn: #e0a440; --track: rgba(255,255,255,.10);
  --er-stroke: #c9c8be; --er-e: #1d2c40; --er-r: #3a2d1b; --er-a: #1f1f1d; --er-s: #1f1f1d; --er-mm: #ff8a7d; --er-line: #8f8e86;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 820px; margin: 0 auto; padding: 20px 16px 64px; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; }
code { background: var(--track); padding: .05em .35em; border-radius: 5px; overflow-wrap: anywhere; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; min-height: 36px; }
.top .grow { flex: 1; min-width: 0; }
.back { font-size: 14px; font-weight: 600; text-decoration: none; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
.back:hover { text-decoration: underline; }
.icon { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; display: grid; place-items: center; flex: none; }
.icon svg { width: 18px; height: 18px; }
h1 { font-size: 24px; line-height: 1.25; margin: 0 0 4px; }
h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 28px 0 10px; }
h3 { font-size: 17px; margin: 0; }
.sub { color: var(--ink-2); margin: 0; }
.small { font-size: 13px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.ex { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.ex:hover { border-color: var(--accent); }
.ex .n { font-weight: 700; font-variant-numeric: tabular-nums; }
.ex .t { font-weight: 600; }
.ex .m { font-size: 12px; color: var(--muted); }
.ex.done { border-color: var(--good); }
.bar { height: 6px; border-radius: 3px; background: var(--track); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); }
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.mode { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.mode:hover:not(:disabled) { border-color: var(--accent); }
.mode:disabled { opacity: .5; cursor: default; }
.mode b { display: block; }
.mode span { font-size: 13px; color: var(--ink-2); }
.mode.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mode.primary span { color: inherit; opacity: .9; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: none; border-color: transparent; color: var(--ink-2); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--track); color: var(--ink-2); }
.chip.kind { background: var(--accent-soft); color: var(--accent); }
/* exercise page */
.prompt { font-size: 15.5px; }
.prompt p { margin: 0 0 8px; }
.prompt ul, .prompt ol, .ans ul, .ans ol { margin: 6px 0 10px; padding-left: 22px; }
.prompt li, .ans li { margin: 3px 0; }
.howto { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--accent-soft); border-radius: 0 10px 10px 0; font-size: 14.5px; margin: 14px 0 0; }
textarea { width: 100%; min-height: 110px; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: var(--raised); border: 1px solid var(--border); border-radius: 10px; padding: 10px; resize: vertical; }
details.sec { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); margin-bottom: 10px; }
details.sec > summary { cursor: pointer; padding: 12px 14px; font-weight: 700; list-style: none; display: flex; align-items: center; gap: 10px; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::before { content: '▸'; color: var(--muted); transition: transform .15s; }
details.sec[open] > summary::before { transform: rotate(90deg); }
details.sec > summary .grow { flex: 1; }
details.sec > summary .small { font-weight: 400; }
.ans { padding: 0 14px 14px; font-size: 15px; }
.ans p { margin: 8px 0; }
.ans h4 { margin: 14px 0 4px; font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl th { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
.tbl td.mm { font-family: ui-monospace, Menlo, monospace; font-weight: 700; color: var(--er-mm); white-space: nowrap; }
.scroll { overflow-x: auto; }
.dia { position: relative; overflow: auto; background: var(--raised); border: 1px solid var(--border); border-radius: 12px; margin: 8px 0; -webkit-overflow-scrolling: touch; }
.dia svg { display: block; width: 100%; height: auto; }
.dia.zoom svg { width: auto; }
.dia-bar { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
svg.er text { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
svg.er .lbl { font-weight: 600; }
svg.er .ln { stroke: var(--er-line); stroke-width: 1.3; fill: none; }
svg.er .shape { stroke: var(--er-stroke); stroke-width: 1.4; }
svg.er .E { fill: var(--er-e); }
svg.er .R { fill: var(--er-r); }
svg.er .A { fill: var(--er-a); }
svg.er .S { fill: var(--er-s); }
svg.er .noFill { fill: none; }
svg.er .dash { stroke-dasharray: 4 3; }
svg.er .ul { stroke: var(--ink); stroke-width: 1; }
svg.er .mm { font: 700 12px ui-monospace, Menlo, monospace; fill: var(--er-mm); }
svg.er .role { font-style: italic; font-size: 11px; fill: var(--ink-2); }
svg.er .note { text-anchor: start; font-size: 12px; fill: var(--ink-2); }
svg.er .defattr { font-style: italic; fill: var(--ink-2); }
.legend { font-size: 12.5px; color: var(--muted); margin: 4px 0 0; }
.rels { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin: 8px 0; }
.rel { min-width: 0; }
details.sec, .card { min-width: 0; max-width: 100%; }
.rel .rn { font-weight: 700; font-size: 14px; letter-spacing: .02em; }
.rel .rn .step { font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 8px; }
.rel table { border-collapse: collapse; margin: 3px 0; }
.rel td { border: 1px solid var(--er-stroke); padding: 4px 9px; font-size: 13.5px; white-space: nowrap; background: var(--raised); }
.rel td.pk { text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.rel td.fk { font-style: italic; color: var(--accent); }
.rel .fks { font-size: 13px; color: var(--ink-2); }
.rel .fks code { font-size: 12px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; font-size: 15px; }
.check input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--good); flex: none; }
.check:has(input:checked) span { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--muted); }
.pill-good { color: var(--good); font-weight: 700; }
/* sketch pad */
.pad { margin: 8px 0 12px; }
.padbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
.padbar button { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
.padbar button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.padbar .sep { width: 1px; height: 22px; background: var(--border); margin: 0 2px; }
.pad canvas { display: block; width: 100%; height: auto; background: var(--raised); border: 1px solid var(--border); border-radius: 12px; touch-action: none; cursor: crosshair; }
.pad.full { position: fixed; inset: 0; z-index: 50; margin: 0; padding: 10px; background: var(--page); overflow: auto; }
.pad.full canvas { max-height: calc(100vh - 110px); width: auto; max-width: 100%; margin: 0 auto; }
.padhelp { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
/* quiz */
.progress { height: 4px; background: var(--track); border-radius: 2px; margin: 10px 0 16px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.q { font-size: 18.5px; line-height: 1.5; margin: 14px 0 6px; outline: none; }
.hint { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.opts { display: grid; gap: 10px; margin-top: 8px; }
.opts.tf { grid-template-columns: 1fr 1fr; }
.opt { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; background: var(--raised); border: 1.5px solid var(--border); border-radius: 12px; padding: 12px 14px; cursor: pointer; min-height: 48px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--track); color: var(--ink-2); margin-top: 1px; }
.opt .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .mark { flex: none; font-weight: 700; font-size: 13px; margin-top: 3px; }
.opts.tf .opt { justify-content: center; align-items: center; font-weight: 600; font-size: 17px; }
.opts.tf .opt .tx { flex: none; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .k { background: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .k { background: var(--good); color: #fff; }
.opt.right .mark { color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: #fff; }
.opt.wrong .mark { color: var(--bad); }
.opt.missed { border-color: var(--good); border-style: dashed; }
.opt.missed .mark { color: var(--good); }
.feedback { margin-top: 16px; border-radius: 12px; padding: 14px 16px; border: 1px solid var(--border); background: var(--surface); }
.feedback.ok { border-color: var(--good); }
.feedback.no { border-color: var(--bad); }
.feedback .verdict { font-weight: 700; margin-bottom: 4px; }
.feedback.ok .verdict { color: var(--good); }
.feedback.no .verdict { color: var(--bad); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }
.actions .grow { flex: 1; }
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.score b { font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
details.rev { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); margin-bottom: 8px; }
details.rev summary { cursor: pointer; padding: 10px 14px; display: flex; gap: 10px; align-items: baseline; list-style: none; }
details.rev summary::-webkit-details-marker { display: none; }
details.rev summary .m { flex: none; font-weight: 700; width: 18px; }
details.rev summary .m.ok { color: var(--good); }
details.rev summary .m.no { color: var(--bad); }
details.rev .body { padding: 0 14px 14px 42px; font-size: 15px; }
details.rev .body p { margin: 6px 0; }
kbd { font: 600 11px ui-monospace, Menlo, monospace; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--surface); color: var(--ink-2); }
footer { margin-top: 36px; font-size: 13px; color: var(--muted); }
footer p { margin: 6px 0; }
@media (max-width: 560px) {
  h1 { font-size: 21px; }
  .q { font-size: 17px; }
  details.rev .body { padding-left: 14px; }
  .ans { padding: 0 10px 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body>
<main id="app" aria-live="polite"></main>
<script>
'use strict';
// ---------- helpers ----------
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>');
const ul = items => '<ul>' + items.map(i => `<li>${i}</li>`).join('') + '</ul>';
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function load(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v && typeof v === 'object' ? v : d; } catch { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

// ---------- ER / EER diagram renderer ----------
// Chen notation as in Elmasri & Navathe: rectangles (double = weak), diamonds (double = identifying),
// ovals (underlined = key, dashed underline = partial key, double = multivalued, dashed = derived).
// (min, max) sits on the line next to the entity it describes: each entity takes part in min..max instances.
const measure = (() => {
  const c = document.createElement('canvas').getContext('2d');
  return (s, bold) => { c.font = `${bold ? 600 : 400} 12px system-ui, -apple-system, "Segoe UI", sans-serif`; return c.measureText(s).width; };
})();
function parseAttr(s) {
  const a = { key: false, pkey: false, multi: false, derived: false };
  for (;;) {
    if (s[0] === '_') { a.key = true; s = s.slice(1); }
    else if (s[0] === '~') { a.pkey = true; s = s.slice(1); }
    else if (s[0] === '/') { a.derived = true; s = s.slice(1); }
    else if (s[0] === '{') { a.multi = true; s = s.slice(1, -1); }
    else break;
  }
  a.label = s;
  return a;
}
function dims(o) {
  const w = measure(o.label, o.t !== 'A');
  if (o.t === 'E') return [Math.max(w / 2 + 14, 44), 17];
  if (o.t === 'R') return [w / 2 * 1.42 + 12, 27];
  if (o.t === 'S') return [12, 12];
  return [w / 2 + 12 + (o.multi ? 3 : 0), 13 + (o.multi ? 2 : 0)];
}
function ER(w, h) {
  const d = { w, h, nodes: [], by: {}, links: [], notes: [] };
  let k = 0;
  const add = o => { [o.hw, o.hh] = dims(o); d.nodes.push(o); d.by[o.id] = o; return o.id; };
  d.E = (id, x, y, o = {}) => (add({ t: 'E', id, x, y, label: o.label || id, weak: !!o.weak }), d);
  d.R = (id, x, y, o = {}) => (add({ t: 'R', id, x, y, label: o.label || id, ident: !!o.ident }), d);
  d.A = (of, spec, x, y) => add({ ...parseAttr(spec), t: 'A', id: 'a' + k++, of, x, y });
  // Place a row (n/s) or column (e/w) of attributes next to `of`. A spec can be [name, [children], childDir].
  d.attrs = (of, dir, specs, o = {}) => {
    const p = d.by[of], gap = o.gap ?? 8;
    const items = specs.map(s => Array.isArray(s) ? { spec: s[0], kids: s[1], kdir: s[2] } : { spec: s });
    for (const it of items) it.hw = dims({ ...parseAttr(it.spec), t: 'A' })[0];
    if (dir === 'n' || dir === 's') {
      const total = items.reduce((t, it) => t + 2 * it.hw, 0) + gap * (items.length - 1);
      let x = p.x - total / 2 + (o.dx || 0);
      const y = p.y + (dir === 'n' ? -1 : 1) * (p.hh + (o.d ?? 30) + 13);
      for (const it of items) { it.id = d.A(of, it.spec, x + it.hw, y); x += 2 * it.hw + gap; }
    } else {
      const step = o.step ?? 31;
      let y = p.y - (items.length - 1) * step / 2 + (o.dy || 0);
      for (const it of items) { it.id = d.A(of, it.spec, p.x + (dir === 'e' ? 1 : -1) * (p.hw + (o.d ?? 26) + it.hw), y); y += step; }
    }
    for (const it of items) if (it.kids) d.attrs(it.id, it.kdir || dir, it.kids, { d: o.kd ?? 18, gap: 6, step: 29 });
    return d;
  };
  // relationship–entity line with its (min, max); o: { role, side (+1/-1 which side of the line), off }
  d.L = (r, e, mm, o = {}) => (d.links.push({ r, e, mm, ...o }), d);
  // specialization circle: kind 'd' | 'o'; o.total → double line to the superclass; o.attr → defining attribute
  d.S = (id, x, y, kind, sup, subs, o = {}) => {
    add({ t: 'S', id, x, y, label: kind });
    d.links.push({ spec: true, sup, c: id, total: !!o.total, attr: o.attr });
    for (const s of subs) d.links.push({ sub: true, c: id, e: s });
    return d;
  };
  // category (union type): circle with U, plain lines to each superclass, subset line to the category
  d.U = (id, x, y, sups, cat, o = {}) => {
    add({ t: 'S', id, x, y, label: 'U' });
    for (const s of sups) d.links.push({ spec: true, sup: s, c: id });
    d.links.push({ sub: true, c: id, e: cat, total: !!o.total });
    return d;
  };
  // a subclass drawn straight from one superclass (no circle), e.g. the second parent of a shared subclass
  d.sub = (sup, sub) => (d.links.push({ sub: true, c: sup, e: sub }), d);
  d.note = (x, y, text) => (d.notes.push({ x, y, text }), d);
  return d;
}
function edgeDist(o, ux, uy) {
  if (o.t === 'E') return Math.min(o.hw / Math.max(Math.abs(ux), 1e-6), o.hh / Math.max(Math.abs(uy), 1e-6));
  if (o.t === 'R') return 1 / (Math.abs(ux) / o.hw + Math.abs(uy) / o.hh);
  if (o.t === 'S') return 12;
  return 1 / Math.hypot(ux / o.hw, uy / o.hh);
}
function erSVG(d, label) {
  const f = n => Math.round(n * 10) / 10;
  let lines = '', shapes = '', texts = '';
  const seg = (a, b, dbl) => {
    if (!dbl) return `<line class="ln" x1="${f(a.x)}" y1="${f(a.y)}" x2="${f(b.x)}" y2="${f(b.y)}"/>`;
    const L = Math.hypot(b.x - a.x, b.y - a.y) || 1, nx = -(b.y - a.y) / L * 2.2, ny = (b.x - a.x) / L * 2.2;
    return `<line class="ln" x1="${f(a.x + nx)}" y1="${f(a.y + ny)}" x2="${f(b.x + nx)}" y2="${f(b.y + ny)}"/><line class="ln" x1="${f(a.x - nx)}" y1="${f(a.y - ny)}" x2="${f(b.x - nx)}" y2="${f(b.y - ny)}"/>`;
  };
  for (const n of d.nodes) if (n.t === 'A') lines += seg(n, d.by[n.of]);
  for (const L of d.links) {
    if (L.spec) {
      const s = d.by[L.sup], c = d.by[L.c];
      lines += seg(s, c, L.total);
      if (L.attr) texts += `<text class="defattr" x="${f((s.x + c.x) / 2 + 10)}" y="${f((s.y + c.y) / 2)}" style="text-anchor:start">${esc(L.attr)}</text>`;
    } else if (L.sub) {
      const c = d.by[L.c], e = d.by[L.e];
      lines += seg(c, e, L.total);
      const len = Math.hypot(e.x - c.x, e.y - c.y), ux = (e.x - c.x) / len, uy = (e.y - c.y) / len, px = -uy, py = ux;
      const mx = c.x + ux * len * 0.45, my = c.y + uy * len * 0.45;
      // subset symbol: a cup opening toward the superclass
      lines += `<path class="ln" style="stroke-width:1.6" d="M${f(mx + px * 7 - ux * 5)},${f(my + py * 7 - uy * 5)} Q${f(mx + ux * 9)},${f(my + uy * 9)} ${f(mx - px * 7 - ux * 5)},${f(my - py * 7 - uy * 5)}"/>`;
    } else {
      const r = d.by[L.r], e0 = d.by[L.e], e = { ...e0, x: e0.x + (L.ax || 0), y: e0.y + (L.ay || 0) };
      lines += seg(r, e, L.dbl);
      const dx = r.x - e.x, dy = r.y - e.y, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
      const t = edgeDist(e, ux, uy) + (L.off ?? 16), side = L.side ?? 1;
      const tx = L.lx ?? e.x + ux * t - uy * 13 * side, ty = L.ly ?? e.y + uy * t + ux * 13 * side;
      texts += `<text class="mm" x="${f(tx)}" y="${f(ty)}">${esc(L.mm)}</text>`;
      if (L.role) {
        const t2 = edgeDist(e, ux, uy) + (L.roff ?? 16);
        texts += `<text class="role" x="${f(e.x + ux * t2 + uy * 14 * side)}" y="${f(e.y + uy * t2 - ux * 14 * side)}">${esc(L.role)}</text>`;
      }
    }
  }
  for (const n of d.nodes) {
    const x = f(n.x), y = f(n.y);
    if (n.t === 'E') {
      shapes += `<rect class="shape E" x="${f(n.x - n.hw)}" y="${f(n.y - n.hh)}" width="${f(2 * n.hw)}" height="${f(2 * n.hh)}"/>`;
      if (n.weak) shapes += `<rect class="shape noFill" x="${f(n.x - n.hw + 4)}" y="${f(n.y - n.hh + 4)}" width="${f(2 * n.hw - 8)}" height="${f(2 * n.hh - 8)}"/>`;
      texts += `<text class="lbl" x="${x}" y="${y}">${esc(n.label)}</text>`;
    } else if (n.t === 'R') {
      const dm = (a, b) => `${f(n.x - a)},${y} ${x},${f(n.y - b)} ${f(n.x + a)},${y} ${x},${f(n.y + b)}`;
      shapes += `<polygon class="shape R" points="${dm(n.hw, n.hh)}"/>`;
      if (n.ident) shapes += `<polygon class="shape noFill" points="${dm(n.hw - 8, n.hh - 5)}"/>`;
      texts += `<text class="lbl" x="${x}" y="${y}">${esc(n.label)}</text>`;
    } else if (n.t === 'S') {
      shapes += `<circle class="shape S" cx="${x}" cy="${y}" r="12"/>`;
      texts += `<text class="lbl" x="${x}" y="${f(n.y - 1)}">${esc(n.label)}</text>`;
    } else {
      shapes += `<ellipse class="shape A${n.derived ? ' dash' : ''}" cx="${x}" cy="${y}" rx="${f(n.hw)}" ry="${f(n.hh)}"/>`;
      if (n.multi) shapes += `<ellipse class="shape noFill" cx="${x}" cy="${y}" rx="${f(n.hw - 3.5)}" ry="${f(n.hh - 3.5)}"/>`;
      texts += `<text x="${x}" y="${y}">${esc(n.label)}</text>`;
      if (n.key || n.pkey) {
        const tw = measure(n.label) / 2;
        texts += `<line class="ul${n.pkey ? ' dash' : ''}" x1="${f(n.x - tw)}" y1="${f(n.y + 7.5)}" x2="${f(n.x + tw)}" y2="${f(n.y + 7.5)}"/>`;
      }
    }
  }
  for (const nt of d.notes) texts += `<text class="note" x="${nt.x}" y="${nt.y}">${nt.text.split('\n').map((l, i) => `<tspan x="${nt.x}" dy="${i ? 16 : 0}">${esc(l)}</tspan>`).join('')}</text>`;
  return `<svg class="er" viewBox="0 0 ${d.w} ${d.h}" width="${d.w}" height="${d.h}" role="img" aria-label="${esc(label)}">${lines}${shapes}${texts}</svg>`;
}
const LEGEND = 'Rectangle = entity (double = weak) · diamond = relationship (double = identifying) · oval = attribute (underlined = key, dashed underline = partial key, double = multivalued, dashed = derived). <b style="color:var(--er-mm)">(min, max)</b> is written next to the entity it describes: each entity of that type takes part in at least min and at most max instances of the relationship.';

// ---------- relational schema renderer ----------
// { n: 'NAME', a: '*Pk1 *Pk2 Attr …', fk: ['A, B → OTHER(X, Y)'], u: 'text', step: 'Step 1', note }
function relHTML(rels) {
  return '<div class="rels">' + rels.map(r => {
    const fkAttrs = new Set((r.fk || []).flatMap(s => s.split('→')[0].split(',').map(x => x.trim())));
    const cells = r.a.split(/\s+/).map(a => {
      const pk = a[0] === '*', name = pk ? a.slice(1) : a;
      return `<td class="${pk ? 'pk' : ''}${fkAttrs.has(name) ? ' fk' : ''}">${esc(name)}</td>`;
    }).join('');
    const extra = [...(r.fk || []).map(s => `FK <code>${esc(s)}</code>`), ...(r.u ? [esc(r.u)] : []), ...(r.note ? [r.note] : [])];
    return `<div class="rel"><div class="rn">${esc(r.n)}${r.step ? `<span class="step">${esc(r.step)}</span>` : ''}</div>
      <div class="scroll"><table><tr>${cells}</tr></table></div>${extra.length ? `<div class="fks">${extra.join(' · ')}</div>` : ''}</div>`;
  }).join('') + '</div><p class="legend">Underlined = primary key. <span style="color:var(--accent);font-style:italic">Blue italic</span> = foreign key.</p>';
}
function mmTable(rows) {
  return `<div class="scroll"><table class="tbl"><tr><th>Relationship</th><th>Entity</th><th>(min, max)</th><th>Why</th></tr>${rows.map(r =>
    `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="mm">${esc(r[2])}</td><td>${r[3]}</td></tr>`).join('')}</table></div>`;
}

  hints: [
    'There are four weak entity types: FLIGHT_LEG, LEG_INSTANCE, FARE and SEAT. Find each one\'s owner and partial key.',
    'LEG_INSTANCE is weak with respect to FLIGHT_LEG, which is itself weak with respect to FLIGHT, so its full key has three parts.',
    'CAN_LAND is the only M:N relationship.',
    'Converting 1:N to (min, max): the "1" side entity gets (?,N); the "N" side entity gets (?,1). A double line means min ≥ 1.',
  ],
  sections: [
    { h: 'Requirements read from the diagram (book question)', html: ul([
      'Each <b>airport</b> has a unique code, a name, a city and a state.',
      'Each <b>flight</b> has a unique number, an airline, and the weekdays on which it operates.',
      'A flight is made of one or more numbered <b>legs</b> (nonstop segments). The leg number is unique only within its flight.',
      'Each leg departs from exactly one airport at a scheduled departure time, and arrives at exactly one airport at a scheduled arrival time. An airport can serve many legs.',
      'Each time a leg is flown on a date, that is a <b>leg instance</b>, identified by the date within the leg. It records the number of available seats, the airplane assigned (exactly one), and the actual departure and arrival airports and times.',
      'Each flight has a set of <b>fares</b>. A fare code is unique within its flight; each fare has an amount and restrictions.',
      'Each <b>airplane type</b> has a unique name, a maximum number of seats and a manufacturer. A type can land at many airports and an airport can handle many types.',
      'Each <b>airplane</b> has a unique id, a total number of seats and exactly one type.',
      'For each leg instance, <b>seats</b> are reserved by seat number (unique within that leg instance); a reservation stores the customer\'s name and phone.',
    ]) + `<p><b>Constraints the diagram cannot show</b> (good to mention): the assigned airplane's type must be able to land at both airports; reservations can't exceed the airplane's seats; No_of_avail_seats = seats − reservations (derived); leg <i>i</i> arrives where leg <i>i</i>+1 departs.</p>` },
    { h: 'ER diagram with (min, max)', diagram: 'airline', html: mmTable([
      ['DEPARTURE_AIRPORT', 'FLIGHT_LEG', '(1,1)', 'Total participation: each leg departs from exactly one airport.'],
      ['DEPARTURE_AIRPORT', 'AIRPORT', '(0,N)', 'An airport may have many departing legs, or none.'],
      ['ARRIVAL_AIRPORT', 'FLIGHT_LEG / AIRPORT', '(1,1) / (0,N)', 'Same reasoning for arrivals.'],
      ['LEGS', 'FLIGHT_LEG / FLIGHT', '(1,1) / (1,N)', 'Identifying. A flight has at least one leg. (The book draws FLIGHT\'s line single; (0,N) is the literal reading. Say which you use.)'],
      ['INSTANCE_OF', 'LEG_INSTANCE / FLIGHT_LEG', '(1,1) / (0,N)', 'Identifying. A leg may not have been flown yet.'],
      ['FARES', 'FARE / FLIGHT', '(1,1) / (0,N)', 'Identifying.'],
      ['CAN_LAND', 'AIRPLANE_TYPE / AIRPORT', '(0,N) / (0,N)', 'M:N, both partial.'],
      ['TYPE', 'AIRPLANE / AIRPLANE_TYPE', '(1,1) / (0,N)', 'Every airplane has exactly one type.'],
      ['ASSIGNED', 'LEG_INSTANCE / AIRPLANE', '(1,1) / (0,N)', 'Every leg instance has exactly one airplane.'],
      ['DEPARTS, ARRIVES', 'LEG_INSTANCE / AIRPORT', '(1,1) / (0,N)', 'Actual airports (can differ from the scheduled ones, e.g. a diversion).'],
      ['RESERVATION', 'SEAT / LEG_INSTANCE', '(1,1) / (0,N)', 'Identifying. A seat entity exists only as a reservation on one leg instance.'],
    ]) },
    { h: 'Relational mapping', rels: [
      { n: 'AIRPORT', step: 'Step 1', a: '*Airport_code Name City State' },
      { n: 'FLIGHT', step: 'Step 1', a: '*Flight_number Airline Weekdays', note: 'Weekdays is one value such as "MTWRF". If you draw it as multivalued, Step 6 gives FLIGHT_WEEKDAY(<u>Flight_number, Weekday</u>).' },
      { n: 'FLIGHT_LEG', step: 'Steps 2 + 4', a: '*Flight_number *Leg_number Departure_airport_code Scheduled_departure_time Arrival_airport_code Scheduled_arrival_time',
        fk: ['Flight_number → FLIGHT', 'Departure_airport_code → AIRPORT', 'Arrival_airport_code → AIRPORT'] },
      { n: 'LEG_INSTANCE', step: 'Steps 2 + 4', a: '*Flight_number *Leg_number *Date Number_of_available_seats Airplane_id Departure_airport_code Departure_time Arrival_airport_code Arrival_time',
        fk: ['Flight_number, Leg_number → FLIGHT_LEG', 'Airplane_id → AIRPLANE', 'Departure_airport_code → AIRPORT', 'Arrival_airport_code → AIRPORT'] },
      { n: 'FARE', step: 'Step 2', a: '*Flight_number *Fare_code Amount Restrictions', fk: ['Flight_number → FLIGHT'] },
      { n: 'AIRPLANE_TYPE', step: 'Step 1', a: '*Airplane_type_name Max_seats Company' },
      { n: 'CAN_LAND', step: 'Step 5 (M:N)', a: '*Airplane_type_name *Airport_code', fk: ['Airplane_type_name → AIRPLANE_TYPE', 'Airport_code → AIRPORT'] },
      { n: 'AIRPLANE', step: 'Steps 1 + 4', a: '*Airplane_id Total_number_of_seats Airplane_type', fk: ['Airplane_type → AIRPLANE_TYPE'] },
      { n: 'SEAT_RESERVATION', step: 'Step 2', a: '*Flight_number *Leg_number *Date *Seat_number Customer_name Customer_phone', fk: ['Flight_number, Leg_number, Date → LEG_INSTANCE'] },
    ], html: `<p>This is exactly the book's AIRLINE schema (Figure 3.8), which is a good self-check. Notes:</p>${ul([
      'Every 1:N relationship (DEPARTURE_AIRPORT, ARRIVAL_AIRPORT, TYPE, ASSIGNED, DEPARTS, ARRIVES) became a foreign key on the N side, and its attribute (e.g. Scheduled_departure_time) moved with it.',
      'Weak entities nest: LEG_INSTANCE\'s key is FLIGHT_LEG\'s key (Flight_number, Leg_number) plus Date, and SEAT_RESERVATION adds Seat_number to that.',

  check: [

},
{

  prompt: `<p>Design an ER schema for a <b>sports league</b>. A team has many players, not all of whom play in every game. Track which players took part in each game for each team, the positions they played in that game, and the game's result. Pick a sport and state your assumptions.</p>`,

{
  id: '7.23', ch: 7, kind: 'General', title: 'Bank diagram questions',
  prompt: `<p>Figure 7.21 is part of a <b>BANK</b> database: BANK —BRANCHES (identifying, 1:N)— BANK_BRANCH (weak) —ACCTS (1:N)— ACCOUNT, BANK_BRANCH —LOANS (1:N)— LOAN, ACCOUNT —A_C (M:N)— CUSTOMER, LOAN —L_C (M:N)— CUSTOMER. Double lines: BANK and BANK_BRANCH in BRANCHES; ACCOUNT in ACCTS and A_C; LOAN in LOANS and L_C.</p>
  <ol type="a">

{

  prompt: `<p>The relation <code>CLASS(Course#, Univ_Section#, Instructor_name, Semester, Building_code, Room#, Time_period, Weekdays, Credit_hours)</code> stores classes taught at a university; Univ_Section# values are unique. List the candidate keys you think hold, and for each one state the conditions under which it is valid.</p>`,

{
  id: '3.14', ch: 3, kind: 'Relational', title: 'Order processing: foreign keys',
  prompt: `<p>An order-processing database: <code>CUSTOMER(Cust#, Cname, City)</code>, <code>ORDER(Order#, Odate, Cust#, Ord_amt)</code>, <code>ORDER_ITEM(Order#, Item#, Qty)</code>, <code>ITEM(Item#, Unit_price)</code>, <code>SHIPMENT(Order#, Warehouse#, Ship_date)</code>, <code>WAREHOUSE(Warehouse#, City)</code>. Ord_amt is the order's total in dollars; Ship_date is when an order (or part of it) ships from a warehouse; an order can ship from several warehouses. Specify the foreign keys and your assumptions. What other constraints can you think of?</p>`,
  hints: ['First decide every primary key. Then each attribute that refers to another relation\'s primary key is a foreign key.', 'Two City attributes are not a foreign key: they don\'t reference a key.'],
  sections: [
    { h: 'Primary keys (assumed)', html: ul([
      'CUSTOMER(<u>Cust#</u>), ORDER(<u>Order#</u>), ITEM(<u>Item#</u>), WAREHOUSE(<u>Warehouse#</u>).',
      'ORDER_ITEM(<u>Order#, Item#</u>): an item appears once per order (with a quantity).',
      'SHIPMENT(<u>Order#, Warehouse#</u>): an order ships at most once from each warehouse. If it can ship several times from the same warehouse, Ship_date must join the key.',
    ]) },
    { h: 'Foreign keys', html: `<table class="tbl"><tr><th>Foreign key</th><th>References</th></tr>
      <tr><td><code>ORDER.Cust#</code></td><td>CUSTOMER.Cust# (NOT NULL: every order has a customer)</td></tr>
      <tr><td><code>ORDER_ITEM.Order#</code></td><td>ORDER.Order#</td></tr>
      <tr><td><code>ORDER_ITEM.Item#</code></td><td>ITEM.Item#</td></tr>
      <tr><td><code>SHIPMENT.Order#</code></td><td>ORDER.Order#</td></tr>
      <tr><td><code>SHIPMENT.Warehouse#</code></td><td>WAREHOUSE.Warehouse#</td></tr></table>
      <p>CUSTOMER.City and WAREHOUSE.City are <b>not</b> foreign keys (neither references a key).</p>` },
    { h: 'Other constraints', html: ul([
      '<code>Ord_amt = Σ (Qty × Unit_price)</code> over the order\'s items: a semantic constraint (needs an assertion or trigger). Since prices change, the price at order time would really need storing in ORDER_ITEM.',
      '<code>Qty &gt; 0</code>, <code>Unit_price &gt; 0</code>, <code>Ord_amt ≥ 0</code> (domain constraints).',
      '<code>Ship_date ≥ Odate</code> for the order.',
      'Every order has at least one ORDER_ITEM (not expressible with keys or FKs).',
      'Shipped quantities can\'t exceed ordered quantities (the schema doesn\'t record which items are in each shipment, a weakness worth noting).',
      'ORDER is a reserved word in SQL; the table would need renaming or quoting.',
    ]) },
  ],
  check: ['Five foreign keys, no City "FK".', 'Composite PKs for ORDER_ITEM and SHIPMENT, with the assumption stated.', 'At least three other constraints, including the Ord_amt rule.'],
},

{ id: 'er01', tag: 'ER', ex: null, type: 'tf', q: 'In the book\'s (min, max) notation, the pair written on the line between EMPLOYEE and WORKS_FOR says how many WORKS_FOR instances each employee takes part in.', answer: true, explain: 'Yes. (min, max) is attached to the participating entity: each EMPLOYEE takes part in at least min and at most max WORKS_FOR instances. That is why EMPLOYEE gets (1,1) and DEPARTMENT gets (4,N) in Figure 7.15.' },

{ id: 'er03', tag: 'ER', ex: null, type: 'tf', q: 'When converting a 1:N cardinality ratio to (min, max), the "N" written next to the N-side entity becomes that entity\'s max.', answer: false, explain: 'It flips. In the ratio notation the N is next to EMPLOYEE (many employees per department), but in (min, max) EMPLOYEE gets max 1 (one department per employee) and DEPARTMENT gets max N.' },
{ id: 'er04', tag: 'ER', ex: null, type: 'mc', q: 'A min of 0 in (min, max) means…', options: ['partial participation', 'total participation', 'the entity is weak', 'the relationship is optional for the other entity'], answer: 0, explain: 'min = 0: an entity may take no part in the relationship (partial). min ≥ 1 means total participation (a double line in the other notation).' },
{ id: 'er05', tag: 'ER', ex: null, type: 'mc', q: 'Every department has exactly one manager, and an employee manages at most one department. What (min, max) does EMPLOYEE get in MANAGES?', options: ['(0,1)', '(1,1)', '(0,N)', '(1,N)'], answer: 0, explain: 'Most employees manage nothing (min 0) and none manages more than one department (max 1). DEPARTMENT gets (1,1).' },
{ id: 'er06', tag: 'ER', ex: null, type: 'tf', q: 'A weak entity type always has total participation in its identifying relationship.', answer: true, explain: 'A weak entity can\'t be identified without its owner, so every weak entity is related to an owner: (1,1) on the weak side.' },
{ id: 'er07', tag: 'ER', ex: null, type: 'tf', q: 'An identifying relationship can be M:N.', answer: false, explain: 'Each weak entity must be identified by exactly one owner, so the owner side has max 1. Identifying relationships are 1:N (or 1:1).' },
{ id: 'er08', tag: 'ER', ex: null, type: 'mc', q: 'What is a partial key?', options: ['An attribute that identifies a weak entity only among the entities with the same owner', 'A key with some NULL components', 'Any proper subset of a composite key', 'A key that identifies an entity in only some relationships'], answer: 0, explain: 'The partial key (dashed underline) is unique only within one owner. The full identifier is owner key + partial key.' },
