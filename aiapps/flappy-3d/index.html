<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="A glossy 3D flappy-bird-style game: tap to flap between the pipes while day turns to night.">
<title>Flap 3D</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7fb2e5; overscroll-behavior: none; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1d2433; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .back { position: fixed; top: 14px; left: 16px; z-index: 5; font-size: 13px; font-weight: 600; color: #fff; text-decoration: none; text-shadow: 0 1px 3px rgba(0,0,0,.55); }
  .back:hover { text-decoration: underline; }
  .icon-btn {
    position: fixed; top: 10px; right: 12px; z-index: 5; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255,255,255,.85); color: #1d2433; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  .icon-btn svg { width: 20px; height: 20px; }
  button:focus-visible, a:focus-visible { outline: 3px solid #ffb020; outline-offset: 2px; }
  #score {

    font: 900 clamp(52px, 11vw, 104px)/1 system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; font-variant-numeric: tabular-nums;
    -webkit-text-stroke: 4px #1d2433; paint-order: stroke fill; text-shadow: 0 5px 0 rgba(29,36,51,.35); transition: opacity .3s;
  }
  #score.pop { animation: pop .28s ease-out; }
  @keyframes pop { 0% { transform: translateX(-50%) scale(1.35); } 100% { transform: translateX(-50%) scale(1); } }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 4; }
  .card {

    width: min(360px, calc(100vw - 32px)); padding: 24px 22px; border-radius: 22px; background: rgba(255,255,255,.93);

  .card h2 { margin: 0 0 14px; font: 900 34px/1.1 system-ui, sans-serif; color: #e8453c; -webkit-text-stroke: 2px #1d2433; paint-order: stroke fill; }
  .card p { margin: 6px 0; font-size: 16px; color: #3a4459; }
  .keys { display: inline-block; padding: 1px 7px; border-radius: 6px; background: #eef1f6; border: 1px solid #d4d9e3; font-weight: 700; font-size: 14px; }
  .results { display: flex; align-items: center; gap: 18px; justify-content: center; margin: 4px 0 16px; }
  .medal { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 11px; color: rgba(0,0,0,.55); box-shadow: inset 0 -5px 0 rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.2); }
  .medal.none { background: #e7eaf0; box-shadow: inset 0 0 0 3px #d4d9e3; color: #8a93a6; }
  .medal.bronze { background: radial-gradient(circle at 35% 30%, #f3c294, #b8733a 60%, #8a5226); }
  .medal.silver { background: radial-gradient(circle at 35% 30%, #ffffff, #c3c8d1 60%, #8c939f); }
  .medal.gold { background: radial-gradient(circle at 35% 30%, #fff4b0, #f5c518 60%, #c08a00); }
  .medal.platinum { background: radial-gradient(circle at 35% 30%, #ffffff, #cfe7f1 55%, #8fb7c9); }
  .stats { text-align: left; font-size: 15px; color: #3a4459; }
  .stats b { display: block; font: 900 30px/1 system-ui, sans-serif; color: #1d2433; font-variant-numeric: tabular-nums; }
  .stats div + div { margin-top: 8px; }
  .badge { display: inline-block; margin-bottom: 12px; padding: 4px 12px; border-radius: 999px; background: #e8453c; color: #fff; font-weight: 800; font-size: 13px; }
  .badge.hidden { display: none; }
  .btn { font: 800 18px system-ui, sans-serif; color: #fff; background: #ff8a1f; border: 0; border-radius: 14px; padding: 12px 34px; cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,.2); }
  .btn:hover { background: #ff9a3a; }
  .btn:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
  .hint { margin-top: 10px !important; font-size: 13px !important; color: #7a8397 !important; }

<body>
<canvas id="stage" aria-label="Flap 3D game. Press Space or tap to flap."></canvas>
<a class="back" href="../../">&larr; aiapps</a>
<button class="icon-btn" id="mute" type="button" aria-label="Mute sound"></button>
<div id="score" aria-live="polite">0</div>
<div id="flash"></div>
<div class="card" id="ready">
  <h1>Flap 3D</h1>
  <p>Tap, click or press <span class="keys">Space</span> to flap.</p>
  <p>Fly through the gaps between the pipes.</p>
  <p class="hint">Best: <span id="best-ready">0</span> &middot; <span class="keys">P</span> pauses</p>
</div>
<div class="card hidden" id="paused">
  <h2>Paused</h2>
  <p>Tap or press <span class="keys">Space</span> to keep flying.</p>
</div>
<div class="card hidden" id="over" role="dialog" aria-labelledby="over-title">
  <h2 id="over-title">Game over</h2>
  <span class="badge hidden" id="new-best">New best!</span>
  <div class="results">
    <div class="medal none" id="medal">No medal</div>
    <div class="stats"><div>Score<b id="final-score">0</b></div><div>Best<b id="final-best">0</b></div></div>
  </div>
  <button class="btn" id="again" type="button">Play again</button>
  <p class="hint">or press <span class="keys">Space</span></p>
</div>

<script type="module">
import * as THREE from 'three';

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOBILE = matchMedia('(pointer: coarse)').matches || Math.min(screen.width, screen.height) < 700;

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

composer.addPass(bloom);
const vignette = new THREE.ShaderPass({

  const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));

  camDist = Math.max(15.5, (portrait ? 5.2 : 8.5) / (tanHalf * aspect));

// ---------------------------------------------------------------- sky, stars, moon, environment lighting
const sky = new THREE.Sky();
sky.scale.setScalar(5000);
const skyU = sky.material.uniforms;
skyU.mieCoefficient.value = 0.004;
skyU.mieDirectionalG.value = 0.82;
skyU.cloudScale.value = 0.00025;
scene.add(sky);
const overlayMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, transparent: true, depthWrite: false, fog: false,
  uniforms: { top: { value: C('#000') }, bottom: { value: C('#000') }, alpha: { value: 0 } },
  vertexShader: `varying vec3 vDir;

  fragmentShader: `uniform vec3 top; uniform vec3 bottom; uniform float alpha; varying vec3 vDir;

const overlay = new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), overlayMat);
scene.add(overlay);
const starPos = [];
for (let i = 0; i < 1800; i++) {
  const th = rand() * Math.PI * 2, ph = Math.acos(rr(0.05, 1)), r = 3000;

const stars = new THREE.Points(starGeo, starMat);
stars.renderOrder = 1;
scene.add(stars);
const MOON_DIR = V(0.35, 0.34, -0.87).normalize();
const moonMat = new THREE.MeshBasicMaterial({ color: C('#fff6df').multiplyScalar(2.2), transparent: true, opacity: 0, fog: false });
const moon = new THREE.Mesh(new THREE.SphereGeometry(45, 24, 16), moonMat);
moon.renderOrder = 2;
scene.add(moon);

const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
const envSky = new THREE.Mesh(sky.geometry, sky.material);
envSky.scale.setScalar(5000);
envScene.add(envSky, new THREE.Mesh(overlay.geometry, overlayMat));
let envRT = null;
function updateEnvironment() {
  skyU.showSunDisc.value = 0; // the sun lights the scene directly; keep its disc out of the ambient capture
  const rt = pmrem.fromScene(envScene, 0, 1, 20000, { size: 128 });
  skyU.showSunDisc.value = 1;
  if (envRT) envRT.dispose();
  envRT = rt;
  scene.environment = rt.texture;
}

const hemi = new THREE.HemisphereLight('#dfe9ff', '#5b5140', 0.2);
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.castShadow = true;
sun.shadow.mapSize.setScalar(MOBILE ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 18, bottom: -18, near: 1, far: 300 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
sun.shadow.radius = 3;
const moonLight = new THREE.DirectionalLight('#a8bcff', 0);
scene.add(hemi, sun, sun.target, moonLight, moonLight.target);

// Time of day, driven by score: morning -> day -> sunset -> dusk -> night -> morning again.
const MORNING = { el: 16, az: 60, sunI: 2.1, sunC: '#ffd8b0', hemiI: 0.15, exp: 0.52, fogC: '#c7d6e6', fogD: 0.0048, ovTop: '#262e38', ovBot: '#59626e', ovA: 0, night: 0, cloudC: '#fff6ea', cov: 0.28, turb: 3.5, ray: 1.4, bloomS: 0.25, bloomT: 6, envI: 0.5 };
const DAY = { ...MORNING, el: 32, az: 75, sunI: 2.1, sunC: '#fff4e5', exp: 0.44, envI: 0.2, fogC: '#bdd0e4', fogD: 0.0045, cloudC: '#ffffff', cov: 0.34, turb: 2.5, ray: 1.6 };
const SUNSET = { ...DAY, el: 5, az: 20, sunI: 1.9, sunC: '#ffa060', exp: 0.7, fogC: '#d59b7c', fogD: 0.0045, ovTop: '#2b3d85', ovBot: '#f29a5c', ovA: 0.6, cloudC: '#ffb58a', cov: 0.3, turb: 6, ray: 2.6, bloomS: 0.3, bloomT: 4 };

// ---------------------------------------------------------------- ground: striped grass + a sandy strip under the pipes, scrolling
const groundMat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.9 });
const groundU = { uScroll: { value: 0 }, uNight: { value: 0 } };

    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');

    .replace('#include <common>', `#include <common>

{
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1400, 900).rotateX(-Math.PI / 2), groundMat);
  ground.position.set(100, 0, -330);
  ground.receiveShadow = true;
  scene.add(ground);
}

// ---------------------------------------------------------------- scenery layers (recycled; true 3D parallax comes from perspective)
function tinted(geo, color) {

  for (let i = 0; i < n; i++) a.set([c.r, c.g, c.b], i * 3);
  geo.setAttribute('color', new THREE.BufferAttribute(a, 3));
  return geo;
}

  for (const { mesh, items, L, x0 } of layers) {

    for (const p of pipes) {
      const px = p.wx - scroll, gy = gapY(p, time);
      if (px < -18) { placePipe(p, maxWx + SPACING, lastGapY, pipeCount++); lastGapY = p.baseY; maxWx = p.wx; continue; }
      if (!p.scored && px + PIPE_R < -BIRD_R) {
        p.scored = true; score++; setScoreText(true); sfx.point();
        const r = rings[ringCursor++ % rings.length]; r.t = 0; r.pipe = p;
      }
      if (Math.abs(px) < LIP_R + BIRD_R && collide(px, gy, p.gap)) { die(); break; }
    }
  }
}

// ---------------------------------------------------------------- render
const camPos = V(), camTarget = V(), YAW = 0.24;
let camY = 5.3;
function render(realDt, alpha) {
  const sc = lerp(prevScroll, scroll, alpha);
  const by = lerp(bird.prevY, bird.y, alpha), bp = lerp(bird.prevPitch, bird.pitch, alpha);

  phaseCur += (score / 10 - phaseCur) * Math.min(1, realDt * 0.9);
  sampleEnv(phaseCur);
  const el = THREE.MathUtils.degToRad(env.el), az = THREE.MathUtils.degToRad(env.az);
  sunDir.set(Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az));
  skyU.sunPosition.value.copy(sunDir);
  skyU.turbidity.value = env.turb;
  skyU.rayleigh.value = env.ray;
  skyU.cloudCoverage.value = env.cov;
  skyU.time.value = time * 4;
  overlayMat.uniforms.top.value.copy(env.ovTop);
  overlayMat.uniforms.bottom.value.copy(env.ovBot);
  overlayMat.uniforms.alpha.value = env.ovA;
  if (Math.abs(phaseCur - envPhase) > 0.02) { envPhase = phaseCur; updateEnvironment(); }
  scene.fog.color.copy(env.fogC);
  scene.fog.density = env.fogD;
  scene.environmentIntensity = env.envI;
  renderer.toneMappingExposure = env.exp;
  bloom.strength = env.bloomS;
  bloom.threshold = env.bloomT;
  hemi.intensity = env.hemiI;
  sun.color.copy(env.sunC);
  sun.intensity = env.sunI;
  moonLight.intensity = env.night * 0.6;
  starMat.opacity = moonMat.opacity = env.night;
  clouds.mat.color.copy(env.cloudC).multiplyScalar(2.6);
  cityU.uNight.value = smooth(0.35, 0.9, env.night);
  pipeMat.emissiveIntensity = env.night * 0.5;
  birdLight.intensity = env.night * 14;

  groundU.uScroll.value = sc;
  updateLayers(sc);
  updateCity(sc);
  clouds.update(sc, time);

  for (const p of pipes) {
    const x = p.wx - sc;
    p.g.visible = x > -30 && x < 60;
    if (p.g.visible) layoutPipe(p, x, gapY(p, time));
  }
  for (const r of rings) {
    r.t += realDt;
    r.m.visible = r.t < 0.5 && !!r.pipe;
    if (r.m.visible) {
      const k = r.t / 0.5;
      r.m.position.set(r.pipe.wx - sc, gapY(r.pipe, time), 0);
      r.m.scale.setScalar(1 + k * 2.2);
      r.mat.opacity = 1 - k;
    }
  }

  // bird pose: pitch, squash & stretch, wing flaps
  bird.squash = Math.max(0, bird.squash - realDt * 5);
  const sq = Math.sin(bird.squash * Math.PI) * 0.18;
  birdG.position.set(0, by, 0);
  birdLight.position.set(0.6, by + 0.8, 2.2);
  birdG.rotation.set(0, 0, bp);
  birdG.scale.set(1.3 * (1 - sq * 0.4), 1.3 * (1 + sq), 1.3 * (1 - sq * 0.3));
  const since = time - bird.flapT;
  let wing;
  if (state === 'grounded' || state === 'over') wing = 0.2;
  else if (since < 0.3) wing = Math.sin((since / 0.3) * Math.PI * 2) * 1.1;
  else wing = Math.sin(time * (state === 'ready' ? 14 : 5)) * (state === 'ready' ? 0.6 : 0.25);
  wingL.rotation.x = wing;
  wingR.rotation.x = -wing;
  updateFeathers(realDt * timeScale);

  // camera: 3/4 view, a little ahead of the bird, soft vertical follow, crash shake
  camY += (lerp(portrait ? 5.8 : 5.4, by, portrait ? 0.1 : 0.22) - camY) * Math.min(1, realDt * 3);
  camTarget.set(portrait ? 2.4 : 2.8, camY + 0.3, 0);
  camPos.set(camTarget.x + Math.sin(YAW) * camDist, camY + 0.7, Math.cos(YAW) * camDist);
  shake = Math.max(0, shake - realDt * 2.2);
  if (shake > 0) {
    const a = shake * shake * 0.45;
    camPos.x += Math.sin(time * 61) * a; camPos.y += Math.sin(time * 53 + 1) * a;
  }
  camera.position.copy(camPos);
  camera.lookAt(camTarget);
  sky.position.copy(camera.position);
  overlay.position.copy(camera.position);
  stars.position.copy(camera.position);
  moon.position.copy(camera.position).addScaledVector(MOON_DIR, 2800);
  sun.target.position.set(4, 0, 0);
  sun.position.set(4, 0, 0).addScaledVector(sunDir.y > 0.05 ? sunDir : p3.set(sunDir.x, 0.05, sunDir.z).normalize(), 120);
  moonLight.target.position.set(4, 0, 0);
  moonLight.position.set(4, 0, 0).addScaledVector(MOON_DIR, 120);

  composer.render();
}

// ---------------------------------------------------------------- input
canvas.addEventListener('pointerdown', e => { e.preventDefault(); action(); });
addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') {
    if (e.target.tagName === 'BUTTON' && (k === ' ')) return;
    e.preventDefault();
    action();
  } else if (k === 'p' || k === 'P') setPaused(!paused);
});
ui.again.addEventListener('click', e => { e.stopPropagation(); toReady(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });
addEventListener('resize', applySize);
applySize();

// ---------------------------------------------------------------- main loop (fixed 120 Hz physics, interpolated rendering)
let last = performance.now(), acc = 0, frameAvg = 16.7, lastCheck = last, goodChecks = 0;
function frame(now) {
  const raw = now - last;
  last = now;
  const realDt = Math.min(raw / 1000, 0.1);
  timeScale = now < slowUntil ? 0.3 : Math.min(1, timeScale + realDt * 3);
  if (!paused) {
    acc += realDt * timeScale;
    let n = 0;
    while (acc >= STEP && n++ < 30) { step(STEP); acc -= STEP; }
  }
  // Adapt resolution only from real gameplay frames (not one-off shader warm-up or menus).
  if (state !== 'playing' || paused) { frameAvg = 16.7; lastCheck = now; }
  else {
    frameAvg = frameAvg * 0.9 + Math.min(raw, 100) * 0.1;
    if (now - lastCheck > 1000) {
      lastCheck = now;
      if (frameAvg > 21 && dpr > 0.6) { dpr = Math.max(0.6, dpr * 0.85); applySize(); goodChecks = 0; }
      else if (frameAvg < 17.5 && dpr < DPR_MAX) { if (++goodChecks >= 3) { dpr = Math.min(DPR_MAX, dpr * 1.15); applySize(); goodChecks = 0; } }
      else goodChecks = 0;
    }
  }
  render(paused ? 0 : realDt, acc / STEP);
  requestAnimationFrame(frame);
}
resetRun();
pipes.forEach(p => { p.wx = scroll + 1000; });
// Warm up shaders for day and night behind the start card, then start at morning.
[4, 0].forEach(ph => { phaseCur = ph; envPhase = -1; render(0, 0); });
requestAnimationFrame(frame);

// Read-only test hook, plus setScore() to preview each time of day.
window.game = {
  get state() { return state; }, get score() { return score; }, get birdY() { return bird.y; }, get vy() { return bird.vy; },
  get paused() { return paused; }, get dpr() { return dpr; }, get best() { return best; }, get muted() { return muted; },
  nextGap() {
    const p = pipes.filter(p => p.wx - scroll > -PIPE_R - BIRD_R).sort((a, b) => a.wx - b.wx)[0];
    return p ? { x: p.wx - scroll, y: gapY(p, time), gap: p.gap } : null;
  },
  setScore(n) { score = n; phaseCur = n / 10; setScoreText(false); },
};
</script>
</body>
</html>
