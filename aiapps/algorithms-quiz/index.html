{"id":"L7-02","topic":"L7","type":"tf","q":"In quicksort's divide-and-conquer structure, essentially all of the work is done in the divide step (partitioning); the combine step does nothing.","answer":true,"explain":"After PARTITION, every element of A[p..q−1] is ≤ A[q] ≤ every element of A[q+1..r], so once both sides are sorted recursively the subarray is sorted. The key is the linear-time partitioning subroutine.","ref":"CLRS 7.1","slide":3},
{"id":"L7-03","topic":"L7","type":"mc","q":"Run the CLRS `PARTITION(A, 1, 8)` (pivot x = A[r], the last element) on `A = ⟨7, 3, 9, 1, 6, 2, 8, 5⟩`. What is A afterwards?","options":["⟨3, 1, 2, 5, 6, 9, 8, 7⟩","⟨3, 1, 2, 5, 7, 9, 6, 8⟩","⟨3, 1, 5, 7, 6, 9, 8, 2⟩","⟨1, 2, 3, 5, 6, 7, 8, 9⟩"],"answer":0,"explain":"Pivot 5: the elements ≤ 5 (3, 1, 2) are swapped forward one at a time, giving ⟨3, 1, 2, 5, 6, 9, 8, 7⟩ and q = 4. PARTITION is not order-preserving, so the 'elements > 5 in original order' answer is wrong, and the final exchange is with A[i+1], not A[i].","ref":"CLRS 7.1","slide":4},
{"id":"L7-04","topic":"L7","type":"mc","q":"After the CLRS `PARTITION(A, 1, 8)` returns q on `A = ⟨4, 11, 1, 12, 7, 3, 10, 6⟩` (pivot = last element), what is the subarray A[q+1..8]?","options":["⟨7, 11, 10, 12⟩","⟨11, 12, 7, 10⟩","⟨7, 10, 11, 12⟩","⟨6, 7, 11, 10, 12⟩"],"answer":0,"explain":"Pivot 6; the elements ≤ 6 (4, 1, 3) are swapped to the front, then the final exchange puts 6 at A[4]. The exchanges scramble the large elements, leaving A = ⟨4, 1, 3, 6, 7, 11, 10, 12⟩, so A[5..8] = ⟨7, 11, 10, 12⟩, not the large elements in their original order and not sorted.","ref":"CLRS 7.1","slide":4},
{"id":"L7-05","topic":"L7","type":"mc","q":"The lecture's partition example uses PARTITION(A, p, q) with pivot x = A[p] (the FIRST element): i ← p; for j ← p+1 to q, if A[j] ≤ x then i ← i+1 and exchange A[i] ↔ A[j]; finally exchange A[p] ↔ A[i] and return i. What is A after running it on `A = ⟨5, 9, 2, 7, 1, 8, 3⟩` with p = 1, q = 7?","options":["⟨3, 2, 1, 5, 9, 8, 7⟩","⟨2, 1, 3, 5, 9, 7, 8⟩","⟨2, 1, 3, 7, 9, 8, 5⟩","⟨1, 2, 3, 5, 7, 8, 9⟩"],"answer":0,"explain":"With pivot 5, the elements 2, 1, 3 are swapped into positions 2–4, and the final exchange A[1] ↔ A[4] places 5 at index 4: ⟨3, 2, 1, 5, 9, 8, 7⟩. The option ⟨2, 1, 3, 7, 9, 8, 5⟩ is what the CLRS last-element version produces (pivot 3).","ref":"CLRS 7.1","slide":16},
{"id":"L7-06","topic":"L7","type":"tf","q":"On a subarray of n = r − p + 1 elements, CLRS `PARTITION` compares array elements with the pivot exactly n − 1 times, so it runs in Θ(n) time.","answer":true,"explain":"The for loop runs j = p .. r−1, doing one comparison A[j] ≤ x per iteration and O(1) other work, so PARTITION is Θ(n).","ref":"CLRS 7.1","slide":17},
{"id":"L7-07","topic":"L7","type":"mc","q":"What is the running time of QUICKSORT (with CLRS `PARTITION`) when all n elements of A have the same value?","options":["Θ(n²)","Θ(n lg n)","Θ(n)","Θ(n² lg n)"],"answer":0,"explain":"Every element satisfies A[j] ≤ x, so PARTITION returns q = r every time: one side has n − 1 elements and the other is empty, giving T(n) = T(n−1) + Θ(n) = Θ(n²). Equal keys are a worst case for this partition, not a best case.","ref":"CLRS Ex 7.2-2","slide":20},
{"id":"L7-08","topic":"L7","type":"tf","q":"With CLRS `PARTITION` (last element as pivot), QUICKSORT runs in Θ(n lg n) time on an input that is already sorted in increasing order (distinct keys).","answer":false,"explain":"On sorted input the pivot A[r] is always the maximum, so every split is (n−1) : 0 and T(n) = T(n−1) + Θ(n) = Θ(n²). Sorted input is the classic worst case of the deterministic version.","ref":"CLRS 7.2","slide":20},
{"id":"L7-09","topic":"L7","type":"mc","q":"QUICKSORT with CLRS `PARTITION` is run on `A = ⟨1, 2, 3, …, n⟩` (already sorted, distinct). Exactly how many element comparisons (A[j] ≤ x) does it make in total?","options":["n(n−1)/2","n − 1","n lg n","n²"],"answer":0,"explain":"The subproblem sizes are n, n−1, …, 2, and a call on m elements makes m − 1 comparisons, so the total is (n−1) + (n−2) + … + 1 = n(n−1)/2 (e.g. 45 for n = 10, checked by simulation).","ref":"CLRS 7.2","slide":22},
{"id":"L7-10","topic":"L7","type":"tf","q":"In the worst-case analysis T(n) = max_{0≤q≤n−1} (T(q) + T(n−q−1)) + Θ(n), after substituting T(k) ≤ ck², the expression q² + (n−q−1)² is largest at q = (n−1)/2.","answer":false,"explain":"q² + (n−q−1)² is convex in q, so q = (n−1)/2 is where it is SMALLEST; its maximum, (n−1)², is at an endpoint q = 0 or q = n−1. That endpoint value gives T(n) ≤ cn² − c(2n−1) + Θ(n) ≤ cn².","ref":"CLRS 7.4.1","slide":24},
{"id":"L7-11","topic":"L7","type":"mc","q":"Suppose PARTITION always splits the array in the proportion 1/10 : 9/10, so T(n) = T(n/10) + T(9n/10) + Θ(n). What is T(n)?","options":["Θ(n lg n)","Θ(n²)","Θ(n)","Θ(n^{1.1})"],"answer":0,"explain":"Each level of the recursion tree costs at most cn, and the deepest leaf is at depth log_{10/9} n = Θ(lg n), so T(n) = Θ(n lg n). Any constant-proportion split gives the same asymptotic result, only the constant changes.","ref":"CLRS 7.2","slide":32},
{"id":"L7-12","topic":"L7","type":"mc","q":"In the recursion tree for T(n) = T(n/10) + T(9n/10) + cn, how many levels deep (exactly, ignoring rounding) is the LONGEST root-to-leaf path?","options":["log_{10/9} n","log_{10} n","n^{9/10}","n/10"],"answer":0,"explain":"The longest path always follows the 9/10 branch, and the size reaches Θ(1) after log_{10/9} n steps. log_{10} n is the depth of the SHORTEST path (always the 1/10 branch), which is why the slide brackets cn log_{10} n ≤ T(n) ≤ cn log_{10/9} n + O(n).","ref":"CLRS 7.2","slide":31},
{"id":"L7-13","topic":"L7","type":"tf","q":"If PARTITION always produced a 99-to-1 split, quicksort would degrade to Θ(n²) time.","answer":false,"explain":"T(n) = T(99n/100) + T(n/100) + Θ(n) still has depth log_{100/99} n = Θ(lg n) with O(n) work per level, so T(n) = Θ(n lg n). Only splits whose smaller side is a constant number of elements (like n−1 : 0) give Θ(n²).","ref":"CLRS 7.2","slide":32},
{"id":"L7-14","topic":"L7","type":"tf","q":"If quicksort's partitions alternate between a perfectly balanced (lucky) split and a worst-case (n−1 : 0, unlucky) split, the running time is still Θ(n lg n).","answer":true,"explain":"Combining the two steps gives L(n) = 2L(n/2 − 1) + Θ(n) = Θ(n lg n): the cost of the bad split is absorbed into the Θ(n) of the good split that follows it.","ref":"CLRS 7.2","slide":36},
{"id":"L7-15","topic":"L7","type":"tf","q":"In the best case, quicksort satisfies T(n) = 2T(n/2) + Θ(n), the same recurrence as merge sort, so its best-case running time is Θ(n lg n).","answer":true,"explain":"When PARTITION always splits evenly (q ≈ (n−1)/2, which is where q lg q + (n−q−1) lg(n−q−1) is minimized), both subproblems have size about n/2 and master theorem case 2 gives Θ(n lg n).","ref":"CLRS 7.2","slide":33},
{"id":"L7-16","topic":"L7","type":"tf","q":"Because RANDOMIZED-QUICKSORT picks its pivot at random, its worst-case running time is O(n lg n).","answer":false,"explain":"Its EXPECTED running time is O(n lg n) for every input, but an unlucky sequence of random choices (e.g. always the largest element) still gives Θ(n²). The worst case is determined only by the random-number generator, not by the input.","ref":"CLRS 7.3","slide":37},
{"id":"L7-17","topic":"L7","type":"tf","q":"For RANDOMIZED-QUICKSORT, the expected running time on an already sorted input is Θ(n lg n), the same as on any other input of n distinct keys.","answer":true,"explain":"Randomization makes the running time independent of the input order: no specific input elicits the worst case, so the Θ(n lg n) expected bound holds for sorted input too.","ref":"CLRS 7.3","slide":37},
{"id":"L7-18","topic":"L7","type":"ms","q":"Which statements about RANDOMIZED-QUICKSORT (CLRS) are correct?","options":["RANDOMIZED-PARTITION exchanges A[r] with an element chosen uniformly at random from A[p..r], then calls PARTITION.","No particular input order causes its worst-case behavior; only the random choices can.","Its O(n lg n) expected time assumes the input is a uniformly random permutation.","It always produces a balanced split, because a random pivot is near the median.","Its expected number of comparisons is Θ(n²) on reverse-sorted input."],"answer":[0,1],"explain":"The random swap into A[r] makes every element equally likely to be the pivot, so the expectation is over the algorithm's own random choices, not over inputs. The O(n lg n) expected bound needs no assumption about the input distribution, and individual splits can still be unbalanced.","ref":"CLRS 7.3","slide":39},
{"id":"L7-19","topic":"L7","type":"mc","q":"In the analysis of randomized quicksort, X_k = 1 if PARTITION produces a k : n−k−1 split (k = 0, 1, …, n−1) and 0 otherwise. Assuming distinct elements, what is E[X_k]?","options":["1/n","1/2","k/n","1/(n − 1)"],"answer":0,"explain":"The pivot is equally likely to be any of the n elements, and the split is k : n−k−1 exactly when the pivot has rank k+1, so Pr{X_k = 1} = 1/n. There are n possible values of k (0 to n−1), not n − 1.","ref":"CLRS 7.4.2","slide":40},
{"id":"L7-20","topic":"L7","type":"mc","q":"The expected-time analysis reduces to E[T(n)] = (2/n) Σ_{k=2}^{n−1} E[T(k)] + Θ(n) and proves E[T(n)] ≤ an lg n by substitution. Which fact about sums is used?","options":["Σ_{k=2}^{n−1} k lg k ≤ ½ n² lg n − ⅛ n²","Σ_{k=2}^{n−1} k lg k ≥ ½ n² lg n","Σ_{k=2}^{n−1} lg k ≤ lg n","Σ_{k=2}^{n−1} k ≤ n lg n"],"answer":0,"explain":"Splitting the sum at n/2 (lg k ≤ lg n − 1 below it, lg k ≤ lg n above it) gives Σ k lg k ≤ ½n² lg n − ⅛n². Then (2a/n)(½n² lg n − ⅛n²) = an lg n − an/4, and the residual an/4 dominates the Θ(n) term for large enough a.","ref":"CLRS 7.4.2","slide":46},
{"id":"L7-21","topic":"L7","type":"tf","q":"In the expected-time analysis of randomized quicksort, the step E[X_k · (T(k) + T(n−k−1) + Θ(n))] = E[X_k] · E[T(k) + T(n−k−1) + Θ(n)] relies on X_k being independent of the random choices made inside the recursive calls.","answer":true,"explain":"Expectation of a product equals the product of expectations only for independent random variables; X_k depends only on the pivot chosen at the top level, while T(k) and T(n−k−1) depend on later, independent random choices.","ref":"CLRS 7.4.2","slide":42},
{"id":"L7-22","topic":"L7","type":"ms","q":"CLRS `PARTITION(A, p, r)` uses pivot x = A[r], an index i, and a loop index j that runs from p to r−1. At the start of each loop iteration, which statements are guaranteed to hold?","options":["Every element of A[p..i] is ≤ x.","Every element of A[i+1..j−1] is > x.","A[r] = x.","Every element of A[j..r−1] is > x.","A[p..i] is in sorted order."],"answer":[0,1,2],"explain":"These three conditions are the loop invariant of PARTITION. A[j..r−1] has not been examined yet, so nothing is known about it, and the small side A[p..i] is not sorted.","ref":"CLRS 7.1","slide":4},
{"id":"L7-23","topic":"L7","type":"mc","q":"Run HOARE-PARTITION(A, 1, 8) (CLRS Problem 7-1: x = A[p]; j moves left until A[j] ≤ x, i moves right until A[i] ≥ x; if i < j exchange, else return j) on `A = ⟨6, 11, 3, 8, 2, 9, 5, 7⟩`. What does it return, and what is A afterwards?","options":["j = 3; A = ⟨5, 2, 3, 8, 11, 9, 6, 7⟩","j = 5; A = ⟨6, 3, 2, 5, 7, 9, 8, 11⟩","j = 4; A = ⟨5, 2, 3, 8, 11, 9, 6, 7⟩","j = 4; A = ⟨3, 2, 5, 6, 11, 8, 9, 7⟩"],"answer":0,"explain":"With x = 6: the first round exchanges A[1] = 6 and A[7] = 5, the second exchanges 11 and 2 (positions 2 and 5), and the third stops with i > j, returning j = 3. Now every element of A[1..3] is ≤ every element of A[4..8], but the pivot is not necessarily at index j.","ref":"CLRS Prob 7-1","slide":4},
{"id":"L7-24","topic":"L7","type":"tf","q":"Like CLRS `PARTITION`, Hoare's original HOARE-PARTITION puts the pivot into its final sorted position and returns that position.","answer":false,"explain":"HOARE-PARTITION returns an index j with p ≤ j < r such that every element of A[p..j] ≤ every element of A[j+1..r]; the pivot ends up somewhere in one of the two parts. QUICKSORT must therefore recurse on A[p..j] and A[j+1..r], not exclude index j.","ref":"CLRS Prob 7-1","slide":4},
{"id":"L7-25","topic":"L7","type":"ms","q":"For which inputs of n elements does QUICKSORT with CLRS `PARTITION` (pivot = last element) take Θ(n²) time?","options":["Already sorted in increasing order (distinct keys).","Sorted in decreasing order (distinct keys).","All n elements equal.","An input on which every PARTITION call happens to split 1/10 : 9/10.","An input on which every PARTITION call happens to split evenly."],"answer":[0,1,2],"explain":"In the first three cases every split is maximally unbalanced (the pivot is the maximum, the minimum, or equal to everything, so q = r), giving T(n) = T(n−1) + Θ(n) = Θ(n²). Any constant-proportion split, even 1/10 : 9/10, still gives Θ(n lg n).","ref":"CLRS 7.2","slide":20},
{"id":"L7-26","topic":"L7","type":"ms","q":"Which of these recurrences have solution Θ(n lg n)?","options":["T(n) = 2T(n/2) + Θ(n)","T(n) = T(n/10) + T(9n/10) + Θ(n)","L(n) = 2L(n/2 − 1) + Θ(n)","T(n) = T(n − 1) + Θ(n)","T(n) = T(n/2) + Θ(n)"],"answer":[0,1,2],"explain":"The first three are quicksort's best case, a constant-proportion split, and the alternating lucky/unlucky case: all Θ(n lg n). T(n−1) + Θ(n) is the Θ(n²) worst case, and T(n/2) + Θ(n) recurses on only one half, giving Θ(n).","ref":"CLRS 7.2","slide":36},
{"id":"L8-01","topic":"L8","type":"tf","q":"Every comparison sort requires Ω(n lg n) comparisons in the worst case to sort n elements.","answer":true,"explain":"Its decision tree must have at least n! reachable leaves, and a binary tree of height h has at most 2^{h} leaves, so h ≥ lg(n!) = Ω(n lg n). The worst-case number of comparisons is the height h.","ref":"CLRS 8.1","slide":12},
{"id":"L8-02","topic":"L8","type":"mc","q":"Using the decision-tree argument, what is the smallest number of comparisons that any comparison sort must make in the worst case to sort 4 distinct elements?","options":["5","3","4","8","24"],"answer":0,"explain":"The tree needs at least 4! = 24 leaves, so its height h satisfies 2^{h} ≥ 24, i.e. h ≥ ⌈lg 24⌉ = 5. 3 = n − 1 only certifies that an input is already sorted, and 24 confuses the number of leaves with the height.","ref":"CLRS 8.1","slide":12},
{"id":"L8-03","topic":"L8","type":"tf","q":"In the decision tree of any correct comparison sort on n elements, every leaf is at depth Ω(n lg n).","answer":false,"explain":"Only the HEIGHT (the longest path, i.e. the worst case) must be Ω(n lg n). A leaf can be as shallow as depth n − 1: for example, insertion sort on already sorted input makes only n − 1 comparisons.","ref":"CLRS Ex 8.1-1","slide":10},
{"id":"L8-04","topic":"L8","type":"tf","q":"There is a comparison sort that runs in O(n) time on at least half of the n! inputs of length n, for every n.","answer":false,"explain":"If n!/2 leaves were at depth ≤ cn, a binary tree would need 2^{cn} ≥ n!/2, i.e. cn ≥ lg(n!) − 1 = Ω(n lg n), which fails for large n. The same argument rules out a 1/n or a 1/2^{n} fraction of the inputs.","ref":"CLRS Ex 8.1-3","slide":12},
{"id":"L8-05","topic":"L8","type":"mc","q":"The lecture's decision tree for sorting ⟨a₁, a₂, a₃⟩ (insertion sort) has root 1:2; if a₁ ≤ a₂ it compares 2:3 (leaf ⟨1,2,3⟩ if a₂ ≤ a₃, otherwise compares 1:3 → leaf ⟨1,3,2⟩ or ⟨3,1,2⟩); if a₁ > a₂ it compares 1:3 (leaf ⟨2,1,3⟩ if a₁ ≤ a₃, otherwise compares 2:3 → leaf ⟨2,3,1⟩ or ⟨3,2,1⟩). Which leaf is reached for the input ⟨a₁, a₂, a₃⟩ = ⟨5, 8, 2⟩?","options":["⟨3, 1, 2⟩, after 3 comparisons","⟨1, 3, 2⟩, after 3 comparisons","⟨3, 1, 2⟩, after 2 comparisons","⟨2, 3, 1⟩, after 3 comparisons"],"answer":0,"explain":"5 ≤ 8 goes left to 2:3; 8 > 2 goes right to 1:3; 5 > 2 goes right to leaf ⟨3,1,2⟩, meaning a₃ ≤ a₁ ≤ a₂ (2 ≤ 5 ≤ 8). The path has 3 comparisons; only inputs reaching leaf ⟨1,2,3⟩ or ⟨2,1,3⟩ finish after 2.","ref":"CLRS 8.1","slide":9},
{"id":"L8-06","topic":"L8","type":"tf","q":"Heapsort and merge sort are asymptotically optimal comparison sorts.","answer":true,"explain":"Both run in O(n lg n) worst-case time, which matches the Ω(n lg n) decision-tree lower bound for comparison sorts.","ref":"CLRS 8.1","slide":15},
{"id":"L8-07","topic":"L8","type":"mc","q":"Run the lecture's COUNTING-SORT(A, B, k) (keys in 1..k, array C[1..k]) on `A = ⟨3, 1, 4, 3, 2, 1, 3⟩` with k = 4. What is C after the third loop (for i = 2 to k: C[i] = C[i] + C[i−1]), just before the output loop starts?","options":["⟨2, 3, 6, 7⟩","⟨2, 1, 3, 1⟩","⟨0, 2, 3, 6⟩","⟨3, 4, 7, 8⟩"],"answer":0,"explain":"The second loop counts each key, C = ⟨2, 1, 3, 1⟩; the third loop makes C[i] the number of elements ≤ i, giving ⟨2, 3, 6, 7⟩. ⟨0, 2, 3, 6⟩ would be the count of elements < i.","ref":"CLRS 8.2","slide":28},
{"id":"L8-08","topic":"L8","type":"mc","q":"Continue COUNTING-SORT on `A = ⟨3, 1, 4, 3, 2, 1, 3⟩`, k = 4 (keys in 1..k). The output loop runs j = n downto 1, doing B[C[A[j]]] = A[j] and C[A[j]] = C[A[j]] − 1. Into which position of B is A[1] (the first of the three 3s) written?","options":["4","6","5","3"],"answer":0,"explain":"The 3s occupy B[4..6]. Scanning from the right, A[7] is placed first, in B[6], then A[4] in B[5], and finally A[1] in B[4]. Equal keys keep their input order, which is what makes counting sort stable; 6 is where a left-to-right output loop would put it.","ref":"CLRS 8.2","slide":33},
{"id":"L8-09","topic":"L8","type":"tf","q":"If the last loop of COUNTING-SORT is changed from `for j = n downto 1` to `for j = 1 to n`, the output is still correctly sorted, but the sort is no longer stable.","answer":true,"explain":"Each key still lands in the block of positions reserved for it, so B is sorted. But equal keys are now placed from the right end of their block in input order, which reverses their relative order.","ref":"CLRS Ex 8.2-3","slide":36},
{"id":"L8-10","topic":"L8","type":"ms","q":"Which statements about COUNTING-SORT on n elements with integer keys in 1..k are correct?","options":["It runs in Θ(n + k) time.","It never compares two input elements with each other.","It is stable.","It sorts in place, using only O(1) extra storage.","Its O(n) running time when k = O(n) contradicts the Ω(n lg n) sorting lower bound."],"answer":[0,1,2],"explain":"Two loops over C cost Θ(k) and two loops over A cost Θ(n); keys are only used as array indices, and the right-to-left output loop makes it stable. It needs the output array B[1..n] and C[1..k], and there is no contradiction because the Ω(n lg n) bound applies only to comparison sorts.","ref":"CLRS 8.2","slide":35},
{"id":"L8-11","topic":"L8","type":"tf","q":"Counting sort alone is a practical way to sort n arbitrary 32-bit integers in O(n) time.","answer":false,"explain":"With 32-bit keys, k = 2^{32} ≈ 4.3 × 10⁹, so the Θ(n + k) time and Θ(k) space for C are dominated by k. Radix sort applies counting sort to smaller digits instead.","ref":"CLRS 8.2","slide":35},
{"id":"L8-12","topic":"L8","type":"ms","q":"Which of these sorting algorithms, as given in CLRS, are stable?","options":["Insertion sort","Merge sort","Counting sort","Heapsort","Quicksort (CLRS PARTITION)"],"answer":[0,1,2],"explain":"Insertion sort only moves an element past strictly larger ones, MERGE takes from the left half on ties, and counting sort fills B from the right. Heapsort and quicksort make long-distance exchanges that can reorder equal keys.","ref":"CLRS 8.2","slide":36},
{"id":"L8-13","topic":"L8","type":"mc","q":"Radix sort (least significant digit first, stable sort on each digit) is applied to `⟨532, 118, 937, 214, 625, 341, 726⟩`. What is the order after the SECOND pass (sorting on the tens digit)?","options":["⟨214, 118, 625, 726, 532, 937, 341⟩","⟨118, 214, 625, 726, 532, 937, 341⟩","⟨341, 532, 214, 625, 726, 937, 118⟩","⟨118, 214, 341, 532, 625, 726, 937⟩"],"answer":0,"explain":"Pass 1 (ones digit) gives ⟨341, 532, 214, 625, 726, 937, 118⟩; pass 2 stably sorts that list by the tens digit, giving ⟨214, 118, 625, 726, 532, 937, 341⟩. Numbers with equal tens digits (e.g. 214 and 118) stay in their pass-1 order, not their original input order.","ref":"CLRS 8.3","slide":41},
{"id":"L8-14","topic":"L8","type":"tf","q":"RADIX-SORT sorts on the most significant digit first, then on the next digit, and so on.","answer":false,"explain":"Radix sort sorts on the LEAST significant digit first. Sorting MSD-first would need to recursively sort each pile separately, with many intermediate piles to keep track of.","ref":"CLRS 8.3","slide":37},
{"id":"L8-15","topic":"L8","type":"tf","q":"Radix sort gives a correctly sorted result only if the sort used on each digit is stable.","answer":true,"explain":"Correctness is proved by induction on the digit position: when two numbers have the same digit t, the stable sort keeps them in the order established by the lower-order digits. An unstable digit sort could undo that order.","ref":"CLRS 8.3","slide":44},
{"id":"L8-16","topic":"L8","type":"mc","q":"n b-bit keys are sorted with radix sort, splitting each key into r-bit digits and using counting sort for each pass. What is the running time?","options":["Θ((b/r)(n + 2^{r}))","Θ(b(n + r))","Θ((b/r) · n lg n)","Θ(r(n + 2^{b}))"],"answer":0,"explain":"There are ⌈b/r⌉ passes, and each pass is a counting sort over digits in the range 0..2^{r}−1, costing Θ(n + 2^{r}). Choosing r ≈ lg n balances the two terms and gives Θ(bn / lg n).","ref":"CLRS Lemma 8.4","slide":46},
{"id":"L8-17","topic":"L8","type":"mc","q":"Radix sort is used on n keys of 48 bits each, treating each key as a sequence of 12-bit digits and sorting each digit with counting sort. How many counting-sort passes are needed, and what is the range of each digit?","options":["4 passes, digits in 0..4095","12 passes, digits in 0..15","4 passes, digits in 0..11","48 passes, digits in 0..1"],"answer":0,"explain":"b/r = 48/12 = 4 passes, and a 12-bit digit takes 2^{12} = 4096 values (0..4095), so each pass is counting sort with k = 4096.","ref":"CLRS 8.3","slide":45},
{"id":"L8-18","topic":"L8","type":"tf","q":"n integers in the range 0 to n³ − 1 can be sorted in O(n) time.","answer":true,"explain":"Write each number in base n: it has d = 3 digits, each in 0..n−1. Radix sort with counting sort as the digit sort then takes Θ(d(n + n)) = Θ(n).","ref":"CLRS Ex 8.3-4","slide":47},
{"id":"L8-19","topic":"L8","type":"mc","q":"BUCKET-SORT runs in Θ(n) expected time under which assumption about its input?","options":["The keys are drawn independently and uniformly from [0, 1).","The keys are integers in the range 0..k with k = O(n).","The keys are already almost sorted.","The keys are distinct."],"answer":0,"explain":"With uniformly distributed keys, each of the n equal-width buckets receives O(1) elements in expectation (E[n_i²] = 2 − 1/n), so the insertion sorts take O(n) expected time in total. Small integer keys are the assumption of counting sort, not bucket sort.","ref":"CLRS 8.4","slide":48},
{"id":"L8-20","topic":"L8","type":"mc","q":"BUCKET-SORT is run on the n = 10 values `A = ⟨0.42, 0.07, 0.89, 0.45, 0.31, 0.73, 0.04, 0.58, 0.49, 0.91⟩`; A[i] goes into bucket B[⌊n·A[i]⌋]. After the buckets are sorted, what does bucket B[4] contain?","options":["⟨0.42, 0.45, 0.49⟩","⟨0.42, 0.45, 0.49, 0.58⟩","⟨0.31, 0.42, 0.45, 0.49⟩","⟨0.45, 0.49⟩"],"answer":0,"explain":"⌊10 · 0.42⌋ = ⌊10 · 0.45⌋ = ⌊10 · 0.49⌋ = 4, so B[4] holds exactly the values in [0.40, 0.50): ⟨0.42, 0.45, 0.49⟩. 0.31 goes to B[3] and 0.58 to B[5].","ref":"CLRS 8.4","slide":49},
{"id":"L8-21","topic":"L8","type":"tf","q":"Even if every input value falls into the same bucket, BUCKET-SORT (with insertion sort inside each bucket) still runs in O(n) time.","answer":false,"explain":"Its running time is Θ(n) + Σ O(n_i²). If all n values land in one bucket, insertion sort on that bucket takes Θ(n²) in the worst case; the Θ(n) bound is only an expected bound under the uniform-distribution assumption.","ref":"CLRS 8.4","slide":51},
{"id":"L8-22","topic":"L8","type":"mc","q":"In the analysis of BUCKET-SORT on n values drawn uniformly from [0, 1), n_i is the number of elements that land in bucket i. What is E[n_i²]?","options":["2 − 1/n","1","1/n","n/2"],"answer":0,"explain":"n_i is binomial with parameters n and p = 1/n, so E[n_i²] = Var[n_i] + E[n_i]² = (1 − 1/n) + 1 = 2 − 1/n. Answering 1 forgets that E[n_i²] ≠ E[n_i]².","ref":"CLRS 8.4","slide":52},
{"id":"L8-23","topic":"L8","type":"ms","q":"Which of these algorithms sort n keys in linear time (worst-case or expected) under their usual assumptions?","options":["Counting sort, with integer keys in 0..k and k = O(n)","Radix sort, with d-digit keys, d constant and each digit in 0..k with k = O(n)","Bucket sort, with keys uniformly distributed in [0, 1)","Heapsort, with distinct keys","Randomized quicksort, with distinct keys"],"answer":[0,1,2],"explain":"Counting sort is Θ(n + k), radix sort is Θ(d(n + k)), and bucket sort is Θ(n) expected under the uniform assumption. Heapsort and randomized quicksort are comparison sorts, bounded below by Ω(n lg n) (worst case and expected, respectively).","ref":"CLRS 8.2–8.4","slide":35},
{"id":"L8-24","topic":"L8","type":"tf","q":"An array of nonnegative integers (written without leading zeros) with different numbers of digits, where the total number of digits over all the integers is n, can be sorted in O(n) time.","answer":true,"explain":"A number with more digits is larger, so group the numbers by digit count with counting sort, then radix sort each group (a group of c_i numbers with i digits costs O(i·c_i)). The total is O(Σ i·c_i) = O(n).","ref":"CLRS Prob 8-3","slide":39},
{"id":"L9-01","topic":"L9","type":"tf","q":"Finding the minimum of n elements requires n − 1 comparisons, and no comparison-based algorithm can do it with fewer in the worst case.","answer":true,"explain":"MINIMUM makes n − 1 comparisons. It is optimal because every element except the minimum must lose at least one comparison, and each comparison has only one loser.","ref":"CLRS 9.1","slide":4},
{"id":"L9-02","topic":"L9","type":"tf","q":"Finding both the minimum and the maximum of n elements requires 2n − 2 comparisons in the worst case; no algorithm can do better than running MINIMUM and MAXIMUM separately.","answer":false,"explain":"Processing the elements in pairs costs 3 comparisons per pair (compare the two elements with each other, then the smaller with min and the larger with max), so at most 3⌊n/2⌋ comparisons in total, about 1.5n instead of 2n − 2.","ref":"CLRS 9.1","slide":5},
{"id":"L9-03","topic":"L9","type":"mc","q":"Using the pairwise method (compare the elements of each pair with each other, then the smaller with min and the larger with max), how many comparisons are needed to find both the minimum and the maximum of n = 100 elements?","options":["148","150","198","99","147"],"answer":0,"explain":"For even n, one comparison sets min and max from the first pair, and each of the remaining (n − 2)/2 = 49 pairs costs 3: 1 + 147 = 3n/2 − 2 = 148. 198 = 2n − 2 is the cost of finding them separately.","ref":"CLRS 9.1","slide":7},
{"id":"L9-04","topic":"L9","type":"tf","q":"When n is even, the lower median of n distinct elements is the (n/2 + 1)-th order statistic.","answer":false,"explain":"The lower median is the ⌊(n+1)/2⌋-th order statistic, which is the (n/2)-th when n is even; the upper median is the (n/2 + 1)-th. When n is odd, the two medians coincide.","ref":"CLRS 9","slide":8},
{"id":"L9-05","topic":"L9","type":"tf","q":"Because selection can be solved by sorting and then indexing, any comparison-based selection algorithm needs Ω(n lg n) time in the worst case.","answer":false,"explain":"Sorting is only an upper bound for selection (O(n lg n)). The median-of-medians SELECT finds any order statistic in O(n) worst-case time, so the sorting lower bound does not carry over.","ref":"CLRS 9.3","slide":10},
{"id":"L9-06","topic":"L9","type":"tf","q":"Like quicksort, RANDOMIZED-SELECT recursively processes both subarrays produced by the partition.","answer":false,"explain":"RANDOMIZED-SELECT recurses only on the side that contains the desired order statistic (prune-and-search). That is why its expected time drops from quicksort's Θ(n lg n) to Θ(n).","ref":"CLRS 9.2","slide":9},
{"id":"L9-07","topic":"L9","type":"mc","q":"RANDOMIZED-SELECT(A, 1, 8, 6) is called on `A = ⟨9, 4, 12, 7, 1, 15, 3, 8⟩` to find the 6th smallest element. Suppose RANDOM always returns r, so the first partition uses the last element, 8, as the pivot (CLRS PARTITION). Which recursive call is made next?","options":["RANDOMIZED-SELECT(A, 6, 8, 1)","RANDOMIZED-SELECT(A, 6, 8, 6)","RANDOMIZED-SELECT(A, 1, 4, 6)","RANDOMIZED-SELECT(A, 5, 8, 2)"],"answer":0,"explain":"The elements ≤ 8 are 4, 7, 1, 3, so 8 lands at q = 5 and k = q − p + 1 = 5. Since i = 6 > k, the search continues in A[6..8] for the (i − k) = 1st smallest, which is 9. Keeping i = 6 forgets that the k smaller elements have been discarded.","ref":"CLRS 9.2","slide":12},
{"id":"L9-08","topic":"L9","type":"tf","q":"The worst-case running time of RANDOMIZED-SELECT on n elements is Θ(n²).","answer":true,"explain":"If every partition is around the largest (or smallest) remaining element, then T(n) = T(n−1) + Θ(n) = Θ(n²). Its EXPECTED running time is Θ(n).","ref":"CLRS 9.2","slide":13},
{"id":"L9-09","topic":"L9","type":"mc","q":"If every partition in RANDOMIZED-SELECT happened to split 9 : 1 and the search always continued in the larger part, the running time would satisfy T(n) = T(9n/10) + Θ(n). What is T(n)?","options":["Θ(n)","Θ(n lg n)","Θ(lg n)","Θ(n²)"],"answer":0,"explain":"Here a = 1 and b = 10/9, so n^{log_{b} a} = n⁰ = 1 and f(n) = n is polynomially larger; the regularity condition holds with (9/10)f(n), so master theorem case 3 gives Θ(n). The work per level shrinks geometrically: n(1 + 9/10 + 81/100 + …) = 10n.","ref":"CLRS 9.2","slide":13},
{"id":"L9-10","topic":"L9","type":"tf","q":"Even if every partition in RANDOMIZED-SELECT split 99 : 1 and the search always continued in the larger part, the running time would still be O(n).","answer":true,"explain":"T(n) = T(99n/100) + Θ(n) is a geometric series n(1 + 0.99 + 0.99² + …) ≤ 100n = O(n). The constant is worse, but any constant-fraction split gives linear time.","ref":"CLRS 9.2","slide":13},
{"id":"L9-11","topic":"L9","type":"mc","q":"The average-case analysis of RANDOMIZED-SELECT starts from T(n) ≤ (1/n) Σ_{k=1}^{n} T(max(k − 1, n − k)) + O(n). What assumption does the max(k − 1, n − k) term encode?","options":["The desired element always lies in the larger of the two subarrays.","The pivot is always the median.","Every split is 9 : 1.","The desired element always lies in the smaller of the two subarrays."],"answer":0,"explain":"For an upper bound, we assume the worst: the search always continues on the bigger side, which has max(k − 1, n − k) elements when the pivot has rank k. Each rank k has probability 1/n, and solving the recurrence gives E[T(n)] = O(n).","ref":"CLRS 9.2","slide":14},
{"id":"L9-12","topic":"L9","type":"mc","q":"The worst-case linear-time SELECT is run on the 15 distinct elements `A = ⟨14, 3, 27, 9, 20, 5, 31, 12, 8, 25, 18, 40, 30, 22, 35⟩`. It divides A into groups of 5 in the given order, finds each group's median, and recursively takes the median of those medians as the pivot x. What are x and its rank k = rank(x) in A?","options":["x = 14, k = 6","x = 30, k = 12","x = 14, k = 5","x = 20, k = 8"],"answer":0,"explain":"The groups ⟨14, 3, 27, 9, 20⟩, ⟨5, 31, 12, 8, 25⟩, ⟨18, 40, 30, 22, 35⟩ have medians 14, 12, 30, whose median is x = 14. 6 elements of A are ≤ 14, so k = 6. x is not the true median of A (20); SELECT only guarantees that x is reasonably close to the middle.","ref":"CLRS 9.3","slide":20},
{"id":"L9-13","topic":"L9","type":"mc","q":"In SELECT (groups of 5, pivot x = median of the group medians), about how many of the n elements are guaranteed to be ≤ x (and, symmetrically, ≥ x)?","options":["About 3n/10","About n/10","About n/2","About n/5"],"answer":0,"explain":"At least half of the ⌈n/5⌉ group medians are ≤ x, and each such group has 3 elements ≤ its median ≤ x, giving about 3 · n/10 = 3n/10 elements ≤ x. So the recursive call in step 5 is on at most about 7n/10 elements (the slides use the looser bound 3n/4). Counting only the medians gives n/10.","ref":"CLRS 9.3","slide":23},
{"id":"L9-14","topic":"L9","type":"mc","q":"Which recurrence does the lecture give for the worst-case running time of SELECT (groups of 5)?","options":["T(n) ≤ T(n/5) + T(3n/4) + Θ(n)","T(n) ≤ T(3n/4) + Θ(n)","T(n) ≤ T(n/5) + T(4n/5) + Θ(n)","T(n) ≤ 2T(n/2) + Θ(n)"],"answer":0,"explain":"T(n/5) is the recursive call that finds the median of the ⌈n/5⌉ medians, and T(3n/4) is the recursion on one side of the partition, which has at most 3n/4 elements for large n (CLRS: 7n/10 + 6). Dropping the T(n/5) term forgets the median-of-medians call.","ref":"CLRS 9.3","slide":24},
{"id":"L9-15","topic":"L9","type":"tf","q":"The SELECT recurrence T(n) ≤ T(n/5) + T(3n/4) + Θ(n) solves to O(n) because 1/5 + 3/4 < 1.","answer":true,"explain":"Substituting T(n) ≤ cn gives cn/5 + 3cn/4 + Θ(n) = 19cn/20 + Θ(n) ≤ cn for large c: the work per level shrinks by the factor 19/20, so the Θ(n) at the root dominates.","ref":"CLRS 9.3","slide":25},
{"id":"L9-16","topic":"L9","type":"tf","q":"The worst-case linear-time SELECT needs random choices; without randomization its O(n) bound holds only in expectation.","answer":false,"explain":"SELECT is completely deterministic: choosing the median of the group medians as the pivot guarantees a good split, so its running time is O(n) in the worst case. RANDOMIZED-SELECT is the algorithm with only an expected O(n) bound.","ref":"CLRS 9.3","slide":17},
{"id":"L9-17","topic":"L9","type":"ms","q":"Which statements about the worst-case linear-time SELECT (groups of 5) are correct?","options":["Finding the median of every group takes O(n) time in total, since each group has O(1) elements.","It makes a recursive call to find the median of the ⌈n/5⌉ group medians.","After partitioning around x, it recurses on at most one side.","After partitioning around x, it must recurse on both sides.","Its pivot x is always the exact median of the n elements."],"answer":[0,1,2],"explain":"Steps 2 and 3 sort the 5-element groups in O(1) each and recursively select the median of the medians. Step 5 recurses on only the side that contains the answer (or returns x if i = k). x is only guaranteed to be near the middle (about 3n/10 elements on each side), not the exact median.","ref":"CLRS 9.3","slide":22},
{"id":"L9-18","topic":"L9","type":"tf","q":"If the pivot of quicksort is chosen as the median, found with the worst-case linear-time SELECT, quicksort runs in Θ(n lg n) time in the worst case.","answer":true,"explain":"Finding the median and partitioning cost O(n), and the split is always even, so T(n) = 2T(n/2) + O(n) = O(n lg n) in the worst case (the constant factors are large in practice).","ref":"CLRS 9.3","slide":27},
{"id":"L9-19","topic":"L9","type":"mc","q":"Given n numbers, we want the i largest in sorted order, using comparisons. Which method has the best asymptotic worst-case running time (for general i)?","options":["Use SELECT to find the i-th largest, partition around it, then sort the i largest: Θ(n + i lg i)","Build a max-heap, then call EXTRACT-MAX i times: Θ(n + i lg n)","Sort all n numbers with merge sort and list the i largest: Θ(n lg n)","Run SELECT once for each of the i ranks: Θ(i·n)"],"answer":0,"explain":"Θ(n + i lg i) is never worse than the others: i lg i ≤ i lg n, and both n and i lg i are O(n lg n). The heap method is close, but it pays lg n per extraction instead of lg i.","ref":"CLRS Prob 9-1","slide":26},
{"id":"L9-20","topic":"L9","type":"ms","q":"Which algorithms find their answer in O(n) WORST-CASE time on n elements?","options":["MINIMUM (a single scan)","Simultaneous min and max by pairs","SELECT with median-of-medians pivots","RANDOMIZED-SELECT","Selecting the median by first sorting with heapsort"],"answer":[0,1,2],"explain":"MINIMUM uses n − 1 comparisons, the pairwise min-max uses at most 3⌊n/2⌋, and SELECT is worst-case linear. RANDOMIZED-SELECT is linear only in expectation (Θ(n²) worst case), and sorting first costs Θ(n lg n).","ref":"CLRS 9.1–9.3","slide":28},
{"id":"L9-21","topic":"L9","type":"ms","q":"Which of these recurrences have solution O(n)?","options":["T(n) = T(9n/10) + Θ(n)","T(n) = T(n/5) + T(3n/4) + Θ(n)","T(n) = T(n/2) + Θ(n)","T(n) = T(n − 1) + Θ(n)","T(n) = 2T(n/2) + Θ(n)"],"answer":[0,1,2],"explain":"The first three shrink the total problem size by a constant factor at each level, so their costs form a decreasing geometric series dominated by the root's Θ(n). T(n−1) + Θ(n) is Θ(n²) (RANDOMIZED-SELECT's worst case), and 2T(n/2) + Θ(n) is Θ(n lg n).","ref":"CLRS 9.2–9.3","slide":26},
{"id":"L10-01","topic":"L10","type":"tf","q":"In the tree shown, every node's key is greater than its left child's key and less than its right child's key. Therefore the tree shown is a binary search tree.","answer":false,"explain":"The BST property is about whole subtrees: every key in x's left subtree must be ≤ x.key. Key 12 lies in the left subtree of the root 10, so the property fails even though each parent–child pair looks fine. An inorder walk prints 2, 5, 12, 10, 15, which is not sorted.","ref":"CLRS 12.1","slide":4,"tree":"10(5(2,12),15)"},
{"id":"L10-02","topic":"L10","type":"tf","q":"`INORDER-TREE-WALK` on an n-node binary search tree takes Θ(n) time, no matter what the tree's height is.","answer":true,"explain":"The walk visits and prints every node exactly once and does constant work per node (plus one call per NIL child), so it takes Θ(n) time for any shape, from a balanced tree to a single path.","ref":"CLRS 12.1","slide":10},
{"id":"L10-03","topic":"L10","type":"mc","q":"What does a postorder tree walk print for the tree shown?","options":["40, 20, 10, 30, 25, 60, 70, 65","10, 20, 25, 30, 40, 60, 65, 70","10, 25, 30, 20, 65, 70, 60, 40","10, 30, 25, 20, 70, 65, 60, 40"],"answer":2,"explain":"Postorder prints left subtree, right subtree, then the node: 10, then the subtree 30(25) as 25, 30, then 20; the right side gives 65, 70, 60; the root 40 comes last. The first option is the preorder walk and the second is the inorder (sorted) walk.","ref":"CLRS 12.1","slide":8,"tree":"40(20(10,30(25,)),60(,70(65,)))"},
{"id":"L10-04","topic":"L10","type":"mc","q":"A preorder walk of a binary search tree with distinct keys prints `8, 3, 1, 6, 4, 7, 10, 14, 13`. What does a postorder walk of the same tree print?","options":["1, 3, 4, 6, 7, 8, 10, 13, 14","1, 4, 7, 6, 3, 13, 14, 10, 8","1, 4, 6, 7, 3, 13, 14, 10, 8","13, 14, 10, 7, 4, 6, 1, 3, 8"],"answer":1,"explain":"The first preorder key, 8, is the root; the following keys smaller than 8 (3, 1, 6, 4, 7) form the left subtree and the rest (10, 14, 13) the right subtree, recursively. That gives 8(3(1, 6(4, 7)), 10(, 14(13))), whose postorder is 1, 4, 7, 6, 3, 13, 14, 10, 8. The first option is just the sorted (inorder) order.","ref":"CLRS 12.1","slide":9},
{"id":"L10-05","topic":"L10","type":"mc","q":"`TREE-SEARCH(T.root, 9)` runs on the tree shown. Which keys does it compare with 9, in order?","options":["15, 6, 7, 9","15, 6, 3, 4, 7, 13, 9","2, 3, 4, 6, 7, 9","15, 6, 7, 13, 9"],"answer":3,"explain":"Search follows a single root-to-node path: 9 < 15 go left, 9 > 6 go right, 9 > 7 go right, 9 < 13 go left, found 9. It never backtracks or scans in sorted order, and it cannot skip 13, because 9 is 13's child, not 7's.","ref":"CLRS 12.2","slide":13,"tree":"15(6(3(2,4),7(,13(9,))),18(17,20))"},
{"id":"L10-06","topic":"L10","type":"mc","q":"In the tree shown, what key does `TREE-PREDECESSOR` return for the node with key 9?","options":["7","13","6","4"],"answer":0,"explain":"Node 9 has no left subtree, so go up until you arrive from a right child: 9 is the left child of 13 (keep going), and 13 is the right child of 7, so the predecessor is 7. Its parent 13 is larger than 9, so 13 is the successor, not the predecessor.","ref":"CLRS 12.2","slide":29,"tree":"15(6(3(2,4),7(,13(9,))),18(17,20))"},
{"id":"L10-07","topic":"L10","type":"tf","q":"If node x in a BST has a nonempty right subtree, then `TREE-SUCCESSOR(x)` is x's right child.","answer":false,"explain":"The successor is the minimum (leftmost node) of x's right subtree, which is the right child only when that child has no left child. For example, with root 15 whose right child is 18 and 18's left child is 17, the successor of 15 is 17.","ref":"CLRS 12.2","slide":29},
{"id":"L10-08","topic":"L10","type":"ms","q":"For the tree shown, which statements are true? (Select all that apply.)","options":["The successor of 7 is 9.","The predecessor of 15 is 13.","The successor of 4 is 6.","The predecessor of 17 is 18.","The successor of 13 is 18."],"answer":[0,1,2],"explain":"7's successor is the minimum of its right subtree 13(9), which is 9; 15's predecessor is the maximum of its left subtree, 13; 4 has no right subtree and is a right child of 3, which is a left child of 6, so its successor is 6. 17 has no left subtree and is a left child of 18, a right child of 15, so its predecessor is 15; 13's successor is 15, the first ancestor reached from a left child.","ref":"CLRS 12.2","slide":28,"tree":"15(6(3(2,4),7(,13(9,))),18(17,20))"},
{"id":"L10-09","topic":"L10","type":"mc","q":"The keys 1 through 7 are inserted with `TREE-INSERT` into an initially empty BST. Which insertion order produces a tree of height 6, in which every node has at most one child?","options":["`4, 2, 6, 1, 3, 5, 7`","`2, 1, 3, 4, 5, 6, 7`","`1, 7, 2, 6, 3, 5, 4`","`4, 1, 2, 3, 5, 6, 7`"],"answer":2,"explain":"A single path results exactly when each key is smaller than all later keys or larger than all later keys; 1, 7, 2, 6, 3, 5, 4 alternates between the extremes, giving a zig-zag path of height 6. In 2, 1, 3, … the root 2 gets two children, so the height is only 5; 4, 2, 6, 1, 3, 5, 7 gives a perfectly balanced tree of height 2.","ref":"CLRS 12.3","slide":20},
{"id":"L10-10","topic":"L10","type":"mc","q":"`TREE-INSERT` adds a node with key 12 to the tree shown. Where does the new node end up?","options":["As the left child of 13","As the right child of 9","Between 7 and 13, with 13 becoming its right child","As the left child of 9"],"answer":1,"explain":"Insertion follows the search path 15 → 6 → 7 → 13 → 9 and attaches the new node where the search falls off the tree: 12 > 9 and 9 has no right child, so 12 becomes 9's right child. Insertion never splices a new node between existing nodes, and 13's left child is already taken by 9.","ref":"CLRS 12.3","slide":19,"tree":"15(6(3(2,4),7(,13(9,))),18(17,20))"},
{"id":"L10-11","topic":"L10","type":"tf","q":"`TREE-INSERT` always attaches the new node as a leaf and never moves any node that is already in the tree.","answer":true,"explain":"It walks down from the root with a trailing pointer y until x becomes NIL, then makes z a child of y in place of that NIL. Only one child pointer of y changes, so existing nodes keep their positions.","ref":"CLRS 12.3","slide":17},
{"id":"L10-12","topic":"L10","type":"mc","q":"`TREE-DELETE` (CLRS, using `TRANSPLANT`) removes 15, the root of the tree shown. What does a preorder walk of the resulting tree print?","options":["17, 6, 3, 2, 4, 7, 13, 9, 18, 20","13, 6, 3, 2, 4, 7, 9, 18, 17, 20","6, 3, 2, 4, 7, 13, 9, 18, 17, 20","18, 17, 6, 3, 2, 4, 7, 13, 9, 20"],"answer":0,"explain":"15 has two children, so y = TREE-MINIMUM(15.right) = 17. Since 17 is not 15's right child, 17 is first replaced by its right child (NIL), takes 18 as its right child, and then replaces 15 and adopts 6 as its left child: 17(6(…), 18(, 20)). The second option uses the predecessor 13, which also gives a valid BST, but it is not what TREE-DELETE does.","ref":"CLRS 12.3","slide":34,"tree":"15(6(3(2,4),7(,13(9,))),18(17,20))"},
{"id":"L10-13","topic":"L10","type":"mc","q":"`TREE-DELETE` removes the node with key 7 from the tree shown. What is the right child of node 6 afterwards?","options":["9","4","NIL (6 no longer has a right child)","13"],"answer":3,"explain":"Node 7 has no left child, so TREE-DELETE calls TRANSPLANT(T, z, z.right): the whole subtree rooted at 13 (with 9 under it) moves up into 7's place. Finding the successor (9) is only needed when z has two children.","ref":"CLRS 12.3","slide":32,"tree":"15(6(3(2,4),7(,13(9,))),18(17,20))"},
{"id":"L10-14","topic":"L10","type":"ms","q":"Which statements about CLRS `TREE-DELETE(T, z)` and `TRANSPLANT(T, u, v)` are true? (Select all that apply.)","options":["When z has two children, its successor y has no left child.","When z has two children, y is found as `TREE-MINIMUM(z.right)`.","`TRANSPLANT(T, u, v)` also sets v's left and right children to u's children.","If z has two children and its successor is z.right itself, y keeps its own right subtree and only takes over z's left subtree.","Deleting a node with exactly one child requires finding its successor first."],"answer":[0,1,3],"explain":"The successor of a node with two children is the leftmost node of its right subtree, so it has no left child; when it is z.right, it simply replaces z and takes z.left. TRANSPLANT only rewires the link between u's parent and v (and v.p); TREE-DELETE sets y.left and y.right itself. A node with one child is replaced directly by that child.","ref":"CLRS 12.3","slide":36},
{"id":"L10-15","topic":"L10","type":"tf","q":"When deleting a node z with two children from a BST, replacing z by its predecessor (the maximum of z's left subtree) instead of its successor also leaves a valid BST.","answer":true,"explain":"The predecessor is larger than everything else in z's left subtree and smaller than everything in z's right subtree, so it can take z's place. It has no right child, so removing it from its old spot is the easy case. Alternating between the two choices is sometimes suggested to keep the tree more balanced.","ref":"CLRS 12.3","slide":31},
{"id":"L10-16","topic":"L10","type":"tf","q":"Deleting 6 from the tree shown with `TREE-DELETE` and then inserting 6 again with `TREE-INSERT` gives back exactly the original tree.","answer":false,"explain":"Deleting 6 (two children, successor 7 is its right child) puts 7 in 6's place. Re-inserting 6 then follows 15 → 7 → 3 → 4 and makes 6 the right child of 4, a leaf, so the shape differs from the original.","ref":"CLRS 12.3","slide":33,"tree":"15(6(3(2,4),7(,13(9,))),18(17,20))"},
{"id":"L10-17","topic":"L10","type":"tf","q":"Sorting n numbers by inserting them one at a time into an empty BST and then doing an inorder walk takes Θ(n lg n) time in the worst case.","answer":false,"explain":"If the input is already sorted, each insertion walks down a single path, so the insertions cost 1 + 2 + … + (n−1) = Θ(n²). Θ(n lg n) is the best case (and the average case for random input), not the worst case.","ref":"CLRS Ex 12.3-3","slide":21},
{"id":"L10-18","topic":"L10","type":"mc","q":"The keys `5, 2, 9, 7, 1, 8, 6` are inserted into an empty BST in that order. When 6 (the last key) is inserted, which keys is it compared with?","options":["5, 9, 7, 8","5, 9, 7","All six keys already in the tree","5, 2, 9, 7"],"answer":1,"explain":"6 > 5 goes right to 9, 6 < 9 goes left to 7, 6 < 7 goes left to an empty spot. These are exactly the pivots quicksort would compare 6 with (5, then 9, then 7). Key 8 sits in 7's right subtree and is never compared with 6.","ref":"CLRS 12.4","slide":23},
{"id":"L10-19","topic":"L10","type":"mc","q":"BST sort (insert all keys, then do an inorder walk) makes the same comparisons as quicksort. Why is quicksort still usually preferred?","options":["Quicksort sorts in place with smaller constants and does not build a linked data structure.","Quicksort's worst-case running time is asymptotically better than BST sort's.","BST sort is not a comparison sort, so the Ω(n lg n) lower bound does not cover it.","BST sort's average-case running time is Θ(n²)."],"answer":0,"explain":"Both average Θ(n lg n) and both are Θ(n²) in the worst case, so the asymptotics don't separate them. Quicksort wins on constants, needs no extra node storage and works in place.","ref":"CLRS 12.4","slide":25},
{"id":"L10-20","topic":"L10","type":"tf","q":"If n distinct keys are inserted into an empty BST in a uniformly random order, the expected height of the resulting tree is O(lg n).","answer":true,"explain":"CLRS Theorem 12.4 shows that a randomly built BST on n distinct keys has expected height O(lg n). Only unlucky orders, such as sorted input, produce height near n.","ref":"CLRS 12.4","slide":21},
{"id":"L10-21","topic":"L10","type":"tf","q":"In a binary search tree, the node holding the minimum key is always a leaf.","answer":false,"explain":"The minimum is the leftmost node, found by following left pointers until NIL. It has no left child, but it may have a right child. For example, insert 2 and then 5: the minimum 2 is the root and has right child 5.","ref":"CLRS 12.2","slide":16},
{"id":"L10-22","topic":"L10","type":"tf","q":"The iterative `TREE-SEARCH` examines exactly the same nodes as the recursive version, and on most computers it runs faster.","answer":true,"explain":"Both follow the same single root-to-node path. The iterative version just unrolls the tail recursion into a while loop, which avoids function-call overhead, so CLRS notes it is more efficient on most computers.","ref":"CLRS 12.2","slide":15},
{"id":"L10-23","topic":"L10","type":"ms","q":"Consider a binary search tree with n nodes and height h (in edges). Which statements are true? (Select all that apply.)","options":["`TREE-SEARCH`, `TREE-MINIMUM` and `TREE-SUCCESSOR` each run in O(h) time.","h ≥ ⌊lg n⌋ for every such tree.","`INORDER-TREE-WALK` runs in O(h) time.","h ≤ ⌈lg n⌉ for every such tree.","The BST can serve as a min-priority queue with `INSERT`, `MINIMUM` and `EXTRACT-MIN` each taking O(h) time."],"answer":[0,1,4],"explain":"Each query follows one downward or upward path, so it is O(h). A binary tree of height h has at most 2^{h+1} − 1 nodes, which forces h ≥ ⌊lg n⌋, but h can be as large as n − 1, so no ⌈lg n⌉ upper bound holds. An inorder walk visits all n nodes, so it is Θ(n), not O(h).","ref":"CLRS 12.2","slide":37},
{"id":"L11-01","topic":"L11","type":"tf","q":"In a red-black tree, a red node can have exactly one non-NIL child.","answer":false,"explain":"That child would have to be black (a red node's children are black), so the path through it would contain at least one more black node than the path to the red node's NIL child, breaking the equal-black-count property. A red node therefore has either two NIL children or two black non-NIL children.","ref":"CLRS 13.1","slide":9},
{"id":"L11-02","topic":"L11","type":"tf","q":"The black-height bh(x) of a black node x counts x itself, along with the black nodes below it on a path to a leaf.","answer":false,"explain":"bh(x) is the number of black nodes on any path from x down to a leaf, not counting x but counting the black NIL leaf. For example, a black node whose two children are NIL has bh = 1 (only the NIL leaf is counted), not 2.","ref":"CLRS 13.1","slide":11},
{"id":"L11-03","topic":"L11","type":"tf","q":"`LEFT-ROTATE` and `RIGHT-ROTATE` preserve the binary-search-tree property: an inorder walk prints the same key sequence before and after a rotation.","answer":true,"explain":"A left rotation on x with right child y turns x(α, y(β, γ)) into y(x(α, β), γ). The inorder order α, x, β, y, γ is unchanged; only the shape changes.","ref":"CLRS 13.2","slide":22},
{"id":"L11-04","topic":"L11","type":"tf","q":"A rotation in a red-black tree takes O(lg n) time, because the pointers of all ancestors of the rotated node must be updated.","answer":false,"explain":"`LEFT-ROTATE` changes only a constant number of pointers (x.right, y.left's parent, y's parent, the parent's child pointer, y.left and x.p), so it runs in O(1) time. Ancestors above the rotated pair are untouched apart from one child pointer.","ref":"CLRS 13.2","slide":25},
{"id":"L11-05","topic":"L11","type":"tf","q":"In any red-black tree, the longest simple path from a node x down to a descendant leaf is at most twice as long as the shortest such path.","answer":true,"explain":"Every path from x to a leaf contains bh(x) black nodes, so the shortest path has length at least bh(x). Red nodes cannot be adjacent, so at least half of the nodes on the longest path are black, giving height(x) ≤ 2·bh(x).","ref":"CLRS Ex 13.1-5","slide":39},
{"id":"L11-06","topic":"L11","type":"tf","q":"`RB-INSERT` colors the new node black, because a black node can never create two red nodes in a row.","answer":false,"explain":"The new node is colored red. A black node would add one black node to every path through it, breaking the equal-black-count property, which is much harder to repair; a red node can only break the root-is-black or no-red-red rules, which `RB-INSERT-FIXUP` repairs.","ref":"CLRS 13.3","slide":20},
{"id":"L11-07","topic":"L11","type":"tf","q":"The tree shown is a valid red-black tree (NIL leaves are omitted and are black).","answer":true,"explain":"The root 20 is black, each red node (5, 15, 30, 35, 50) has only black children (or NIL leaves), and every path from the root to a NIL leaf passes through exactly 2 black nodes below the root, so bh(20) = 2. The keys are also in BST order.","ref":"CLRS 13.1","slide":19,"tree":"20B(10B(5R,15R),30R(25B,40B(35R,50R)))"},
{"id":"L11-08","topic":"L11","type":"tf","q":"The tree shown satisfies all five red-black properties (NIL leaves are omitted and are black).","answer":false,"explain":"Node 15 is black and has a single black child 10: the path 15 → 10 → NIL contains 2 black nodes below 15, but the path from 15 to its empty right side contains only 1 (the NIL). The root is black and no red node has a red child; the only violation is the unequal black count.","ref":"CLRS 13.1","slide":19,"tree":"30B(15B(10B,),45B(40R,50R))"},
{"id":"L11-09","topic":"L11","type":"tf","q":"If every red node of a red-black tree is absorbed into its black parent (its children become the parent's children), a black node can end up with as many as five children.","answer":false,"explain":"A black node has two children, and each red child contributes its own two children instead of itself, so the new degree is 2, 3 or 4. The result is a 2-3-4 tree in which all leaves have the same depth.","ref":"CLRS Ex 13.1-4","slide":19},
{"id":"L11-10","topic":"L11","type":"tf","q":"If every internal node of a red-black tree is black, the tree must be a perfect binary tree, with all of its NIL leaves at the same depth.","answer":true,"explain":"With no red nodes, the black count on a root-to-leaf path equals the path's length. Since all such paths must have the same number of black nodes, all leaves are at the same depth, so the tree is perfect and has 2^{h} − 1 internal nodes.","ref":"CLRS 13.1","slide":9},
{"id":"L11-11","topic":"L11","type":"tf","q":"During red-black deletion, if the node that is removed from its position in the tree is red, none of the red-black properties can be violated.","answer":true,"explain":"Removing a red node changes no black counts, it cannot make two red nodes adjacent (its parent and its replacement child are both black), and a red node is never the root. Problems arise only when the removed node is black.","ref":"CLRS 13.4","slide":21},
{"id":"L11-12","topic":"L11","type":"tf","q":"In a red-black tree, the subtree rooted at any node x contains at least 2^{bh(x)} − 1 internal nodes.","answer":true,"explain":"This is the lemma proved by induction on height: each child has black-height at least bh(x) − 1, so the subtree has at least 2(2^{bh(x)−1} − 1) + 1 = 2^{bh(x)} − 1 internal nodes. Combined with bh(root) ≥ h/2 it gives h ≤ 2 lg(n + 1).","ref":"CLRS 13.1","slide":14},
{"id":"L11-13","topic":"L11","type":"mc","q":"What is the black-height of the root of the red-black tree shown? (NIL leaves are omitted and are black.)","options":["2","4","3","5"],"answer":2,"explain":"Along any path, e.g. 20 → 10 → 15 → NIL, the black nodes below the root are 10, 15 and NIL, so bh(20) = 3. Counting the root itself gives the wrong answer 4, and forgetting the NIL leaf gives 2.","ref":"CLRS 13.1","slide":11,"tree":"20B(10B(5B(1R,7R),15B),30B(25B,40R(35B,45B(,50R))))"},
{"id":"L11-14","topic":"L11","type":"mc","q":"The tree shown is meant to be a red-black tree (NIL leaves are omitted and are black). Which requirement does it violate?","options":["The root is black.","If a node is red, both of its children are black.","For each node, every path down to a descendant NIL leaf contains the same number of black nodes.","The keys satisfy the binary-search-tree property."],"answer":1,"explain":"Red node 25 has a red child 22. Black counts still agree: every path from the root to a NIL leaf has 2 black nodes below the root (for example 40 → 20 → 30 → 25 → 22 → NIL passes black 30 and NIL). The root is black and the keys are in BST order.","ref":"CLRS 13.1","slide":19,"tree":"40B(20R(10B,30B(25R(22R,),35R)),60B(50R,70R))"},
{"id":"L11-15","topic":"L11","type":"mc","q":"The tree shown is meant to be a red-black tree (NIL leaves are omitted and are black). Which requirement does it violate?","options":["The root is black.","If a node is red, both of its children are black.","For each node, every path down to a descendant NIL leaf contains the same number of black nodes.","The keys satisfy the binary-search-tree property."],"answer":3,"explain":"The coloring is fine (black root, no red–red pair, 2 black nodes below the root on every path), but 25 sits in the left subtree of 20 even though 25 > 20. A red-black tree must be a binary search tree first; an inorder walk gives 5, 10, 25, 20, 28, 30, 40, which is not sorted.","ref":"CLRS 13.1","slide":9,"tree":"20B(10B(5R,25R),30B(28R,40R))"},
{"id":"L11-16","topic":"L11","type":"mc","q":"`LEFT-ROTATE(T, x)` is applied to the tree shown, where x is the root 50. What does a preorder walk of the result print?","options":["50, 30, 60, 55, 70, 65, 80, 90","70, 60, 50, 30, 55, 65, 80, 90","70, 50, 30, 60, 55, 65, 80, 90","60, 50, 30, 55, 70, 65, 80, 90"],"answer":2,"explain":"y = x.right = 70 becomes the subtree root, x = 50 becomes y's left child, and y's old left subtree 60(55, 65) becomes x's right subtree: 70(50(30, 60(55, 65)), 80(, 90)). The first option is what `RIGHT-ROTATE` on 70 would give, not a left rotation at the root.","ref":"CLRS 13.2","slide":23,"tree":"50(30,70(60(55,65),80(,90)))"},
{"id":"L11-17","topic":"L11","type":"mc","q":"`RB-INSERT` adds key 3 to the red-black tree shown. What does `RB-INSERT-FIXUP` do?","options":["Nothing: 3's parent is black, so no property is violated.","Case 1 once: 5 and 15 become black and 10 becomes red; the loop then stops because 10's parent 20 is black.","Case 3: 5 becomes black, 10 becomes red, and `RIGHT-ROTATE` is applied at 10.","Case 2 followed by case 3, ending with 5 as the root of that subtree."],"answer":1,"explain":"3 becomes the red left child of red node 5, and the uncle 15 is red, so case 1 applies: recolor 5 and 15 black and 10 red, then set z = 10. Its parent 20 is black, so the loop ends after a single recoloring step with no rotation. Cases 2 and 3 apply only when the uncle is black.","ref":"CLRS 13.3","slide":29,"tree":"20B(10B(5R,15R),30B(25R,35R))"},
{"id":"L11-18","topic":"L11","type":"mc","q":"`RB-INSERT` adds key 35 to the red-black tree shown. Which sequence of `RB-INSERT-FIXUP` cases is executed?","options":["Case 1 only","Case 2, then case 3","Case 1, then case 3","Case 1, then case 2, then case 3","Case 1 twice"],"answer":3,"explain":"35 becomes the right child of red 30 whose uncle 50 is red: case 1 recolors 30 and 50 black and 40 red, and z moves to 40. Now 40 and its parent 20 are red, the uncle 70 is black and 40 is a right child: case 2 sets z = 20 and left-rotates there, and case 3 then recolors and right-rotates at 60.","ref":"CLRS 13.3","slide":34,"tree":"60B(20R(10B,40B(30R,50R)),70B)"},
{"id":"L11-19","topic":"L11","type":"mc","q":"`RB-INSERT` adds key 35 to the red-black tree shown. Which key is at the root when the insertion has finished?","options":["40","60","20","35"],"answer":0,"explain":"Case 1 recolors and moves z up to 40; case 2 left-rotates at 20, making 40 the left child of 60; case 3 colors 40 black and 60 red and right-rotates at 60, so 40 becomes the root with children 20 and 60. The new key 35 ends up as a red leaf under 30.","ref":"CLRS 13.3","slide":34,"tree":"60B(20R(10B,40B(30R,50R)),70B)"},
{"id":"L11-20","topic":"L11","type":"mc","q":"`RB-INSERT` adds key 7 to the red-black tree shown. After `RB-INSERT-FIXUP`, what does the left subtree of the root 20 look like?","options":["10 (black) with left child 5 (black), whose right child is 7 (red)","7 (black) with children 5 (red) and 10 (red)","10 (black) with left child 7 (red), whose left child is 5 (red)","7 (red) with children 5 (black) and 10 (black)"],"answer":1,"explain":"7 becomes the right child of red 5, and the uncle (10's right child) is NIL, which is black, so case 2 left-rotates at 5 and case 3 colors 7 black and 10 red and right-rotates at 10. The first option is a case-1 recoloring, which needs a red uncle. The third option stops after case 2 and still has two reds in a row.","ref":"CLRS 13.3","slide":32,"tree":"20B(10B(5R,),30B)"},
{"id":"L11-21","topic":"L11","type":"mc","q":"The keys 1, 2, 3, 4, 5, 6, 7, 8 are inserted in that order into an initially empty red-black tree with `RB-INSERT`. Which key is at the root at the end?","options":["2","5","3","4"],"answer":3,"explain":"Inserting 3 triggers case 3 and makes 2 the root; after that, 4 and 6 trigger case-1 recolorings and 5 and 7 trigger case-3 rotations lower in the tree. Inserting 8 first recolors (case 1), which makes 4 and 6 red, then a case-3 left rotation at the root 2 makes 4 the new root: 4(2(1, 3), 6(5, 7(, 8))). Unlike a plain BST, the tree does not degenerate into a path.","ref":"CLRS 13.3","slide":37},
{"id":"L11-22","topic":"L11","type":"mc","q":"What is the smallest possible number of internal (non-NIL) nodes in a red-black tree whose root has black-height 3?","options":["3","15","7","63"],"answer":2,"explain":"A subtree rooted at x has at least 2^{bh(x)} − 1 internal nodes, so at least 2^{3} − 1 = 7, and a perfect all-black tree with 7 nodes achieves it. The value 63 = 2^{2·3} − 1 is the largest possible count, reached when red and black levels alternate.","ref":"CLRS Ex 13.1-6","slide":14},
{"id":"L11-23","topic":"L11","type":"mc","q":"`RB-INSERT-FIXUP` is running on the tree shown with z = 10; z and its parent 20 are both red. What does the next step do?","options":["Color 20 and 40 black and 30 red, then set z = 30.","Set z = 20 and call `LEFT-ROTATE(T, 20)`.","Color 10 black and stop.","Color 20 black and 30 red, then call `RIGHT-ROTATE(T, 30)`."],"answer":3,"explain":"z's parent 20 is a left child, the uncle 40 is black and z is a left child, so this is case 3: recolor the parent black and the grandparent red, then rotate right at the grandparent. That leaves 20 black at the top with red children 10 and 30, and the loop ends. Recoloring with the uncle (case 1) requires a red uncle; case 2 applies only when z is a right child.","ref":"CLRS 13.3","slide":40,"tree":"30B(20R(10R(5B,15B),25B),40B(,45R))"},
{"id":"L11-24","topic":"L11","type":"ms","q":"`RB-INSERT` has just placed a new red node z by ordinary BST insertion, before `RB-INSERT-FIXUP` runs. Which red-black properties might be violated at this moment? (Select all that apply.)","options":["The root is black.","If a node is red, both of its children are black.","For each node, every path down to a descendant NIL leaf contains the same number of black nodes.","Every leaf (NIL) is black.","Every node is either red or black."],"answer":[0,1],"explain":"If the tree was empty, z is a red root; if z's parent is red, there are two reds in a row. Adding a red node with two black NIL children replaces one black NIL with a red node plus black NILs, so no black count changes.","ref":"CLRS 13.3","slide":28},
{"id":"L11-25","topic":"L11","type":"ms","q":"During red-black deletion, suppose the node removed from its position is black. Before any fix-up, which red-black properties might now be violated? (Select all that apply.)","options":["The root is black.","If a node is red, both of its children are black.","For each node, every path down to a descendant NIL leaf contains the same number of black nodes.","Every leaf (NIL) is black.","Every node is either red or black."],"answer":[0,1,2],"explain":"If the root is removed and a red child replaces it, the root is red; the replacement child and the new parent may both be red; and every path that went through the removed black node now has one fewer black node. Node colors stay red or black and NIL leaves stay black.","ref":"CLRS 13.4","slide":21},
{"id":"L11-26","topic":"L11","type":"ms","q":"Which statements about the cases of `RB-INSERT-FIXUP` (with z.p a left child) are correct? (Select all that apply.)","options":["Case 1 (red uncle) only recolors nodes and moves z two levels up; it performs no rotation.","Case 2 is a left rotation at z.p that turns the configuration into case 3.","Case 3 colors z.p black and z.p.p red, then right-rotates at z.p.p, after which the loop ends.","Case 3 is the case used when z's uncle is red.","After case 3, the loop may continue with case 1 higher up in the tree."],"answer":[0,1,2],"explain":"Only case 1 repeats the loop, pushing the red–red violation up two levels at a time, which is why fix-up does O(lg n) recolorings but at most two rotations. Cases 2 and 3 apply when the uncle is black; after case 3, z.p is black, so the while condition fails and the loop ends.","ref":"CLRS 13.3","slide":33},
{"id":"L11-27","topic":"L11","type":"ms","q":"For the red-black tree shown (NIL leaves are omitted and are black), which black-heights are stated correctly? (Select all that apply.)","options":["bh(38) = 3","bh(8) = 2","bh(19) = 3","bh(12) = 2","bh(50) = 1"],"answer":[0,1,4],"explain":"bh counts black nodes below x down to the NIL leaf, including the NIL. From 38: 19, 3, NIL gives 3; from red 8: 3, NIL gives 2; from 50: NIL only gives 1 (its children are red). 19 has bh 2 (8 is red, then 3 and NIL), and 12 has bh 1 because its only child 10 is red.","ref":"CLRS 13.1","slide":11,"tree":"38B(19B(8R(3B,12B(10R,)),31B),45B(41B,50B(47R,60R)))"}
]

<script>

const TOPICS = [
  { id: 'L1', t: 'Introduction', d: 'Aug 21', ch: 'CLRS 2.1–2.2, 3.1' },

  { id: 'L6', t: 'Heapsort', d: 'Sep 4', ch: 'CLRS 6' },
  { id: 'L7', t: 'Quicksort', d: 'Sep 11', ch: 'CLRS 7' },

];

const BY_ID = new Map(BANK.map(q => [q.id, q]));
const DAY = 864e5;

const KIND = { tf: 'True or false', mc: 'Choose one', ms: 'Select all that apply' };
const LETTERS = 'ABCDE';

// ---------- storage (every access guarded: private mode / blocked storage must still work) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('algoquiz:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('algoquiz:' + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },

function cleanProgress(p) {

function cleanSession(s) {

// ---------- helpers ----------
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmt(s) { // plain text + `code`, ^{sup}, _{sub}, newlines
  return String(s).split('`').map((part, i) => {
    if (i % 2) return '<code>' + esc(part) + '</code>';
    let h = esc(part), prev;
    do { prev = h; h = h.replace(/\^\{([^{}]*)\}/g, '<sup>$1</sup>').replace(/_\{([^{}]*)\}/g, '<sub>$1</sub>'); } while (h !== prev);
    return h.replace(/\n/g, '<br>');
  }).join('');
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
function clock(ms) { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
const sameSet = (a, b) => a.length === b.length && [...a].sort().every((v, i) => v === [...b].sort()[i]);
function isRight(q, a) {
  if (a === undefined || a === null) return false;
  if (q.type === 'ms') return Array.isArray(a) && a.length > 0 && sameSet(a, q.answer);
  return a === q.answer;
}
function answerText(q, a, perm) {
  if (a === undefined || a === null || (Array.isArray(a) && !a.length)) return '—';
  if (q.type === 'tf') return a ? 'True' : 'False';
  const list = (Array.isArray(a) ? a : [a]).map(i => [perm ? perm.indexOf(i) : i, i]).sort((x, y) => x[0] - y[0]);
  return list.map(([k, i]) => `${perm ? LETTERS[k] + '. ' : ''}${fmt(q.options[i])}`).join('; ');
}

// ---------- spaced repetition (Leitner boxes) ----------
function record(id, ok) {
  const p = progress[id] || (progress[id] = { box: 0, due: 0, seen: 0, right: 0, last: null, flag: false });
  p.seen++;
  if (ok) p.right++;
  p.box = ok ? Math.min(5, Math.max(1, p.box) + 1) : 1;
  p.due = Date.now() + INTERVALS[p.box] * DAY;
  p.last = ok;
  saveProgress();
}
const P = id => progress[id] || { box: 0, due: 0, seen: 0, right: 0, last: null, flag: false };
const isDue = id => P(id).seen > 0 && P(id).due <= Date.now();
const isMistake = id => P(id).last === false;
function topicStats(tid) {
  const qs = BANK.filter(q => q.topic === tid);
  let seen = 0, mastered = 0, right = 0, tries = 0;
  for (const q of qs) { const p = P(q.id); if (p.seen) seen++; if (p.box >= MASTERED) mastered++; right += p.right; tries += p.seen; }
  return { n: qs.length, seen, mastered, acc: pct(right, tries), tries };
}

// ---------- building a session ----------
function typeOk(q) { return prefs.types === 'all' || (prefs.types === 'tf' ? q.type === 'tf' : q.type !== 'tf'); }
function pool(topics) { return BANK.filter(q => topics.includes(q.topic) && typeOk(q)).map(q => q.id); }
function take(ids) { return prefs.len === 'all' ? ids : ids.slice(0, prefs.len); }
function smartPick(ids) {
  // weakest first: last answer wrong, then never seen, then due, then the rest; random within each tier
  const now = Date.now();
  const tier = id => { const p = P(id); return p.last === false ? 0 : !p.seen ? 1 : p.due <= now ? 2 : 3; };
  return shuffle(take(shuffle(ids.slice()).sort((a, b) => tier(a) - tier(b))));
}
function mockPick() {
  // stratified across lectures, like the real midterm's 10 T/F + 10 MC section
  const pick = (filter, n) => {
    const byTopic = TOPICS.map(t => shuffle(BANK.filter(q => q.topic === t.id && filter(q)).map(q => q.id)));
    const out = [];
    for (let r = 0; out.length < n && byTopic.some(l => l.length); r++) for (const l of shuffle(byTopic.slice())) if (l.length && out.length < n) out.push(l.pop());
    return out;
  };
  return [...pick(q => q.type === 'tf', MOCK.tf), ...shuffle(pick(q => q.type !== 'tf', MOCK.mc))];
}
function start(mode, ids, extra = {}) {
  if (!ids.length) return;
  session = { mode, ids, i: 0, ans: {}, done: {}, perm: {}, elapsed: 0, limit: 0, finished: false, ...extra };
  for (const id of ids) { const q = BY_ID.get(id); if (q.type !== 'tf') session.perm[id] = shuffle([...q.options.keys()]); }
  if (mode === 'mock') session.limit = MOCK.minutes * 60e3;
  saveSession();
  go('quiz');
}
function startMode(mode, topicOverride) {
  const topics = topicOverride || prefs.topics;
  const all = BANK.map(q => q.id);
  if (mode === 'practice') return start('practice', smartPick(pool(topics)), { topics });
  if (mode === 'test') return start('test', take(shuffle(pool(topics))), { topics });
  if (mode === 'mock') return start('mock', mockPick());
  if (mode === 'mistakes') return start('mistakes', shuffle(all.filter(isMistake)));
  if (mode === 'due') return start('due', take(all.filter(isDue).sort((a, b) => P(a).box - P(b).box || P(a).due - P(b).due)));
  if (mode === 'flagged') return start('flagged', all.filter(id => P(id).flag));
}
const graded = () => session && (session.mode === 'test' || session.mode === 'mock'); // no feedback until the end

// ---------- tree figures: preorder "KEY[R|B](LEFT,RIGHT)" ----------
function parseTree(s) {
  let i = 0;
  function node() {
    let tok = '';
    while (i < s.length && !'(),'.includes(s[i])) tok += s[i++];
    tok = tok.trim();
    let n = null;
    if (tok) {
      const m = /^(.+?)([RB])$/.exec(tok);
      n = m ? { key: m[1], color: m[2] } : { key: tok, color: null };
    }
    if (s[i] === '(') {
      i++;
      const l = node(); let r = null;
      if (s[i] === ',') { i++; r = node(); }
      if (s[i] === ')') i++;
      if (n) { n.l = l; n.r = r; }
    }
    return n;
  }
  return node();
}
function treeSVG(s) {
  const root = parseTree(s);
  if (!root) return '';
  const nodes = [], edges = [];
  let x = 0, depth = 0, colored = false;
  (function walk(n, d) {
    if (!n) return;
    walk(n.l, d + 1); n.x = x++; n.d = d; depth = Math.max(depth, d); nodes.push(n); if (n.color) colored = true; walk(n.r, d + 1);
    for (const c of [n.l, n.r]) if (c) edges.push([n, c]);
  })(root, 0);
  const W = 42, H = 58, R = 17, pad = 22;
  const w = Math.max(1, x - 1) * W + 2 * pad, h = depth * H + 2 * pad;
  const X = n => pad + n.x * W, Y = n => pad + n.d * H;
  const svg = `<svg class="tree" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${colored ? 'Red-black' : 'Binary'} tree, preorder ${esc(s)}">`
    + edges.map(([a, b]) => `<line x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}"/>`).join('')
    + nodes.map(n => `<g class="n${n.color || 'P'}"><circle cx="${X(n)}" cy="${Y(n)}" r="${R}"/><text x="${X(n)}" y="${Y(n)}"${n.key.length > 3 ? ' style="font-size:10px"' : ''}>${esc(n.key)}</text></g>`).join('')
    + '</svg>';
  const legend = colored ? `<div class="legend"><i style="background:var(--node-b)"></i>black<i style="background:var(--node-r)"></i>red · NIL leaves not drawn (they are black)</div>` : '';
  return `<div class="figure">${svg}${legend}</div>`;
}

function curQ() { return BY_ID.get(session.ids[session.i]); }
