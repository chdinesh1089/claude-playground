<style>

  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --raised: #222220; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --border: rgba(255,255,255,.12); --accent: #3987e5; --accent-ink: #ffffff; --accent-soft: rgba(57,135,229,.16);
    --good: #3fb871; --good-soft: rgba(63,184,113,.15); --bad: #ef6a5f; --bad-soft: rgba(239,106,95,.14);
    --warn: #e0a440; --track: rgba(255,255,255,.10);

  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --raised: #222220; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --border: rgba(255,255,255,.12); --accent: #3987e5; --accent-ink: #ffffff; --accent-soft: rgba(57,135,229,.16);
  --good: #3fb871; --good-soft: rgba(63,184,113,.15); --bad: #ef6a5f; --bad-soft: rgba(239,106,95,.14);

  --node-b: #000000; --node-r: #e0473c; --node-p: #2a2a28; --node-ink: #ffffff; --edge: #8f8e86;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 20px 16px 64px; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; }
code { background: var(--track); padding: .05em .35em; border-radius: 5px; overflow-wrap: anywhere; }
sup, sub { font-size: .72em; line-height: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; min-height: 36px; }
.top .grow { flex: 1; min-width: 0; }
.back { font-size: 14px; font-weight: 600; text-decoration: none; }
.back:hover { text-decoration: underline; }
.icon { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; display: grid; place-items: center; flex: none; }
.icon svg { width: 18px; height: 18px; }
h1 { font-size: 24px; line-height: 1.25; margin: 0 0 4px; }
h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 28px 0 10px; }
.sub { color: var(--ink-2); margin: 0; }
.small { font-size: 13px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--ink-2); }
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.mode { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.mode:hover:not(:disabled) { border-color: var(--accent); }
.mode:disabled { opacity: .5; cursor: default; }
.mode b { display: block; }
.mode span { font-size: 13px; color: var(--ink-2); }
.mode.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mode.primary span { color: inherit; opacity: .9; }
.resume { display: flex; align-items: center; gap: 12px; margin-top: 18px; border-color: var(--accent); background: var(--accent-soft); }
.resume .grow { flex: 1; }
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.topic { position: relative; display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px 12px 44px; cursor: pointer; }
.topic:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.topic input { position: absolute; left: 14px; top: 15px; width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.topic .t { font-weight: 600; }
.topic .m { font-size: 12px; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--track); margin-top: 8px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .g { background: var(--good); }
.bar .s { background: var(--accent); opacity: .45; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.row.space { justify-content: space-between; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: none; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.settings { display: grid; gap: 12px; }
.settings label.l { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
/* quiz */
.qhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--track); color: var(--ink-2); }
.chip.kind { background: var(--accent-soft); color: var(--accent); }
.progress { height: 4px; background: var(--track); border-radius: 2px; margin: 10px 0 16px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.timer { font-variant-numeric: tabular-nums; font-weight: 600; }
.timer.low { color: var(--bad); }
.q { font-size: 19px; line-height: 1.5; margin: 14px 0 6px; outline: none; }
.hint { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.figure { overflow-x: auto; margin: 6px 0 14px; padding: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; text-align: center; }
svg.tree { max-width: 100%; height: auto; }
svg.tree line { stroke: var(--edge); stroke-width: 1.6; }
svg.tree circle { stroke-width: 1.6; }
svg.tree .nB circle { fill: var(--node-b); stroke: var(--node-b); }
svg.tree .nR circle { fill: var(--node-r); stroke: var(--node-r); }
svg.tree .nP circle { fill: var(--node-p); stroke: var(--ink-2); }
svg.tree text { font: 600 13px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
svg.tree .nB text, svg.tree .nR text { fill: var(--node-ink); }
svg.tree .nP text { fill: var(--ink); }
.legend { font-size: 12px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin: 0 4px 0 10px; }
.opts { display: grid; gap: 10px; margin-top: 8px; }
.opts.tf { grid-template-columns: 1fr 1fr; }
.opt { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; background: var(--raised); border: 1.5px solid var(--border); border-radius: 12px; padding: 12px 14px; cursor: pointer; min-height: 52px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--track); color: var(--ink-2); margin-top: 1px; }
.opt .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .mark { flex: none; font-weight: 700; font-size: 13px; margin-top: 3px; }
.opts.tf .opt { justify-content: center; align-items: center; font-weight: 600; font-size: 17px; }
.opts.tf .opt .tx { flex: none; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .k { background: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .k { background: var(--good); color: #fff; }
.opt.right .mark { color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: #fff; }
.opt.wrong .mark { color: var(--bad); }
.opt.missed { border-color: var(--good); border-style: dashed; }
.opt.missed .mark { color: var(--good); }
.feedback { margin-top: 16px; border-radius: 12px; padding: 14px 16px; border: 1px solid var(--border); background: var(--surface); }
.feedback.ok { border-color: var(--good); }
.feedback.no { border-color: var(--bad); }
.feedback .verdict { font-weight: 700; margin-bottom: 4px; }
.feedback.ok .verdict { color: var(--good); }
.feedback.no .verdict { color: var(--bad); }
.feedback .ref { font-size: 13px; color: var(--muted); margin-top: 8px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }
.actions .grow { flex: 1; }
.flag[aria-pressed="true"] { color: var(--warn); border-color: var(--warn); }
.dots { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 18px; }
.dot { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; cursor: pointer; font-variant-numeric: tabular-nums; padding: 0; }
.dot.a { background: var(--accent-soft); border-color: var(--accent); }
.dot.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.keys { font-size: 12px; color: var(--muted); margin-top: 22px; }
kbd { font: 600 11px ui-monospace, Menlo, monospace; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--surface); color: var(--ink-2); }
/* results */
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.score b { font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.tbl { display: grid; gap: 8px; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 70px auto; gap: 10px; align-items: center; }
.trow .bar { margin: 0; height: 8px; }
.trow .n { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }
details.rev { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); margin-bottom: 8px; }
details.rev summary { cursor: pointer; padding: 10px 14px; display: flex; gap: 10px; align-items: baseline; list-style: none; }
details.rev summary::-webkit-details-marker { display: none; }
details.rev summary .m { flex: none; font-weight: 700; width: 18px; }
details.rev summary .m.ok { color: var(--good); }
details.rev summary .m.no { color: var(--bad); }
details.rev summary .s { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.rev[open] summary .s { white-space: normal; }
details.rev .body { padding: 0 14px 14px 42px; font-size: 15px; }
details.rev .body p { margin: 6px 0; }
.empty { text-align: center; padding: 40px 16px; color: var(--ink-2); }
footer { margin-top: 36px; font-size: 13px; color: var(--muted); }
footer p { margin: 6px 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .q { font-size: 17px; }

  details.rev .body { padding-left: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script type="application/json" id="bank">
[
{"id":"L1-01","topic":"L1","type":"tf","q":"In `INSERTION-SORT(A, n)` (1-based), at the start of each iteration of the outer `for` loop with index j, the subarray `A[1 . . j−1]` holds exactly the elements originally in `A[1 . . j−1]`, but in sorted order.","answer":true,"explain":"This is the loop invariant of insertion sort. It is true initially (j = 2: a single element is sorted), is maintained because each iteration inserts A[j] into its correct place among A[1 . . j−1], and at termination (j = n+1) it says the whole array is sorted.","ref":"CLRS 2.1","slide":15},
{"id":"L1-02","topic":"L1","type":"mc","q":"Run `INSERTION-SORT` (CLRS, 1-based) on `A = ⟨7, 3, 9, 1, 5, 2⟩`. What does A look like right after the outer-loop iteration with j = 4 has finished?","options":["`⟨1, 3, 5, 7, 9, 2⟩`","`⟨1, 3, 9, 7, 5, 2⟩`","`⟨1, 3, 7, 9, 5, 2⟩`","`⟨3, 7, 9, 1, 5, 2⟩`"],"answer":2,"explain":"Iteration j = 4 inserts key A[4] = 1 into the already sorted prefix ⟨3, 7, 9⟩, giving ⟨1, 3, 7, 9⟩; positions 5–6 are untouched. ⟨3, 7, 9, 1, 5, 2⟩ is the state after j = 3, and ⟨1, 3, 5, 7, 9, 2⟩ is after j = 5.","ref":"CLRS 2.1","slide":15},
{"id":"L1-03","topic":"L1","type":"mc","q":"Insertion sort is run on the lecture's example input `⟨8, 2, 4, 9, 3, 6⟩`. In total, how many times is the shift `A[i+1] ← A[i]` inside the `while` loop executed?","options":["9","7","5","15"],"answer":1,"explain":"Each shift removes exactly one inversion, so the count equals the number of inversions: (8,2), (8,4), (8,3), (8,6), (4,3), (9,3), (9,6) = 7. 15 = n(n−1)/2 would be the reverse-sorted worst case for n = 6.","ref":"CLRS Prob 2-4","slide":26},
{"id":"L1-04","topic":"L1","type":"tf","q":"Insertion sort achieves its best-case running time when the input array is in reverse sorted order.","answer":false,"explain":"Reverse sorted input is the worst case: key A[j] must be compared with and shifted past all j−1 earlier elements, giving Θ(n²). The best case is an already sorted array, where the while test fails immediately and the total time is Θ(n).","ref":"CLRS 2.2","slide":27},
{"id":"L1-05","topic":"L1","type":"mc","q":"Insertion sort is given an array of n distinct keys that is already sorted in increasing order. What is its running time?","options":["Θ(1)","Θ(n lg n)","Θ(n²)","Θ(n)"],"answer":3,"explain":"For each j the while condition A[i] > key is false on the first check, so each of the n−1 outer iterations does constant work: Θ(n). It is not Θ(1) because every element must still be looked at once.","ref":"CLRS 2.2","slide":27},
{"id":"L1-06","topic":"L1","type":"tf","q":"`INSERTION-SORT` sorts in place: apart from the input array, it stores only a constant number of values (such as key, i and j) at any time.","answer":true,"explain":"The pseudocode only moves elements within A and uses the scalar variables key, i and j, so the extra space is O(1). That is CLRS's definition of sorting in place.","ref":"CLRS 2.1","slide":15},
{"id":"L1-07","topic":"L1","type":"tf","q":"If the while-loop test in `INSERTION-SORT` is changed from `A[i] > key` to `A[i] ≥ key`, the algorithm still produces a correctly sorted array (for inputs that may contain equal keys).","answer":true,"explain":"With ≥, the key is simply inserted before equal elements instead of after them; the prefix A[1 . . j] is still sorted after every iteration. The change costs extra shifts and destroys stability, but correctness of the sorted order is unaffected.","ref":"CLRS 2.1","slide":15},
{"id":"L1-08","topic":"L1","type":"ms","q":"Which of the following are assumptions of the generic Random Access Machine (RAM) model used to analyze algorithms in this course? Select all that apply.","options":["Cache misses and the memory hierarchy are charged separately from arithmetic operations.","Several instructions may run in parallel on different processors to model multicore machines.","Instructions are executed one after another, with no concurrent operations.","Each primitive operation (arithmetic, logical, comparison, function call) costs one unit of time.","Running times are measured in seconds on a reference processor so results can be compared."],"answer":[2,3],"explain":"The RAM model executes operations sequentially and charges each primitive operation a unit (constant) cost, which removes dependence on the speed of a particular computer. It deliberately ignores memory hierarchy, parallelism and real clock time.","ref":"CLRS 2.2","slide":13},
{"id":"L1-09","topic":"L1","type":"tf","q":"In the RAM model used in this course, a multiplication is charged more time than an addition because it is a more complex operation.","answer":false,"explain":"The simplifying assumption is that all primitive operations cost one unit (constant time). Distinguishing operation costs would reintroduce dependence on a specific machine.","ref":"CLRS 2.2","slide":13},
{"id":"L1-10","topic":"L1","type":"mc","q":"Why is worst-case analysis the kind of running-time analysis we usually perform?","options":["It is the only kind of analysis that does not depend on the input size n.","It shows how fast the algorithm can possibly run, which is what users care about.","It gives an upper bound that is guaranteed for every input of size n.","It equals the average running time when inputs are random."],"answer":2,"explain":"T(n) = maximum time over all inputs of size n, so no input of that size can take longer: a performance guarantee. The last option describes best-case analysis, which can make a slow algorithm look fast on some special input.","ref":"CLRS 2.2","slide":27},
{"id":"L1-11","topic":"L1","type":"tf","q":"Average-case analysis requires an assumption about the statistical distribution of the inputs of size n.","answer":true,"explain":"The average-case T(n) is an expected time over all inputs of size n, and an expectation is only defined relative to a probability distribution (e.g. all permutations equally likely for sorting).","ref":"CLRS 2.2","slide":27},
{"id":"L1-12","topic":"L1","type":"tf","q":"If an algorithm's best-case running time is Θ(n), then its running time is O(n) on every input of size n.","answer":false,"explain":"A best-case bound describes only the most favorable inputs. Insertion sort is Θ(n) in the best case but Θ(n²) on reverse-sorted input, so it is not O(n) on every input.","ref":"CLRS 3.1","slide":27},
{"id":"L1-13","topic":"L1","type":"tf","q":"The worst-case running time of insertion sort is O(n³).","answer":true,"explain":"O gives only an upper bound: an² + bn + c ≤ c'n² ≤ c'n³ for n ≥ 1. The bound is not tight (Θ(n²) is), but it is a correct statement.","ref":"CLRS 3.1","slide":31},
{"id":"L1-14","topic":"L1","type":"tf","q":"The worst-case running time of insertion sort is O(n).","answer":false,"explain":"On a reverse-sorted input the j-th iteration shifts j−1 elements, for a total of n(n−1)/2 = Θ(n²) shifts. No constant c can make that ≤ cn for all large n.","ref":"CLRS 2.2","slide":31},
{"id":"L1-15","topic":"L1","type":"ms","q":"Let f(n) = 3n² + 10n + 5. Which pairs of constants (c, n₀) witness f(n) = O(n²), i.e. f(n) ≤ c·n² for all n ≥ n₀? Select all that apply.","options":["c = 5, n₀ = 1","c = 18, n₀ = 1","c = 4, n₀ = 11","c = 4, n₀ = 5","c = 3, n₀ = 100"],"answer":[1,2],"explain":"c = 3+10+5 = 18 works from n = 1, since 10n ≤ 10n² and 5 ≤ 5n². With c = 4 we need n² ≥ 10n + 5, true for n ≥ 11 but not at n = 5 (130 > 100). With c = 3 the inequality never holds, and c = 5 fails at n = 1 (18 > 5).","ref":"CLRS 3.1","slide":31},
{"id":"L1-16","topic":"L1","type":"mc","q":"Which statement is equivalent to f(n) = Θ(g(n))?","options":["f(n) = O(g(n)) and f(n) = Ω(g(n))","f(n) = O(g(n)) or f(n) = Ω(g(n))","There are constants c > 0 and n₀ with 0 ≤ f(n) ≤ c·g(n) for all n ≥ n₀","f(n) = o(g(n)) and f(n) = ω(g(n))"],"answer":0,"explain":"Θ is a two-sided bound: c₁g(n) ≤ f(n) ≤ c₂g(n), which is exactly an O bound together with an Ω bound. The third option is only the O bound, and no function can be both o(g) and ω(g).","ref":"CLRS 3.1 (Theorem 3.1)","slide":33},
{"id":"L1-17","topic":"L1","type":"tf","q":"n² = o(n²).","answer":false,"explain":"o requires f(n) < c·g(n) for EVERY positive constant c (eventually). With c = 1/2 we would need n² < n²/2, which never holds. n² = O(n²) and Θ(n²), but o is strict, like < rather than ≤.","ref":"CLRS 3.1","slide":33},
{"id":"L1-18","topic":"L1","type":"mc","q":"How does f(n) = n lg n compare asymptotically with g(n) = n²?","options":["f(n) = ω(g(n))","f(n) = Ω(g(n))","f(n) = o(g(n))","f(n) = Θ(g(n))"],"answer":2,"explain":"f(n)/g(n) = lg n / n → 0, so for every c > 0, n lg n < c·n² eventually: f = o(g), and therefore also O(g) but not Ω(g) or Θ(g).","ref":"CLRS 3.1","slide":33},
{"id":"L1-19","topic":"L1","type":"ms","q":"Let T(n) be the running time of insertion sort on an input of size n (any input). Which statements are correct? Select all that apply.","options":["T(n) = O(n²) for every input of size n.","The worst-case running time is Ω(n²).","T(n) = Θ(n²) for every input of size n.","The worst-case running time is O(n lg n).","T(n) = Ω(n) for every input of size n."],"answer":[0,1,4],"explain":"Every input needs at least linear time (each element is examined), and no input needs more than quadratic time, so Ω(n) and O(n²) hold for all inputs; the reverse-sorted worst case takes Θ(n²), so the worst case is Ω(n²). It is not Θ(n²) for every input, because sorted input takes only Θ(n).","ref":"CLRS 3.1","slide":32},
{"id":"L1-20","topic":"L1","type":"mc","q":"What is the tight asymptotic bound for f(n) = 0.01n⁴ − 50n³ + 7?","options":["Θ(n⁴)","Θ(n³)","O(n³), but no Θ bound","No Θ bound exists, because f(n) is negative for some n"],"answer":0,"explain":"Drop the low-order terms and ignore the leading constant: the n⁴ term dominates for large n. f(n) is negative for moderate n (e.g. n = 100), but Θ only needs 0 ≤ c₁n⁴ ≤ f(n) ≤ c₂n⁴ for n ≥ n₀, and a large enough n₀ handles that.","ref":"CLRS 3.1","slide":30},
{"id":"L1-21","topic":"L1","type":"mc","q":"On a reverse-sorted array of n = 6 distinct keys, how many times does insertion sort execute the shift `A[i+1] ← A[i]`?","options":["36","21","6","15"],"answer":3,"explain":"Iteration j shifts all j−1 earlier elements, so the total is 1+2+3+4+5 = n(n−1)/2 = 15. 21 = n(n+1)/2 wrongly counts j−1 shifts for j = 1 … 7.","ref":"CLRS 2.2","slide":15},
{"id":"L1-22","topic":"L1","type":"mc","q":"To prove an algorithm correct with a loop invariant, you show initialization, maintenance and termination. Which property uses the condition that made the loop stop to conclude that the output is correct?","options":["Maintenance","Induction hypothesis","Termination","Initialization"],"answer":2,"explain":"Termination: when the loop ends (for insertion sort, j = n+1), the invariant plus the exit condition gives a useful property (A[1 . . n] is sorted). Initialization and maintenance are the base case and inductive step that show the invariant always holds.","ref":"CLRS 2.1","slide":15},
{"id":"L2-01","topic":"L2","type":"mc","q":"Using the basic manipulations for Θ-notation (drop low-order terms, ignore leading constants), f(n) = 5n² + 1000 n lg n + 10⁶ is:","options":["Θ(n² lg n)","Θ(n lg n)","Θ(1)","Θ(n²)"],"answer":3,"explain":"n lg n = o(n²) and the constant 10⁶ is o(n²), so for large n the 5n² term dominates no matter how big the other coefficients are. Θ(n² lg n) wrongly multiplies the terms instead of keeping the largest one.","ref":"CLRS 3.1","slide":8},
{"id":"L2-02","topic":"L2","type":"tf","q":"When n gets large enough, an algorithm whose running time is Θ(n²) always beats one whose running time is Θ(n³).","answer":true,"explain":"If T₁(n) ≤ c₂n² and T₂(n) ≥ c₁n³ for large n, then T₁(n) < T₂(n) once n > c₂/c₁ (and beyond both n₀'s). Asymptotic analysis is exactly about this behavior as n → ∞.","ref":"CLRS 3.1","slide":9},
{"id":"L2-03","topic":"L2","type":"tf","q":"An algorithm with running time Θ(n²) is faster than an algorithm with running time Θ(n³) for every input size n.","answer":false,"explain":"Θ hides constant factors and only holds for n ≥ n₀. For example 100n² is larger than n³ for every n < 100. This is why asymptotically slower algorithms shouldn't be ignored for small inputs.","ref":"CLRS 3.1","slide":9},
{"id":"L2-04","topic":"L2","type":"mc","q":"Insertion sort is run on a random permutation of n = 8 distinct keys, with all 8! permutations equally likely. What is the expected number of shifts `A[i+1] ← A[i]`?","options":["14","28","7","16"],"answer":0,"explain":"Each pair of keys is inverted with probability 1/2, and each shift removes one inversion, so the expectation is C(8,2)/2 = n(n−1)/4 = 14. Key j moves past about (j−1)/2 elements on average, which is why the average case is still Θ(n²). 28 is the worst case.","ref":"CLRS 2.2","slide":10},
{"id":"L2-05","topic":"L2","type":"tf","q":"If all input permutations are equally likely, the average-case running time of insertion sort is Θ(n lg n).","answer":false,"explain":"On average key A[j] is compared with about half of the j−1 sorted elements, so T(n) = ∑ Θ(j/2) = Θ(n²), only a constant factor better than the worst case.","ref":"CLRS 2.2","slide":10},
{"id":"L2-06","topic":"L2","type":"mc","q":"The simple divide-and-conquer method for multiplying two n-bit integers splits X = A·2^{n/2} + B and Y = C·2^{n/2} + D and computes XY = 2ⁿAC + 2^{n/2}(AD + BC) + BD with four recursive products. Its running time is:","options":["Θ(n^{lg 3})","Θ(n² lg n)","Θ(n²)","Θ(n lg n)"],"answer":2,"explain":"T(n) = 4T(n/2) + Θ(n): n^{log_{2} 4} = n² dominates f(n) = n polynomially (master case 1), so T(n) = Θ(n²), no better than grade-school multiplication. Θ(n^{lg 3}) needs only three recursive products.","ref":"CLRS 4.5","slide":11},
{"id":"L2-07","topic":"L2","type":"ms","q":"Karatsuba–Ofman multiplication with X = A·2^{n/2} + B and Y = C·2^{n/2} + D. Which products of (about) n/2-bit numbers does it compute recursively? Select all that apply.","options":["AC","BD","(A + B)(C + D)","AD","BC"],"answer":[0,1,2],"explain":"AD + BC is never computed directly: it equals (A + B)(C + D) − AC − BD. That leaves three recursive multiplications plus Θ(n) additions, subtractions and shifts, so T(n) = 3T(n/2) + Θ(n).","ref":"CLRS Prob 30-1","slide":13},
{"id":"L2-08","topic":"L2","type":"mc","q":"Multiply the 8-bit numbers X = `11010011` and Y = `01100101` (binary) with Karatsuba, so A = `1101` (13), B = `0011` (3), C = `0110` (6), D = `0101` (5). What value of AD + BC does the method obtain from its three products?","options":["83","176","93","65"],"answer":0,"explain":"AC = 78, BD = 15 and (A + B)(C + D) = 16·11 = 176, so AD + BC = 176 − 78 − 15 = 83 (check: 13·5 + 3·6 = 83). Then XY = 2⁸·78 + 2⁴·83 + 15 = 21311 = 211·101. 176 is the product before subtracting AC and BD.","ref":"CLRS Prob 30-1","slide":13},
{"id":"L2-09","topic":"L2","type":"tf","q":"Going from four recursive half-size multiplications to three (Karatsuba) improves only the constant factor of integer multiplication, not its asymptotic running time.","answer":false,"explain":"The number of subproblems a sets the exponent n^{log_{b} a}: 4T(n/2) + Θ(n) = Θ(n²), while 3T(n/2) + Θ(n) = Θ(n^{lg 3}) ≈ Θ(n^{1.585}), a polynomially faster algorithm.","ref":"CLRS 4.5","slide":13},
{"id":"L2-10","topic":"L2","type":"mc","q":"Two sorted lists `L = ⟨3, 8, 10, 15⟩` and `R = ⟨1, 4, 9, 20⟩` are merged by a procedure that repeatedly compares the two front elements and stops comparing as soon as one list is empty (the rest of the other list is copied over). How many key comparisons are made?","options":["4","16","7","8"],"answer":2,"explain":"Output order: 1, 3, 4, 8, 9, 10, 15 — each chosen by one comparison — and L is then empty, so 20 is copied with no comparison: 7 comparisons. In general merging n elements takes at most n − 1 comparisons, i.e. Θ(n) time. (CLRS's MERGE with ∞ sentinels always runs exactly n loop iterations instead.)","ref":"CLRS 2.3.1","slide":28},
{"id":"L2-11","topic":"L2","type":"tf","q":"Merging two sorted subarrays that contain n elements in total takes Θ(n lg n) time, because each element takes part in about lg n comparisons.","answer":false,"explain":"Each step of MERGE does one comparison and outputs one element, so merging n elements is Θ(n) (linear). The lg n factor in merge sort comes from the lg n levels of recursion, each doing Θ(n) total merging.","ref":"CLRS 2.3.1","slide":28},
{"id":"L2-12","topic":"L2","type":"mc","q":"In the merge sort recurrence T(n) = 2T(n/2) + Θ(n), what does the Θ(n) term account for?","options":["Merging the two sorted halves (plus the constant-time divide step)","The two recursive calls on halves of the array","The base case when n = 1","Copying the array into n subarrays of size 1"],"answer":0,"explain":"Dividing just computes a midpoint (Θ(1)) and the two recursive sorts are the 2T(n/2) term; the linear-time MERGE is the Θ(n) combine cost.","ref":"CLRS 2.3.2","slide":29},
{"id":"L2-13","topic":"L2","type":"tf","q":"Writing the merge sort recurrence as 2T(n/2) + Θ(n) instead of T(⌈n/2⌉) + T(⌊n/2⌋) + Θ(n) changes its asymptotic solution when n is not a power of 2.","answer":false,"explain":"This sloppiness does not matter asymptotically: both recurrences solve to Θ(n lg n). Floors and ceilings usually change only lower-order terms, which is why we may assume n is a power of 2.","ref":"CLRS 4.6.2","slide":29},
{"id":"L2-14","topic":"L2","type":"tf","q":"For the merge sort recurrence it is fine to omit the base case T(n) = Θ(1) for small n, because changing the base case's constant does not change the asymptotic solution.","answer":true,"explain":"A different constant at the leaves scales only the Θ(n) leaf cost (n leaves × constant), which is dominated by Θ(n lg n). The convention is to omit the base case only when it has no effect on the asymptotic answer.","ref":"CLRS 4 (intro)","slide":30},
{"id":"L2-15","topic":"L2","type":"mc","q":"Let T(1) = c and T(n) = 2T(n/2) + cn for n a power of 2 (c > 0 constant). Summing the recursion tree level by level, what is T(n) exactly?","options":["2cn lg n","cn lg n + cn","cn lg n","cn(lg n − 1)"],"answer":1,"explain":"There are lg n internal levels, each of total cost cn, plus a leaf level of n leaves costing c each: cn lg n + cn = Θ(n lg n). Forgetting the leaf level gives cn lg n. For example T(8) = 32c = c(8·3 + 8).","ref":"CLRS 2.3.2","slide":39},
{"id":"L2-16","topic":"L2","type":"tf","q":"In the recursion tree for T(n) = 2T(n/2) + cn (n a power of 2), every level above the leaves has total cost exactly cn.","answer":true,"explain":"Level i has 2^{i} nodes, each costing c·n/2^{i}, so each level sums to cn. With lg n such levels plus Θ(n) at the leaves, the total is Θ(n lg n).","ref":"CLRS 2.3.2","slide":38},
{"id":"L2-17","topic":"L2","type":"mc","q":"In the recursion tree of Karatsuba's recurrence T(n) = 3T(n/2) + Θ(n) (n a power of 2), how many leaves are there?","options":["3 lg n","n","n^{log_{3} 2}","n^{lg 3}"],"answer":3,"explain":"The tree has height lg n and branching factor 3, so there are 3^{lg n} = n^{lg 3} ≈ n^{1.585} leaves. That leaf count dominates the total cost. n leaves would need branching factor 2, as in merge sort.","ref":"CLRS 4.4","slide":38},
{"id":"L2-18","topic":"L2","type":"ms","q":"Which of the following asymptotic statements are true? Select all that apply.","options":["2^{2n} = Θ(2ⁿ)","n^{0.1} = O(lg³ n)","lg³ n = o(n^{0.1})","2^{n+1} = Θ(2ⁿ)","3ⁿ = O(2ⁿ)"],"answer":[2,3],"explain":"Any polylogarithm grows slower than any positive power of n (though the crossover for lg³ n vs n^{0.1} is at a huge n). 2^{n+1} = 2·2ⁿ differs by a constant. But 3ⁿ/2ⁿ = (1.5)ⁿ → ∞ and 2^{2n}/2ⁿ = 2ⁿ → ∞, so constants in an exponent or base are not ignorable.","ref":"CLRS 3.2","slide":8},
{"id":"L2-19","topic":"L2","type":"tf","q":"4^{lg n} = Θ(n²).","answer":true,"explain":"4^{lg n} = (2²)^{lg n} = (2^{lg n})² = n². In general a^{log_{b} n} = n^{log_{b} a}, the identity behind the number of leaves in a recursion tree.","ref":"CLRS 3.2","slide":8},
{"id":"L2-20","topic":"L2","type":"tf","q":"If f(n) = o(g(n)) for asymptotically positive f and g, then f(n) = O(g(n)) but f(n) ≠ Ω(g(n)).","answer":true,"explain":"o means f(n) < c·g(n) eventually for every c > 0; taking c = 1 gives O. If f were also Ω(g), some c₀ > 0 would have f ≥ c₀g eventually, contradicting f < (c₀/2)g. Like a < b: it implies a ≤ b but not a ≥ b.","ref":"CLRS 3.1","slide":8},
{"id":"L2-21","topic":"L2","type":"mc","q":"A hybrid merge sort splits the input into n/k blocks of size k, sorts each block with insertion sort (Θ(k²) each in the worst case), and then merges the blocks in Θ(n lg(n/k)) time. What is the worst-case running time if k = √n?","options":["Θ(n lg n)","Θ(n)","Θ(n²)","Θ(n^{1.5})"],"answer":3,"explain":"Sorting the blocks costs (n/k)·Θ(k²) = Θ(nk) = Θ(n^{1.5}), and merging costs Θ(n lg √n) = Θ(n lg n), so the total is Θ(n^{1.5}), worse than plain merge sort. Blocks must have size k = O(lg n) to keep Θ(n lg n).","ref":"CLRS Prob 2-1","slide":40},
{"id":"L2-22","topic":"L2","type":"ms","q":"Which statements about asymptotic analysis are correct? Select all that apply.","options":["For small inputs, constant factors can make an asymptotically slower algorithm the faster one in practice.","It ignores machine-dependent constants and looks at how T(n) grows as n → ∞.","A Θ(n lg n) algorithm runs faster than a Θ(n²) algorithm for every n ≥ 1.","Running the same algorithm on a faster computer can change its Θ class.","Θ-notation keeps the leading constant, so it can compare two machines."],"answer":[0,1],"explain":"Asymptotic analysis looks at growth as n → ∞ and deliberately drops constants (e.g. merge sort only beats insertion sort for n above roughly 30). A faster machine changes constants, not the Θ class, and Θ guarantees nothing for small n.","ref":"CLRS 3.1","slide":9},
{"id":"L3-01","topic":"L3","type":"mc","q":"In divide-and-conquer integer multiplication, the final step shifts and adds the recursively computed products to form XY = 2ⁿAC + 2^{n/2}(AD + BC) + BD. Which step of the divide-and-conquer paradigm is this?","options":["Divide","Conquer","Base case","Combine"],"answer":3,"explain":"Divide splits X and Y into the halves A, B, C, D; Conquer computes the smaller products recursively; Combine assembles the subproblem solutions into the answer, here with Θ(n) shifts and additions. That combine cost is the Θ(n) term of the recurrence.","ref":"CLRS 4 (intro)","slide":6},
{"id":"L3-02","topic":"L3","type":"tf","q":"Using the substitution method to prove T(n) ≤ cn³ for T(n) = 4T(n/2) + 100n shows that T(n) = Θ(n³).","answer":false,"explain":"The induction proves only an upper bound, T(n) = O(n³), and it is not tight: the true solution is Θ(n²). O and Ω must be proved separately to get Θ.","ref":"CLRS 4.3","slide":10},
{"id":"L3-03","topic":"L3","type":"tf","q":"For T(n) = 4T(n/2) + 100n, the induction with hypothesis T(k) ≤ ck² gets stuck at T(n) ≤ cn² + 100n. This shows that T(n) is not O(n²).","answer":false,"explain":"A failed induction only shows that this hypothesis is too weak. Strengthening it by subtracting a lower-order term, T(k) ≤ c₁k² − c₂k, makes the proof work, so T(n) = O(n²) (indeed Θ(n²)).","ref":"CLRS 4.3","slide":11},
{"id":"L3-04","topic":"L3","type":"mc","q":"To show T(n) = 4T(n/2) + 100n is O(n²), use the hypothesis T(k) ≤ c₁k² − c₂k for k < n. The inductive step gives T(n) ≤ c₁n² − 2c₂n + 100n. For which values of c₂ does this imply T(n) ≤ c₁n² − c₂n?","options":["c₂ ≥ 100","c₂ ≥ 50","c₂ ≥ 200","Any c₂ > 0"],"answer":0,"explain":"c₁n² − 2c₂n + 100n = c₁n² − c₂n − (c₂n − 100n), and the residual c₂n − 100n is ≥ 0 exactly when c₂ ≥ 100. c₁ is then chosen large enough for the base cases. c₂ ≥ 50 forgets that only one c₂n may be used up.","ref":"CLRS 4.3","slide":12},
{"id":"L3-05","topic":"L3","type":"tf","q":"A substitution-method proof is not complete until the induction is grounded: the claimed bound must also be shown to hold for the base cases, typically by choosing the constant c large enough.","answer":true,"explain":"The inductive step only shows that the bound carries over from smaller n. The boundary conditions (T(n) = Θ(1) for n < n₀) must also satisfy the bound, which is handled by picking c big enough.","ref":"CLRS 4.3","slide":10},
{"id":"L3-06","topic":"L3","type":"mc","q":"Draw the recursion tree for T(n) = T(n/2) + T(n/3) + n². What is the total cost of the level just below the root (depth 1)?","options":["5n²/6","n²/6","13n²/36","25n²/36"],"answer":2,"explain":"The two children cost (n/2)² + (n/3)² = n²/4 + n²/9 = 13n²/36. 25n²/36 = (n/2 + n/3)² wrongly squares the sum of the subproblem sizes instead of summing the squares.","ref":"CLRS 4.4","slide":20},
{"id":"L3-07","topic":"L3","type":"tf","q":"T(n) = T(n/2) + T(n/3) + n² is Θ(n²), because the level costs of its recursion tree form a decreasing geometric series.","answer":true,"explain":"Level i costs at most (13/36)^{i}·n², so the total is at most n²/(1 − 13/36) = (36/23)n², and the root alone already costs n². So T(n) = Θ(n²): the root dominates.","ref":"CLRS 4.4","slide":22},
{"id":"L3-08","topic":"L3","type":"mc","q":"In the recursion tree for T(n) = T(n/4) + T(n/2) + n², the level costs are n², (5/16)n², (5/16)²n², … . Which upper bound on the total cost does the infinite geometric series give?","options":["(16/11)n²","(21/16)n²","2n²","n² lg n"],"answer":0,"explain":"1 + x + x² + … = 1/(1 − x) for |x| < 1, so the total is at most n²/(1 − 5/16) = (16/11)n², hence Θ(n²). (21/16)n² counts only the first two levels; n² lg n would mean equal cost on all ~lg n levels.","ref":"CLRS A.1","slide":23},
{"id":"L3-09","topic":"L3","type":"tf","q":"Because the recursion-tree method relies on ellipses (\"…\") and approximations, it is best used to generate a guess that is then verified with the substitution method.","answer":true,"explain":"A recursion tree builds intuition and a good guess, but sloppy summation can hide errors; the substitution method then gives a rigorous proof of the guessed bound.","ref":"CLRS 4.4","slide":13},
{"id":"L3-10","topic":"L3","type":"ms","q":"Which of these recurrences have solution T(n) = Θ(n²)? Select all that apply.","options":["T(n) = 8T(n/2) + n²","T(n) = 9T(n/3) + n","T(n) = 2T(n/2) + n²","T(n) = T(n/2) + n²","T(n) = 4T(n/2) + n²"],"answer":[1,2,3],"explain":"9T(n/3) + n: n^{log_{3} 9} = n² dominates n (case 1). 2T(n/2) + n² and T(n/2) + n²: n² is polynomially larger than n and n⁰ = 1, with regularity c = 1/2 and 1/4 (case 3), so Θ(n²). 4T(n/2) + n² is case 2, giving Θ(n² lg n), and 8T(n/2) + n² is case 1 with Θ(n³).","ref":"CLRS 4.5","slide":32},
{"id":"L3-11","topic":"L3","type":"mc","q":"Solve T(n) = 8T(n/2) + n³ with the master method.","options":["Θ(n^{8/2})","Θ(n³ lg n)","Θ(n³)","Θ(n⁴)"],"answer":1,"explain":"a = 8, b = 2, so n^{log_{2} 8} = n³ = Θ(f(n)): case 2, every one of the lg n levels costs n³, so T(n) = Θ(n³ lg n). Θ(n³) forgets the lg n factor of case 2.","ref":"CLRS 4.5","slide":28},
{"id":"L3-12","topic":"L3","type":"mc","q":"Solve T(n) = 5T(n/2) + n³ with the master method.","options":["Θ(n³)","Θ(n^{lg 5})","Θ(n³ lg n)","Θ(n^{lg 5} lg n)"],"answer":0,"explain":"n^{log_{2} 5} ≈ n^{2.32} and f(n) = n³ = Ω(n^{lg 5 + ε}) with ε ≈ 0.68. Regularity holds: 5(n/2)³ = (5/8)n³ with c = 5/8 < 1. Case 3 gives Θ(n³). Θ(n^{lg 5}) would be the case-1 answer.","ref":"CLRS 4.5","slide":30},
{"id":"L3-13","topic":"L3","type":"tf","q":"With the extended case 2 from the lecture (f(n) = Θ(n^{log_{b} a} lg^{k} n) for a constant k ≥ 0 gives T(n) = Θ(n^{log_{b} a} lg^{k+1} n)), T(n) = 2T(n/2) + n lg n = Θ(n lg² n).","answer":true,"explain":"a = b = 2, so n^{log_{b} a} = n and f(n) = n lg¹ n, i.e. k = 1. Then T(n) = Θ(n lg² n). The basic three cases do not cover this recurrence, because n lg n is larger than n but not polynomially larger.","ref":"CLRS Ex 4.6-2","slide":28},
{"id":"L3-14","topic":"L3","type":"tf","q":"Master case 1 applies to T(n) = 2T(n/2) + n/lg n, because f(n) = n/lg n grows more slowly than n^{log_{2} 2} = n.","answer":false,"explain":"Case 1 needs f(n) = O(n^{1−ε}) for some ε > 0, i.e. polynomially smaller. n/lg n is smaller only by a lg n factor, and lg n = o(n^{ε}) for every ε > 0. It falls in the gap between cases 1 and 2 (the actual solution is Θ(n lg lg n)).","ref":"CLRS 4.5","slide":33},
{"id":"L3-15","topic":"L3","type":"ms","q":"To which recurrences can the master method (three cases, with case 2 allowing f(n) = Θ(n^{log_{b} a} lg^{k} n), k ≥ 0) be applied directly? Select all that apply.","options":["T(n) = 4T(n/2) + n²/lg n","T(n) = 3T(n/2) + n","T(n) = 27T(n/3) + n³","T(n) = T(n − 1) + n","T(n) = (1/2)T(n/2) + n"],"answer":[1,2],"explain":"3T(n/2) + n is case 1 (Θ(n^{lg 3})) and 27T(n/3) + n³ is case 2 (Θ(n³ lg n)). T(n − 1) + n is not of the form aT(n/b) + f(n), a = 1/2 violates a ≥ 1, and n²/lg n would need k = −1, outside case 2 and not polynomially smaller than n².","ref":"CLRS 4.5","slide":24},
{"id":"L3-16","topic":"L3","type":"mc","q":"For T(n) = 2T(n/2) + n², a·f(n/b) = c·f(n) holds with which constant c? (This is what verifies the regularity condition of case 3.)","options":["1/2","1/4","1","2"],"answer":0,"explain":"a·f(n/b) = 2(n/2)² = n²/2, so c = 1/2 < 1 and regularity holds, giving T(n) = Θ(n²). 1/4 forgets to multiply by a = 2.","ref":"CLRS 4.5","slide":30},
{"id":"L3-17","topic":"L3","type":"tf","q":"In master-theorem case 3, the cost per level of the recursion tree increases geometrically from the root to the leaves, so the leaves hold a constant fraction of the total.","answer":false,"explain":"That describes case 1. In case 3 the weight decreases geometrically from the root to the leaves, the root holds a constant fraction of the total, and T(n) = Θ(f(n)).","ref":"CLRS 4.6","slide":31},
{"id":"L3-18","topic":"L3","type":"mc","q":"How many leaves does the recursion tree for T(n) = 7T(n/2) + Θ(n²) have (n a power of 2)?","options":["7 lg n","n^{log_{7} 2}","n^{lg 7}","n^{7/2}"],"answer":2,"explain":"The height is log_{2} n and each node has 7 children, so there are 7^{lg n} = n^{lg 7} ≈ n^{2.81} leaves. That exceeds f(n) = n² polynomially, so T(n) = Θ(n^{lg 7}) (case 1).","ref":"CLRS 4.6","slide":25},
{"id":"L3-19","topic":"L3","type":"tf","q":"The master method can be used to solve T(n) = T(n − 1) + n².","answer":false,"explain":"The subproblem has size n − 1, not n/b with b > 1, so the recurrence is not of the form aT(n/b) + f(n). Expanding it gives n² + (n−1)² + … + 1² = Θ(n³).","ref":"CLRS 4.5","slide":24},
{"id":"L3-20","topic":"L3","type":"mc","q":"Solve T(n) = 2T(n − 1) + 1 with T(1) = 1 by a recursion tree or by expanding.","options":["Θ(2ⁿ)","Θ(n)","Θ(n lg n)","Θ(n²)"],"answer":0,"explain":"Level i has 2^{i} nodes of cost 1 and there are n levels, so T(n) = 1 + 2 + … + 2^{n−1} = 2ⁿ − 1 = Θ(2ⁿ). Θ(n) would hold for T(n − 1) + 1 with one recursive call; halving the size is what keeps divide-and-conquer trees short.","ref":"CLRS 4.4","slide":13},
{"id":"L3-21","topic":"L3","type":"ms","q":"For which driving functions f(n) does T(n) = 4T(n/2) + f(n) solve to Θ(n²)? Select all that apply.","options":["f(n) = n²","f(n) = n²/lg n","f(n) = n^{2.5}","f(n) = n","f(n) = n lg n"],"answer":[3,4],"explain":"n and n lg n are both O(n^{2−ε}) (e.g. ε = 1/2), so case 1 gives Θ(n²). f = n² is case 2: Θ(n² lg n); n^{2.5} is case 3: Θ(n^{2.5}). n²/lg n is the lecture's 'master method does not apply' example; its solution is Θ(n² lg lg n), not Θ(n²).","ref":"CLRS 4.5","slide":32},
{"id":"L3-22","topic":"L3","type":"tf","q":"In master-theorem case 2 (f(n) = Θ(n^{log_{b} a})), the recursion tree has roughly the same total cost on each of its log_{b} n levels, which is where the extra lg n factor in Θ(n^{log_{b} a} lg n) comes from.","answer":true,"explain":"With f(n) = n^{log_{b} a}, level j costs a^{j}·f(n/b^{j}) = n^{log_{b} a} for every j. Multiplying by about log_{b} n levels gives Θ(n^{log_{b} a} lg n).","ref":"CLRS 4.6","slide":29},
{"id":"L4-01","topic":"L4","type":"mc","q":"Solve T(n) = 5T(n/2) + n² with the master theorem.","options":["Θ(n² lg n)","Θ(n^{lg 5})","Θ(n^{lg 5} lg n)","Θ(n²)"],"answer":1,"explain":"a = 5, b = 2, so n^{log_{b} a} = n^{lg 5} ≈ n^{2.32}. Since f(n) = n² = O(n^{lg 5 − ε}) with ε ≈ 0.32, case 1 gives Θ(n^{lg 5}). Θ(n²) would need f to dominate, but n² is polynomially smaller than n^{lg 5}.","ref":"CLRS 4.5","slide":25},
{"id":"L4-02","topic":"L4","type":"mc","q":"For T(n) = 2T(n/3) + n lg n, which case of the master theorem applies, and what is T(n)?","options":["Case 1: Θ(n^{log_{3} 2})","Case 2: Θ(n^{log_{3} 2} lg n)","Case 3: Θ(n lg n)","Does not apply: n lg n is not polynomially larger than n^{log_{3} 2}"],"answer":2,"explain":"n^{log_{3} 2} ≈ n^{0.63}, and n lg n = Ω(n^{0.63 + ε}) (e.g. ε = 0.3). Regularity holds: 2(n/3) lg(n/3) ≤ (2/3) n lg n, so c = 2/3 < 1 and case 3 gives Θ(n lg n). The lg n factor only causes a gap when f is within a log factor of n^{log_{b} a}, which is not the case here.","ref":"CLRS 4.5","slide":7},
{"id":"L4-03","topic":"L4","type":"mc","q":"T(n) = 2T(n/2) + n lg n falls in the gap between cases 2 and 3. Using the extension f(n) = Θ(n^{log_{b} a} lg^{k} n) ⇒ T(n) = Θ(n^{log_{b} a} lg^{k+1} n), what is T(n)?","options":["Θ(n lg n lg lg n)","Θ(n lg n)","Θ(n lg² n)","Θ(n²)"],"answer":2,"explain":"Here n^{log_{b} a} = n and f(n) = n lg¹ n, so k = 1 and T(n) = Θ(n lg² n). Θ(n lg n) is what you get if you wrongly treat the case as case 3 and answer Θ(f(n)).","ref":"CLRS Ex 4.6-2","slide":9},
{"id":"L4-04","topic":"L4","type":"mc","q":"For T(n) = 5T(n/3) + n², case 3 applies. Which constant c < 1 shows the regularity condition a f(n/b) ≤ c f(n)?","options":["c = 3/5","c = 9/25","c = 5/9","c = 5/3"],"answer":2,"explain":"a f(n/b) = 5 (n/3)² = (5/9) n², so c = 5/9 < 1 works and T(n) = Θ(n²). 5/3 is a/b, which forgets to square n/3, and is not even below 1.","ref":"CLRS 4.5","slide":26},
{"id":"L4-05","topic":"L4","type":"mc","q":"The simple method for multiplying two n-bit integers splits each into halves and makes 4 half-size multiplications plus Θ(n) work: T(n) = 4T(n/2) + Θ(n). What is T(n)?","options":["Θ(n^{lg 3})","Θ(n² lg n)","Θ(n²)","Θ(n lg n)"],"answer":2,"explain":"n^{log_{2} 4} = n², and f(n) = Θ(n) = O(n^{2 − ε}) with ε = 1, so case 1 gives Θ(n²), no better than the grade-school method. Θ(n^{lg 3}) is Karatsuba's bound, which needs only 3 half-size products.","ref":"CLRS 4.5","slide":3},
{"id":"L4-06","topic":"L4","type":"mc","q":"Solve T(n) = 2T(√n) + lg n (assume T is constant for small n).","options":["Θ(lg lg n)","Θ(lg n lg lg n)","Θ(lg n)","Θ(√n lg n)"],"answer":1,"explain":"Let m = lg n and S(m) = T(2^{m}). Then S(m) = 2S(m/2) + m, which is master case 2: S(m) = Θ(m lg m). Substituting back, T(n) = Θ(lg n lg lg n). Θ(lg lg n) is the answer for T(n) = T(√n) + 1, which has a = 1 and f = 1.","ref":"CLRS 4.3","slide":28},
{"id":"L4-07","topic":"L4","type":"mc","q":"Which conclusion is correct for T(n) = 2T(n/2) + n/lg n?","options":["Case 3: Θ(n/lg n)","Case 1: Θ(n)","Case 2: Θ(n lg n)","The master theorem does not apply: f(n) is smaller than n only by a lg n factor, not polynomially"],"answer":3,"explain":"n^{log_{b} a} = n and f(n) = n/lg n is smaller, but only by a lg n factor: n/lg n is not O(n^{1 − ε}) for any ε > 0. It falls in the gap between cases 1 and 2. (Its actual solution, Θ(n lg lg n), comes from a recursion tree, not the master theorem.)","ref":"CLRS 4.5","slide":9},
{"id":"L4-08","topic":"L4","type":"mc","q":"In the recursion tree for T(n) = aT(n/b) + f(n) with n an exact power of b, how many leaves are there?","options":["log_{b} n","a · log_{b} n","n^{log_{b} a}","n^{log_{a} b}"],"answer":2,"explain":"The tree has depth log_{b} n and each node has a children, so it has a^{log_{b} n} = n^{log_{b} a} leaves. Each costs Θ(1), giving the Θ(n^{log_{b} a}) term in Lemma 4.2. log_{b} n is the depth, not the leaf count.","ref":"CLRS 4.6","slide":12},
{"id":"L4-09","topic":"L4","type":"mc","q":"Solve T(n) = 3T(n/9) + √n.","options":["Θ(√n lg n)","Θ(n^{log_{3} 9})","Θ(n)","Θ(√n)"],"answer":0,"explain":"a = 3, b = 9: n^{log_{9} 3} = n^{1/2} = √n = Θ(f(n)), so case 2 gives Θ(√n lg n). Answering Θ(√n) ignores the lg n factor from the log_{b} n levels that each cost Θ(√n).","ref":"CLRS 4.5","slide":24},
{"id":"L4-10","topic":"L4","type":"mc","q":"In the simplified form T(n) = aT(n/b) + c·n^{k} (a ≥ 1, b ≥ 2, c > 0, k ≥ 0), what is T(n) when a < b^{k}?","options":["Θ(n^{log_{b} a})","Θ(n^{k} lg n)","Θ(n^{log_{b} a} lg n)","Θ(n^{k})"],"answer":3,"explain":"a < b^{k} means k > log_{b} a, so f(n) = cn^{k} dominates (case 3; regularity holds with ratio a/b^{k} < 1) and T(n) = Θ(n^{k}). Θ(n^{log_{b} a}) is the a > b^{k} case and Θ(n^{k} lg n) is the a = b^{k} case.","ref":"CLRS 4.5","slide":23},
{"id":"L4-11","topic":"L4","type":"tf","q":"For f(n) = n^{k} with k > log_{b} a, the regularity condition of case 3 holds automatically.","answer":true,"explain":"a f(n/b) = a (n/b)^{k} = (a/b^{k}) n^{k}, and b^{k} > b^{log_{b} a} = a, so c = a/b^{k} < 1 works. For polynomial f you only need to compare exponents; for unusual f (e.g. oscillating ones) regularity must be checked.","ref":"CLRS 4.5","slide":5},
{"id":"L4-12","topic":"L4","type":"tf","q":"T(n) = 2T(n/2) + n lg n is solved by case 3 of the master theorem, because n lg n = Ω(n).","answer":false,"explain":"Case 3 needs f(n) = Ω(n^{1 + ε}) for some ε > 0. n lg n / n = lg n, which is asymptotically smaller than n^{ε} for every ε > 0, so f is larger but not polynomially larger. The recurrence falls in the gap between cases 2 and 3.","ref":"CLRS 4.5","slide":8},
{"id":"L4-13","topic":"L4","type":"tf","q":"If f(n) = n^{log_{b} a}/lg n, the recurrence T(n) = aT(n/b) + f(n) falls in the gap between cases 1 and 2.","answer":true,"explain":"f is asymptotically smaller than n^{log_{b} a}, but only by a lg n factor, not by a polynomial factor n^{ε}, so case 1 does not apply; and f is not Θ(n^{log_{b} a}), so case 2 does not apply either.","ref":"CLRS 4.5","slide":9},
{"id":"L4-14","topic":"L4","type":"tf","q":"T(n) = 27T(n/3) + n³ has solution Θ(n³).","answer":false,"explain":"n^{log_{3} 27} = n³ = Θ(f(n)), so this is case 2: T(n) = Θ(n³ lg n). Each of the log_{3} n levels of the recursion tree contributes n³.","ref":"CLRS 4.5","slide":27},
{"id":"L4-15","topic":"L4","type":"tf","q":"T(n) = T(√n) + 1 has solution Θ(lg lg n).","answer":true,"explain":"With m = lg n and S(m) = T(2^{m}), the recurrence becomes S(m) = S(m/2) + 1, which is case 2 (a = 1, b = 2): S(m) = Θ(lg m). So T(n) = Θ(lg lg n).","ref":"CLRS 4.3","slide":28},
{"id":"L4-16","topic":"L4","type":"tf","q":"For n an exact power of b, the recursion tree of T(n) = aT(n/b) + f(n) has depth log_{b} n, and its level j (0 ≤ j < log_{b} n) contributes a^{j} f(n/b^{j}) in total.","answer":true,"explain":"Level j has a^{j} nodes, each with subproblem size n/b^{j}. Summing these levels and adding Θ(n^{log_{b} a}) for the leaves gives Lemma 4.2: T(n) = Θ(n^{log_{b} a}) + ∑_{j=0}^{log_{b} n − 1} a^{j} f(n/b^{j}).","ref":"CLRS 4.6","slide":11},
{"id":"L4-17","topic":"L4","type":"tf","q":"The master theorem only holds for n an exact power of b; replacing n/b with ⌈n/b⌉ or ⌊n/b⌋ can change the asymptotic solution.","answer":false,"explain":"The proof extends to all integers: with ceilings, the j-th level subproblem size n_{j} ≤ n/b^{j} + b/(b − 1), so the extra terms are O(1) and the same three bounds hold. Floors and ceilings do not change the result.","ref":"CLRS 4.6","slide":19},
{"id":"L4-18","topic":"L4","type":"tf","q":"T(n) = 2T(n/2) + n³ has solution Θ(n³ lg n).","answer":false,"explain":"n^{log_{2} 2} = n and f(n) = n³ = Ω(n^{1 + ε}) with ε = 2; regularity holds with c = 2/8 = 1/4. By case 3, T(n) = Θ(n³). The extra lg n factor belongs only to case 2.","ref":"CLRS 4.5","slide":23},
{"id":"L4-19","topic":"L4","type":"tf","q":"The master theorem cannot be applied to T(n) = T(n − 1) + n, whose solution is Θ(n²).","answer":true,"explain":"The master theorem needs the subproblem size to be n/b with b > 1; here the size shrinks by subtraction. Unrolling gives n + (n − 1) + … + 1 = Θ(n²).","ref":"CLRS 4.5","slide":5},
{"id":"L4-20","topic":"L4","type":"tf","q":"If f(n) = Ω(n^{log_{b} a + ε}) for some ε > 0, the conclusion T(n) = Θ(f(n)) holds even without checking the regularity condition a f(n/b) ≤ c f(n).","answer":false,"explain":"Case 3 needs both conditions. CLRS Ex 4.5-5 asks for a = 1, b = 2 and an f that is polynomially larger than n^{0} = 1 yet violates regularity, so the theorem cannot conclude Θ(f(n)) for it. For ordinary polynomial f the check is easy, but it is part of the theorem.","ref":"CLRS 4.5","slide":9},
{"id":"L4-21","topic":"L4","type":"tf","q":"Using the extension of case 2 (f(n) = Θ(n^{log_{b} a} lg^{k} n) with k ≥ 0), T(n) = 4T(n/2) + n² lg n = Θ(n² lg² n).","answer":true,"explain":"n^{log_{2} 4} = n² and f(n) = n² lg¹ n, so k = 1 and T(n) = Θ(n² lg² n). The basic master theorem does not apply because n² lg n is not polynomially larger than n².","ref":"CLRS Ex 4.6-2","slide":9},
{"id":"L4-22","topic":"L4","type":"ms","q":"Which recurrences can NOT be solved with the basic master theorem (CLRS Theorem 4.1)?","options":["T(n) = (1/2)T(n/2) + n","T(n) = 3T(n/2) + n","T(n) = 2T(n/2) + n/lg n","T(n) = 4T(n/2) + n² lg n","T(n) = 4T(n/2) + n³"],"answer":[0,2,3],"explain":"n/lg n is smaller than n only by a lg n factor (gap between cases 1 and 2); n² lg n is larger than n² only by a lg n factor (gap between 2 and 3); a = 1/2 < 1 violates the requirement a ≥ 1. 4T(n/2) + n³ is case 3 (Θ(n³)) and 3T(n/2) + n is case 1 (Θ(n^{lg 3})).","ref":"CLRS 4.5","slide":9},
{"id":"L4-23","topic":"L4","type":"ms","q":"For T(n) = 4T(n/2) + f(n), which choices of f(n) put the recurrence in case 3 of the master theorem?","options":["f(n) = n³","f(n) = n^{2.5}","f(n) = n² lg n","f(n) = n²","f(n) = n^{1.99}"],"answer":[0,1],"explain":"n^{log_{2} 4} = n². n³ and n^{2.5} are polynomially larger (ε = 1 and 0.5), and regularity holds (c = 1/2 and 1/√2). n² lg n is only a lg n factor larger (gap), n² is case 2, and n^{1.99} is case 1.","ref":"CLRS 4.5","slide":5},
{"id":"L4-24","topic":"L4","type":"ms","q":"Which are requirements of the master theorem for T(n) = aT(n/b) + f(n)?","options":["b is an integer","f(n) is a polynomial in n","n is an exact power of b","a ≥ 1 and b > 1 are constants","f(n) is asymptotically positive"],"answer":[3,4],"explain":"The theorem needs constants a ≥ 1 and b > 1 and an asymptotically positive f. b need not be an integer (T(n) = T(2n/3) + 1 uses b = 3/2), f need not be a polynomial (n lg n works in case 3), and n need not be an exact power of b (floors and ceilings don't change the result).","ref":"CLRS 4.5","slide":5},
{"id":"L4-25","topic":"L4","type":"ms","q":"Which recurrence–solution pairs are correct?","options":["T(n) = 2T(n/2) + √n → Θ(√n)","T(n) = 16T(n/2) + n⁴ → Θ(n⁴ lg n)","T(n) = T(n/2) + 2^{n} → Θ(2^{n})","T(n) = 4T(n/2) + n² → Θ(n²)","T(n) = 8T(n/2) + n² lg n → Θ(n³)"],"answer":[1,2,4],"explain":"16T(n/2) + n⁴: n^{log_{2} 16} = n⁴, case 2 → Θ(n⁴ lg n). T(n/2) + 2^{n}: case 3, regularity 2^{n/2} ≤ c·2^{n}, so Θ(2^{n}). 8T(n/2) + n² lg n: n² lg n = O(n^{3 − ε}), case 1 → Θ(n³). 4T(n/2) + n² is case 2, Θ(n² lg n), not Θ(n²); 2T(n/2) + √n is case 1, Θ(n), not Θ(√n).","ref":"CLRS 4.5","slide":23},
{"id":"L5-01","topic":"L5","type":"mc","q":"Evaluate A(x) = 3 + 2x − x² + x³ at x = 2 with Horner's rule, A(x) = a_{0} + x(a_{1} + x(a_{2} + x·a_{3})). What is the value, and how many arithmetic operations does Horner's rule use for a degree-bound n polynomial?","options":["11, with Θ(n²) operations","19, with Θ(n) operations","13, with Θ(n lg n) operations","11, with Θ(n) operations"],"answer":3,"explain":"Inside out: 1 → −1 + 2·1 = 1 → 2 + 2·1 = 4 → 3 + 2·4 = 11. Each coefficient costs one multiplication and one addition, so Θ(n) operations. Computing each power x^{j} from scratch would take Θ(n²).","ref":"CLRS 30.1","slide":6},
{"id":"L5-02","topic":"L5","type":"mc","q":"For A(x) = 1 + 2x + 3x² + 4x³, FFT writes A(x) = A^{[0]}(x²) + x·A^{[1]}(x²). What is A^{[1]}(y) (the odd-index polynomial)?","options":["2 + 4y","1 + 3y","2 + 4y²","2y + 4y³"],"answer":0,"explain":"A^{[1]} collects the odd-index coefficients a_{1}, a_{3} = 2, 4 as a polynomial in y: A^{[1]}(y) = 2 + 4y. Then x·A^{[1]}(x²) = 2x + 4x³. 1 + 3y is A^{[0]}, the even part.","ref":"CLRS 30.2","slide":12},
{"id":"L5-03","topic":"L5","type":"mc","q":"Let ω_{8} = e^{2πi/8} be the principal 8th root of unity. What is ω_{8}^{2}?","options":["(√2/2)(1 + i)","−1","i","−i"],"answer":2,"explain":"ω_{8}^{2} = e^{2πi·2/8} = e^{πi/2} = cos(π/2) + i sin(π/2) = i. Equivalently, by the cancellation lemma, ω_{8}^{2} = ω_{4}. −1 is ω_{8}^{4} = ω_{2}.","ref":"CLRS 30.2","slide":15},
{"id":"L5-04","topic":"L5","type":"mc","q":"Using ω_{4} = e^{2πi/4} = i, what is the DFT y = (y_{0}, y_{1}, y_{2}, y_{3}) of a = (1, 2, 3, 4), where y_{k} = ∑_{j} a_{j} ω_{4}^{kj}?","options":["`(10, −2, −2−2i, −2+2i)`","`(2.5, −0.5−0.5i, −0.5, −0.5+0.5i)`","`(10, −2−2i, −2, −2+2i)`","`(10, −2+2i, −2, −2−2i)`"],"answer":2,"explain":"y_{0} = 1+2+3+4 = 10; y_{1} = 1 + 2i + 3i² + 4i³ = 1 + 2i − 3 − 4i = −2 − 2i; y_{2} = 1 − 2 + 3 − 4 = −2; y_{3} = 1 − 2i − 3 + 4i = −2 + 2i. Swapping y_{1} and y_{3} is the result for ω = −i (the inverse-transform sign), and dividing by 4 belongs only to the inverse DFT.","ref":"CLRS 30.2","slide":17},
{"id":"L5-05","topic":"L5","type":"mc","q":"What recurrence describes `RECURSIVE-FFT` on an input vector of length n (a power of 2), and what does it solve to?","options":["T(n) = T(n/2) + Θ(n) = Θ(n)","T(n) = 2T(n/2) + Θ(n) = Θ(n lg n)","T(n) = 4T(n/2) + Θ(n) = Θ(n²)","T(n) = 2T(n/2) + Θ(1) = Θ(n)"],"answer":1,"explain":"Each call makes two recursive calls on length n/2 (even and odd coefficients) and spends Θ(n) in the combining loop, so T(n) = 2T(n/2) + Θ(n) = Θ(n lg n) by master case 2. The combining loop is not Θ(1): it runs n/2 butterfly iterations.","ref":"CLRS 30.2","slide":22},
{"id":"L5-06","topic":"L5","type":"mc","q":"The butterfly operation computes t = ω·y_{k}^{[1]}, y_{k} = y_{k}^{[0]} + t, y_{k+n/2} = y_{k}^{[0]} − t. How many complex operations does it use?","options":["2 complex multiplications and 2 complex additions/subtractions","1 complex multiplication and 2 complex additions/subtractions","1 complex multiplication and 1 complex addition","2 complex multiplications and 1 complex addition"],"answer":1,"explain":"The twiddle product ω·y_{k}^{[1]} is computed once and stored in t (the common-subexpression trick), then reused by one addition and one subtraction. So 1 complex multiplication and 2 complex additions/subtractions. Without t, the multiplication would be done twice.","ref":"CLRS 30.3","slide":23},
{"id":"L5-07","topic":"L5","type":"mc","q":"In the recursion tree of `RECURSIVE-FFT` for n = 8, in what left-to-right order do the coefficients appear at the leaves (the order an iterative FFT needs as input)?","options":["`a0, a4, a1, a5, a2, a6, a3, a7`","`a0, a2, a4, a6, a1, a3, a5, a7`","`a0, a1, a2, a3, a4, a5, a6, a7`","`a0, a4, a2, a6, a1, a5, a3, a7`"],"answer":3,"explain":"Each level splits a vector into even and odd positions: (a_{0}, a_{2}, a_{4}, a_{6}) | (a_{1}, a_{3}, a_{5}, a_{7}), then (a_{0}, a_{4}) (a_{2}, a_{6}) (a_{1}, a_{5}) (a_{3}, a_{7}). The leaf order is the bit-reversal permutation, e.g. leaf 1 = rev(001) = 100 = 4. a_{0}, a_{2}, a_{4}, a_{6}, a_{1}, … is just the first split.","ref":"CLRS 30.3","slide":26},
{"id":"L5-08","topic":"L5","type":"mc","q":"The parallel FFT circuit for n inputs (n a power of 2) is made of butterfly stages. What is its depth?","options":["Θ(n lg n)","Θ(lg n)","Θ(1)","Θ(n)"],"answer":1,"explain":"There are lg n stages, each made of n/2 butterflies that work in parallel, so the depth is Θ(lg n). Θ(n lg n) is the total number of butterfly operations (the circuit's size), not its depth.","ref":"CLRS 30.3","slide":33},
{"id":"L5-09","topic":"L5","type":"tf","q":"Given A and B in point-value form at the same points, both their sum and their product (with enough points) can be computed with Θ(n) arithmetic operations.","answer":true,"explain":"Point-value form adds and multiplies pointwise: (x_{k}, y_{k} + z_{k}) and (x_{k}, y_{k}·z_{k}). In coefficient form, addition is also Θ(n) but brute-force multiplication (convolution) is Θ(n²).","ref":"CLRS 30.1","slide":5},
{"id":"L5-10","topic":"L5","type":"tf","q":"To multiply two polynomials of degree-bound n in point-value form, it is enough to have each of them evaluated at the same n points.","answer":false,"explain":"The product C = AB has degree-bound 2n − 1 (degree up to 2n − 2), so it needs 2n − 1 point-value pairs to be determined uniquely. A and B must therefore be extended to 2n − 1 (in practice 2n) points first.","ref":"CLRS 30.1","slide":8},
{"id":"L5-11","topic":"L5","type":"tf","q":"For even n > 0, the squares of the n complex nth roots of unity are the n/2 complex (n/2)th roots of unity, each obtained exactly twice.","answer":true,"explain":"This is the halving lemma: (ω_{n}^{k+n/2})² = ω_{n}^{2k} = (ω_{n}^{k})², and ω_{n}^{2k} = ω_{n/2}^{k}. It is why A^{[0]} and A^{[1]} only need to be evaluated at n/2 points, which gives the 2T(n/2) recurrence.","ref":"CLRS 30.2","slide":20},
{"id":"L5-12","topic":"L5","type":"tf","q":"For every integer k, ∑_{j=0}^{n−1} (ω_{n}^{k})^{j} = 0.","answer":false,"explain":"The summation lemma needs k not divisible by n. If n | k then ω_{n}^{k} = 1 and the sum is n (e.g. k = 0). That case is what puts n on the diagonal of F_{n}(ω)·F_{n}(ω^{−1}) = nE_{n}, while the k ≠ 0 case gives the zeros off the diagonal.","ref":"CLRS 30.2","slide":16},
{"id":"L5-13","topic":"L5","type":"tf","q":"The inverse DFT can be computed by running the FFT with ω_{n}^{−1} in place of ω_{n} and dividing each result by n, so interpolation at the roots of unity takes Θ(n lg n) time.","answer":true,"explain":"The inverse DFT matrix has (j, k) entry ω_{n}^{−kj}/n, so a_{j} = (1/n) ∑_{k} y_{k} ω_{n}^{−kj}. This is the same kind of sum as the forward DFT, so the same algorithm works with ω_{n}^{−1} plus a final division by n.","ref":"CLRS 30.2","slide":29},
{"id":"L5-14","topic":"L5","type":"tf","q":"A polynomial of degree-bound n (degree at most n − 1) is uniquely determined by its values at any n − 1 distinct points.","answer":false,"explain":"It takes n distinct points. With n points the Vandermonde matrix is invertible, so the coefficients are unique. With only n − 1 points, adding c·∏(x − x_{k}) changes the polynomial but not the given values.","ref":"CLRS 30.1","slide":7},
{"id":"L5-15","topic":"L5","type":"tf","q":"In `RECURSIVE-FFT`'s combining loop, both outputs are computed with a plus sign: y_{k} = y_{k}^{[0]} + ω y_{k}^{[1]} and y_{k+n/2} = y_{k}^{[0]} + ω y_{k}^{[1]}.","answer":false,"explain":"The second output uses a minus sign: y_{k+n/2} = y_{k}^{[0]} − ω y_{k}^{[1]}, because ω_{n}^{k+n/2} = −ω_{n}^{k}. Using + would make the two outputs identical.","ref":"CLRS 30.2","slide":21},
{"id":"L5-16","topic":"L5","type":"tf","q":"A d-dimensional DFT on an array of n = n_{1}n_{2}…n_{d} elements can be computed with 1-dimensional FFTs along each dimension in turn, in O(n lg n) total time regardless of d.","answer":true,"explain":"Dimension i needs n/n_{i} FFTs of length n_{i}, costing O(n lg n_{i}). Summing over i gives O(n(lg n_{1} + … + lg n_{d})) = O(n lg n), because the lg n_{i} add up to lg n.","ref":"CLRS Prob 30-3","slide":22},
{"id":"L5-17","topic":"L5","type":"tf","q":"Given values of a degree-bound n polynomial at n arbitrary distinct points, the FFT can recover its coefficients in Θ(n lg n) time.","answer":false,"explain":"The FFT's speed depends on the evaluation points being the complex nth roots of unity (halving lemma). For arbitrary points, Lagrange's formula takes Θ(n²), and solving the Vandermonde system directly takes Θ(n³).","ref":"CLRS 30.1","slide":10},
{"id":"L5-18","topic":"L5","type":"tf","q":"The (j, k) entry of the inverse DFT matrix V_{n}^{−1} is ω_{n}^{−kj}/n.","answer":true,"explain":"The (j, j') entry of V_{n}^{−1}V_{n} is ∑_{k} ω_{n}^{−kj}ω_{n}^{kj'}/n = ∑_{k} ω_{n}^{k(j'−j)}/n, which is 1 when j = j' and 0 otherwise by the summation lemma.","ref":"CLRS 30.2","slide":19},
{"id":"L5-19","topic":"L5","type":"ms","q":"Which statements about the complex nth roots of unity (n even, ω_{n} = e^{2πi/n}) are true?","options":["ω_{dn}^{dk} = ω_{n}^{k} for integers d > 0, k ≥ 0","ω_{n}^{k+n/2} = ω_{n}^{k}","There are exactly n − 1 distinct nth roots of unity","ω_{n}^{n} = 1","ω_{n}^{n/2} = −1"],"answer":[0,3,4],"explain":"ω_{n}^{n} = e^{2πi} = 1; ω_{n}^{n/2} = e^{πi} = −1; the cancellation lemma gives ω_{dn}^{dk} = ω_{n}^{k}. Adding n/2 to the exponent negates the root, ω_{n}^{k+n/2} = −ω_{n}^{k}, rather than leaving it unchanged; and there are n distinct roots ω_{n}^{0}, …, ω_{n}^{n−1}, not n − 1.","ref":"CLRS 30.2","slide":16},
{"id":"L5-20","topic":"L5","type":"ms","q":"In FFT-based multiplication of two polynomials A and B of degree-bound n (n a power of 2), which statements are correct?","options":["The product C has degree-bound n","A and B are padded with zeros to degree-bound 2n before the FFT","The pointwise multiplication step takes Θ(n) time","Interpolation is done with an inverse FFT in Θ(n lg n) time","Evaluation uses Horner's rule at each of the 2n points"],"answer":[1,2,3],"explain":"Both inputs are padded to degree-bound 2n and evaluated at the 2n-th roots of unity by FFT (Θ(n lg n)); pointwise multiplication costs Θ(n); one inverse FFT (Θ(n lg n)) interpolates C. Evaluating with Horner at each point would cost Θ(n²) and defeat the purpose, and C = AB has degree-bound 2n − 1, not n.","ref":"CLRS 30.1","slide":13},
{"id":"L5-21","topic":"L5","type":"ms","q":"Which of these polynomial operations take Θ(n) time (n = degree-bound, n points where relevant)?","options":["Adding two polynomials in point-value form","Multiplying two polynomials in point-value form","Multiplying two polynomials in coefficient form by brute force","Evaluating a point-value polynomial at a new point with Lagrange's formula","Adding two polynomials in coefficient form"],"answer":[0,1,4],"explain":"Addition is Θ(n) in both representations, and multiplication is Θ(n) in point-value form (given 2n − 1 points). Brute-force multiplication in coefficient form is Θ(n²), and evaluating a point-value polynomial at a new point with Lagrange's formula is Θ(n²).","ref":"CLRS 30.1","slide":5},
{"id":"L6-01","topic":"L6","type":"mc","q":"In a binary heap stored in a 1-based array `A[1..n]` (n ≥ 27), what are the parent and children indices of node i = 13?","options":["Parent 7; children 26 and 27","Parent 6; children 27 and 28","Parent 7; children 25 and 26","Parent 6; children 26 and 27"],"answer":3,"explain":"PARENT(i) = ⌊i/2⌋ = 6, LEFT(i) = 2i = 26, RIGHT(i) = 2i + 1 = 27. Parent 7 with children 25 and 26 comes from the 0-based formulas (⌊(i−1)/2⌋, 2i+1, 2i+2), which do not apply to CLRS 1-based heaps.","ref":"CLRS 6.1","slide":6},
{"id":"L6-02","topic":"L6","type":"mc","q":"What array results from running `BUILD-MAX-HEAP` (CLRS 3e, 1-based) on A = `⟨3, 9, 2, 1, 4, 5, 8, 7, 6⟩`?","answer":0,"explain":"MAX-HEAPIFY is called for i = ⌊9/2⌋ = 4 down to 1, and each call keeps sifting down. At i = 1 the key 3 sinks from A[1] through A[2] and A[4] to A[9]. `⟨9, 7, 8, 6, 3, 2, 5, 1, 4⟩` is what nine successive MAX-HEAP-INSERTs produce (also a heap, but not BUILD-MAX-HEAP's output); `⟨9, 3, 8, 7, 4, 5, 2, 1, 6⟩` comes from swapping only once per node without recursing, which leaves 3 above 7 and 6.","ref":"CLRS 6.3","slide":15,"options":["`⟨9, 7, 8, 6, 4, 5, 2, 1, 3⟩`","`⟨9, 7, 8, 6, 3, 2, 5, 1, 4⟩`","`⟨9, 8, 7, 6, 5, 4, 3, 2, 1⟩`","`⟨9, 3, 8, 7, 4, 5, 2, 1, 6⟩`"]},
{"id":"L6-03","topic":"L6","type":"mc","q":"A = `⟨20, 4, 18, 15, 11, 9, 6, 3, 13, 7⟩` (1-based) is a max-heap except possibly at node 2. What is A after `MAX-HEAPIFY(A, 2)`?","options":["`⟨20, 15, 18, 13, 11, 9, 6, 4, 3, 7⟩`","`⟨20, 15, 18, 13, 11, 9, 6, 3, 4, 7⟩`","`⟨20, 15, 18, 4, 11, 9, 6, 3, 13, 7⟩`","`⟨20, 11, 18, 15, 4, 9, 6, 3, 13, 7⟩`"],"answer":1,"explain":"A[2] = 4 is swapped with its larger child A[4] = 15, then MAX-HEAPIFY(A, 4) swaps 4 with its larger child A[9] = 13. Stopping after one swap gives `⟨20, 15, 18, 4, 11, 9, 6, 3, 13, 7⟩`, which still violates the heap property at node 4.","ref":"CLRS 6.2","slide":12},
{"id":"L6-04","topic":"L6","type":"mc","q":"`HEAP-EXTRACT-MAX` is applied to the max-heap A = `⟨30, 22, 25, 14, 20, 18, 9, 8, 6, 17⟩`. It returns 30. What is the heap afterwards?","options":["`⟨25, 22, 17, 14, 20, 18, 9, 8, 6⟩`","`⟨25, 22, 18, 14, 20, 9, 17, 8, 6⟩`","`⟨25, 22, 18, 14, 20, 17, 9, 8, 6⟩`","`⟨22, 25, 18, 14, 20, 17, 9, 8, 6⟩`"],"answer":2,"explain":"A[1] is overwritten by the last element 17, heap-size drops to 9, and MAX-HEAPIFY(A, 1) sifts 17 down: swap with 25 (A[3]), then with 18 (A[6]). `⟨22, 25, 18, 14, 20, 17, 9, 8, 6⟩` is not even a heap (22 above 25); `⟨25, 22, 17, 14, 20, 18, 9, 8, 6⟩` stops sifting too early (17 above 18).","ref":"CLRS 6.5","slide":27},
{"id":"L6-05","topic":"L6","type":"mc","q":"`MAX-HEAP-INSERT` adds key 24 to the max-heap A = `⟨30, 22, 25, 14, 20, 18, 9, 8, 6, 17⟩`. What is the resulting array?","options":["`⟨30, 22, 25, 14, 20, 18, 9, 8, 6, 17, 24⟩`","`⟨30, 22, 25, 14, 24, 18, 9, 8, 6, 17, 20⟩`","`⟨30, 25, 24, 14, 22, 18, 9, 8, 6, 17, 20⟩`","`⟨30, 24, 25, 14, 22, 18, 9, 8, 6, 17, 20⟩`"],"answer":3,"explain":"24 is placed at A[11]; its parent A[5] = 20 is smaller, so they swap; then parent A[2] = 22 is smaller, so they swap again; parent A[1] = 30 is larger, so it stops. Appending 24 without moving it up leaves it below 20, which breaks the heap property.","ref":"CLRS 6.5","slide":25},
{"id":"L6-06","topic":"L6","type":"mc","q":"`HEAPSORT` is run on A = `⟨2, 8, 5, 3, 9, 1⟩`. What does A look like right after the first iteration of its for loop (one exchange and one `MAX-HEAPIFY`)?","options":["`⟨8, 3, 5, 1, 2, 9⟩`","`⟨1, 8, 5, 3, 2, 9⟩`","`⟨8, 5, 3, 2, 1, 9⟩`","`⟨5, 8, 1, 3, 2, 9⟩`"],"answer":0,"explain":"BUILD-MAX-HEAP gives `⟨9, 8, 5, 3, 2, 1⟩`. The loop swaps A[1] with A[6] (9 goes to the end), shrinks heap-size to 5, and MAX-HEAPIFY(A, 1) sifts 1 down past 8 and 3. `⟨1, 8, 5, 3, 2, 9⟩` omits the MAX-HEAPIFY call.","ref":"CLRS 6.4","slide":21},
{"id":"L6-07","topic":"L6","type":"mc","q":"A binary heap holds n = 20 elements in `A[1..20]`. What is its height, and which indices hold the leaves?","options":["Height 5; leaves A[16..20]","Height 4; leaves A[11..20]","Height 5; leaves A[11..20]","Height 4; leaves A[10..20]"],"answer":1,"explain":"Height = ⌊lg n⌋ = ⌊lg 20⌋ = 4 (edges on the longest root-to-leaf path), and the leaves are A[⌊n/2⌋+1 .. n] = A[11..20]. Node 10 is not a leaf: its left child is 2·10 = 20.","ref":"CLRS Ex 6.1-7","slide":13},
{"id":"L6-08","topic":"L6","type":"mc","q":"What are the minimum and maximum numbers of elements in a binary heap of height h?","options":["h and 2^{h}","2^{h−1} and 2^{h}","2^{h} − 1 and 2^{h+1} − 1","2^{h} and 2^{h+1} − 1"],"answer":3,"explain":"The top h levels (depths 0..h−1) are full, giving 2^{h} − 1 nodes, and the bottom level holds between 1 and 2^{h} nodes. So the count is between 2^{h} and 2^{h+1} − 1. 2^{h} − 1 is the size of a full tree of height h − 1, one node short of height h.","ref":"CLRS Ex 6.1-1","slide":5},
{"id":"L6-09","topic":"L6","type":"mc","q":"A 3-ary max-heap is stored in a 1-based array with the root at A[1] and each node's children stored consecutively (CLRS Prob 6-2). Which indices hold the children of node 2?","options":["4, 5, 6","6, 7, 8","7, 8, 9","5, 6, 7"],"answer":3,"explain":"The j-th child of node i is at d(i − 1) + j + 1, so node 2's children are 3·1 + 2 = 5, 6 and 7 (the root's children are 2, 3, 4). Indices 4, 5, 6 come from using the binary-heap idea 2i without accounting for d.","ref":"CLRS Prob 6-2","slide":2},
{"id":"L6-10","topic":"L6","type":"mc","q":"In a d-ary max-heap with n elements, what is the worst-case running time of `EXTRACT-MAX`?","options":["Θ(log_{d} n)","Θ(d log_{d} n)","Θ(d · n)","Θ(lg n / d)"],"answer":1,"explain":"The heap has height Θ(log_{d} n), and the d-ary MAX-HEAPIFY must compare the node with all d children at every level, so the cost is Θ(d log_{d} n). Θ(log_{d} n) is the cost of INSERT, which only follows parent pointers.","ref":"CLRS Prob 6-2","slide":27},
{"id":"L6-11","topic":"L6","type":"mc","q":"The O(n) bound for `BUILD-MAX-HEAP` follows from ∑_{h=0}^{⌊lg n⌋} ⌈n/2^{h+1}⌉ · O(h) = O(n ∑_{h≥0} h/2^{h}). What is ∑_{h=0}^{∞} h/2^{h}?","options":["1/2","1","lg n","2"],"answer":3,"explain":"With x = 1/2 in ∑ k x^{k} = x/(1 − x)², the sum is (1/2)/(1/4) = 2. Because the series converges to a constant, the total is O(n). If the sum grew like lg n, the bound would collapse back to O(n lg n).","ref":"CLRS 6.3","slide":18},
{"id":"L6-12","topic":"L6","type":"tf","q":"In an n-element heap stored in `A[1..n]`, the elements `A[⌊n/2⌋+1 .. n]` are all leaves.","answer":true,"explain":"For i ≥ ⌊n/2⌋ + 1, LEFT(i) = 2i ≥ n + 1 > n, so node i has no children. That is why BUILD-MAX-HEAP starts its loop at ⌊n/2⌋: each of these one-node subtrees is already a heap.","ref":"CLRS Ex 6.1-7","slide":13},
{"id":"L6-13","topic":"L6","type":"tf","q":"An array sorted in decreasing order is a max-heap.","answer":true,"explain":"If A[1] ≥ A[2] ≥ … ≥ A[n], then A[PARENT(i)] = A[⌊i/2⌋] ≥ A[i] because ⌊i/2⌋ < i. (Likewise an increasing array is a min-heap.)","ref":"CLRS Ex 6.1-5","slide":8},
{"id":"L6-14","topic":"L6","type":"tf","q":"In a max-heap with distinct keys, the smallest key is always stored at `A[n]`.","answer":false,"explain":"The smallest key must be a leaf (an internal node is larger than its children), but it can be any of the leaves A[⌊n/2⌋+1 .. n]. For example, ⟨10, 3, 9, 1, 2, 4⟩ is a max-heap whose minimum is at A[4], not A[6].","ref":"CLRS Ex 6.1-4","slide":8},
{"id":"L6-15","topic":"L6","type":"tf","q":"Because `BUILD-MAX-HEAP` makes about n/2 calls to `MAX-HEAPIFY`, each costing O(lg n), its worst-case running time is Θ(n lg n).","answer":false,"explain":"O(n lg n) is a correct upper bound but not tight. Most nodes are near the bottom: there are at most ⌈n/2^{h+1}⌉ nodes of height h and MAX-HEAPIFY on them costs O(h), which sums to O(n).","ref":"CLRS 6.3","slide":16},
{"id":"L6-16","topic":"L6","type":"tf","q":"The recurrence T(n) ≤ T(2n/3) + Θ(1) bounds `MAX-HEAPIFY` because a child's subtree can contain up to 2n/3 nodes, which happens when the bottom level is exactly half full.","answer":true,"explain":"When the last level is exactly half full, the left subtree is a full tree with one more level than the right subtree and holds about 2n/3 of the nodes. By master theorem case 2 (a = 1, b = 3/2), T(n) = O(lg n).","ref":"CLRS 6.2","slide":11},
{"id":"L6-17","topic":"L6","type":"tf","q":"An n-element heap has at most ⌈n/2^{h+1}⌉ nodes of height h.","answer":true,"explain":"This counting fact (CLRS Ex 6.3-3) is what makes the tighter BUILD-MAX-HEAP analysis work: about half of the nodes have height 0, a quarter height 1, and so on.","ref":"CLRS 6.3","slide":17},
{"id":"L6-18","topic":"L6","type":"tf","q":"`HEAPSORT` sorts in place and runs in O(n lg n) time in the worst case.","answer":true,"explain":"It uses only the input array plus O(1) extra storage. BUILD-MAX-HEAP is O(n), and each of the n − 1 iterations does an O(1) exchange plus an O(lg n) MAX-HEAPIFY, for O(n lg n) total.","ref":"CLRS 6.4","slide":22},
{"id":"L6-19","topic":"L6","type":"tf","q":"If the input array is already sorted in increasing order, `HEAPSORT` runs in O(n) time.","answer":false,"explain":"BUILD-MAX-HEAP must rearrange an increasing array completely, and every extraction still moves a small leaf key to the root and sifts it down about lg of the heap size levels. The running time stays Θ(n lg n).","ref":"CLRS Ex 6.4-3","slide":22},
{"id":"L6-20","topic":"L6","type":"tf","q":"`BUILD-MAX-HEAP` would still be correct if its loop ran i = 1 up to ⌊n/2⌋ instead of ⌊n/2⌋ down to 1.","answer":false,"explain":"MAX-HEAPIFY(A, i) assumes the subtrees rooted at LEFT(i) and RIGHT(i) are already max-heaps. Going bottom-up guarantees that; going top-down does not. For ⟨3, 9, 2, 1, 4, 5, 8, 7, 6⟩ the upward loop leaves 4 above 7.","ref":"CLRS 6.3","slide":13},
{"id":"L6-21","topic":"L6","type":"tf","q":"In a d-ary max-heap, `INSERT` takes Θ(log_{d} n) time, so it becomes faster as d grows.","answer":true,"explain":"INSERT only walks up parent pointers, one comparison per level, and the height is Θ(log_{d} n) = Θ(lg n / lg d). Children don't matter here, unlike EXTRACT-MAX, which pays d comparisons per level.","ref":"CLRS Prob 6-2","slide":25},
{"id":"L6-22","topic":"L6","type":"tf","q":"Since each call of `MAX-HEAPIFY` compares a node with at most two children, its worst-case running time on an n-element heap is Θ(1).","answer":false,"explain":"Each call does Θ(1) work, but it may recurse all the way down. If the root holds a key smaller than everything else, MAX-HEAPIFY is called on every node of a root-to-leaf path, so the worst case is Θ(lg n).","ref":"CLRS Ex 6.2-6","slide":9},
{"id":"L6-23","topic":"L6","type":"ms","q":"On a binary max-heap of n elements, which operations take O(lg n) worst-case time?","options":["`MAX-HEAP-INSERT`","`HEAP-EXTRACT-MAX`","`HEAP-INCREASE-KEY`","`BUILD-MAX-HEAP` on n new keys","Finding the minimum key"],"answer":[0,1,2],"explain":"INSERT and INCREASE-KEY move a key up at most the height; EXTRACT-MAX does O(1) work plus one MAX-HEAPIFY from the root. BUILD-MAX-HEAP is Θ(n), not O(lg n); finding the minimum means scanning all ⌈n/2⌉ leaves, Θ(n).","ref":"CLRS 6.5","slide":24},
{"id":"L6-24","topic":"L6","type":"ms","q":"In a max-heap `A[1..n]` with distinct keys (n ≥ 7), where can the second-largest key be?","options":["A[3]","A[4]","A[n]","A[1]","A[2]"],"answer":[0,4],"explain":"The second-largest key has only the maximum above it, so its parent must be the root: it is A[2] or A[3]. A[4]'s parent A[2] and the root are both larger, so A[4] can hold at most the third-largest key.","ref":"CLRS 6.1","slide":8},
{"id":"L6-25","topic":"L6","type":"ms","q":"Which of these 1-based arrays are max-heaps?","options":["`⟨9, 9, 8, 3, 9, 1⟩`","`⟨23, 17, 14, 6, 13, 10, 1, 5, 7, 12⟩`","`⟨50, 30, 40, 10, 20, 35, 5⟩`","`⟨40, 35, 30, 36, 20, 10⟩`","`⟨10, 9, 8, 7, 6, 5, 4⟩`"],"answer":[0,2,4],"explain":"Check A[⌊i/2⌋] ≥ A[i] for every i ≥ 2. ⟨23, 17, 14, 6, 13, 10, 1, 5, 7, 12⟩ fails at A[4] = 6 < A[9] = 7, and ⟨40, 35, 30, 36, 20, 10⟩ fails at A[2] = 35 < A[4] = 36. Equal keys are allowed, since the property is ≥.","ref":"CLRS Ex 6.1-6","slide":8},
{"id":"L6-26","topic":"L6","type":"ms","q":"Which statements about a d-ary max-heap of n elements (CLRS Prob 6-2, 1-based array) are correct?","options":["PARENT(i) = ⌊(i − 2)/d⌋ + 1","The j-th child of node i is at index d(i − 1) + j + 1","INCREASE-KEY takes Θ(d log_{d} n) time","PARENT(i) = ⌊i/d⌋","The height is Θ(log_{d} n)"],"answer":[0,1,4],"explain":"Height is Θ(log_{d} n). The parent of i is ⌊(i − 2)/d⌋ + 1 and the j-th child is d(i − 1) + j + 1, which reduce to ⌊i/2⌋ and 2i, 2i + 1 for d = 2. INCREASE-KEY only moves up, so it is Θ(log_{d} n), not Θ(d log_{d} n); ⌊i/d⌋ is wrong (for d = 3 it gives parent(5) = 1, but node 5 is a child of node 2).","ref":"CLRS Prob 6-2","slide":2},
{"id":"L7-01","topic":"L7","type":"tf","q":"Like merge sort, QUICKSORT needs a Θ(n) auxiliary array to combine the two sorted subarrays.","answer":false,"explain":"Quicksort sorts in place: PARTITION rearranges the subarray by exchanges, and after the two recursive calls the whole subarray is already sorted, so the combine step is trivial and needs no extra array.","ref":"CLRS 7.1","slide":3},
