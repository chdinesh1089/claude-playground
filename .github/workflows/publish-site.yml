name: Publish aiapps site

on:
  push:
    branches: [main]
    paths:
      - "aiapps/**"
      - "scripts/build_apps_index.py"
      - "scripts/build_site.py"
      - "scripts/build_news.py"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build site
        run: |
          python scripts/build_site.py
          python scripts/build_news.py
          python scripts/build_apps_index.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aiapps/ index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish aiapps site ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git pull --rebase
            git push
          else
            echo "No changes to commit"
          fi
